function CartaoTab({ transacoes, orcamentos, onImport, onAddManual, onEditCategoria, onDelete, onClearAll }) {
  const [modalManualOpen, setModalManualOpen] = useState(false);
  const now = new Date();
  const [mes, setMes] = useState(now.getMonth() + 1);
  const [ano, setAno] = useState(now.getFullYear());
  const mk = monthKey(ano, mes);

  const doMes = useMemo(() => [...transacoes.filter((t) => (t.mesFatura || t.data.slice(0, 7)) === mk)].sort((a, b) => a.data.localeCompare(b.data)), [transacoes, mk]);
  const totalMes = doMes.reduce((s, t) => s + t.valor, 0);

  // últimos 6 meses para comparativo
  const ultimosMeses = useMemo(() => {
    const arr = [];
    for (let i = 5; i >= 0; i -= 1) {
      const d = new Date(ano, mes - 1 - i, 1);
      arr.push({ mk: monthKey(d.getFullYear(), d.getMonth() + 1), label: `${MESES[d.getMonth()].slice(0, 3)}/${String(d.getFullYear()).slice(2)}` });
    }
    return arr;
  }, [ano, mes]);

  const topCategorias = useMemo(() => {
    const totals = {};
    transacoes.forEach((t) => { totals[t.categoria] = (totals[t.categoria] || 0) + t.valor; });
    return Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([c]) => c);
  }, [transacoes]);

  const dadosComparativo = useMemo(() => ultimosMeses.map(({ mk: k, label }) => {
    const row = { mes: label };
    topCategorias.forEach((c) => {
      row[c] = transacoes.filter((t) => (t.mesFatura || t.data.slice(0, 7)) === k && t.categoria === c).reduce((s, t) => s + t.valor, 0);
    });
    return row;
  }), [ultimosMeses, topCategorias, transacoes]);

  const CORES = ['#059669', '#34d399', '#a7f3d0', '#fbbf24', '#f87171'];

  const orcadoRealizado = useMemo(() => {
    const map = {};
    doMes.forEach((t) => { map[t.categoria] = (map[t.categoria] || 0) + t.valor; });
    return CATEGORIAS_PAGAR
      .map((c) => ({ categoria: c, realizado: map[c] || 0, orcado: orcamentos?.[c]?.[mk] ?? 0 }))
      .filter((l) => l.realizado > 0 || l.orcado > 0)
      .sort((a, b) => Math.max(b.orcado, b.realizado) - Math.max(a.orcado, a.realizado));
  }, [doMes, orcamentos, mk]);

  return (
    <div className="pb-24 space-y-4">
      <Card className="p-4">
        <div className="flex items-center justify-between gap-2">
          <SectionTitle icon="Pencil" title="Lançar compra do cartão" subtitle="Categorize agora, confirme quando o extrato chegar" right={null} />
        </div>
        <button
          onClick={() => setModalManualOpen(true)}
          className="flex items-center justify-center gap-1.5 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-2.5 rounded-xl transition"
        >
          <Icon name="Plus" size={15} /> Lançar compra agora
        </button>
      </Card>

      <ImportarExtrato onConfirm={onImport} pendentes={transacoes.filter((t) => t.confirmado === false)} />

      <div className="flex items-center justify-between">
        <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
        <div className="text-sm text-slate-500">Total no mês: <b className="text-red-500">{formatBRL(totalMes)}</b></div>
      </div>

      <Card className="overflow-hidden">
        <div className="p-4 pb-0 flex items-center justify-between gap-2">
          <h3 className="text-sm font-semibold text-slate-700">Lançamentos da fatura</h3>
          {transacoes.length > 0 && (
            <button
              onClick={() => {
                if (window.confirm && window.confirm('Isso vai apagar TODOS os lançamentos de cartão já importados (de todos os meses). Os lançamentos de Contas a Pagar não são afetados. Continuar?')) {
                  onClearAll();
                }
              }}
              className="flex items-center gap-1.5 text-xs font-medium text-red-500 hover:bg-red-50 px-2.5 py-1.5 rounded-lg transition shrink-0"
            >
              <Icon name="Trash2" size={13} /> Limpar tudo
            </button>
          )}
        </div>
        {doMes.length === 0 ? (
          <EmptyState text="Nenhum lançamento do cartão importado neste mês." />
        ) : (
          <div className="overflow-x-auto pf-scroll mt-3">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-[11px] uppercase tracking-wide text-slate-400 border-t border-b border-slate-100">
                  <th className="px-4 py-2 font-medium">Data</th>
                  <th className="px-2 py-2 font-medium">Descrição</th>
                  <th className="px-2 py-2 font-medium">Categoria</th>
                  <th className="px-2 py-2 font-medium text-right">Valor</th>
                  <th className="px-2 py-2 font-medium text-right">Ações</th>
                </tr>
              </thead>
              <tbody>
                {doMes.map((t) => (
                  <tr key={t.id} className={`border-b border-slate-50 hover:bg-emerald-50/30 transition ${t.confirmado === false ? 'bg-amber-50/40' : ''}`}>
                    <td className="px-4 py-2.5 whitespace-nowrap text-slate-500">
                      {formatDateBR(t.data)}
                      {t.data.slice(0, 7) !== mk && (
                        <div className="text-[10px] text-slate-400">compra de {MESES[Number(t.data.slice(5, 7)) - 1].slice(0, 3)}</div>
                      )}
                    </td>
                    <td className="px-2 py-2.5 text-slate-700 max-w-[160px]">
                      <div className="truncate">{t.descricao}</div>
                      {t.confirmado === false && (
                        <div className="text-[10px] text-amber-600 flex items-center gap-1 mt-0.5">
                          <Icon name="AlertTriangle" size={10} /> aguardando extrato
                        </div>
                      )}
                    </td>
                    <td className="px-2 py-2.5">
                      <select
                        value={t.categoria}
                        onChange={(e) => onEditCategoria({ ...t, categoria: e.target.value })}
                        className="border border-slate-200 rounded-lg px-1.5 py-1 text-xs bg-white"
                      >
                        {CATEGORIAS_PAGAR.map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </td>
                    <td className="px-2 py-2.5 text-right font-medium text-red-500 whitespace-nowrap">{formatBRL(t.valor)}</td>
                    <td className="px-2 py-2.5 text-right">
                      <button onClick={() => onDelete(t)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
                        <Icon name="Trash2" size={13} />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Card className="p-4">
        <SectionTitle icon="TrendingUp" title="Comparativo por categoria" subtitle="Últimos 6 meses · top 5 categorias no cartão" />
        {topCategorias.length === 0 ? <EmptyState text="Importe um extrato para ver o comparativo." /> : (
          <ColumnChart
            data={dadosComparativo}
            seriesKeys={topCategorias}
            seriesColors={Object.fromEntries(topCategorias.map((c, i) => [c, CORES[i % CORES.length]]))}
            stacked
            height={200}
          />
        )}
      </Card>

      <Card className="p-4">
        <SectionTitle icon="LayoutDashboard" title="Orçado x Realizado no cartão" subtitle="Quanto do orçamento da categoria já foi gasto no cartão este mês" />
        {orcadoRealizado.length === 0 ? <EmptyState text="Sem gastos de cartão neste mês." /> : (
          <div className="space-y-2">
            {orcadoRealizado.map((l) => {
              const estourou = l.orcado > 0 && l.realizado > l.orcado;
              const pct = l.orcado > 0 ? Math.min((l.realizado / l.orcado) * 100, 100) : 100;
              return (
                <div key={l.categoria}>
                  <div className="flex items-center justify-between text-xs mb-1">
                    <span className="text-slate-600">{l.categoria}</span>
                    <span className={estourou ? 'text-red-500 font-medium' : 'text-slate-500'}>
                      {formatBRL(l.realizado)}{l.orcado > 0 && ` / ${formatBRL(l.orcado)}`}
                    </span>
                  </div>
                  <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div className={`h-full rounded-full ${estourou ? 'bg-red-500' : 'bg-emerald-500'}`} style={{ width: `${pct}%` }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <LancamentoCartaoModal
        open={modalManualOpen}
        onClose={() => setModalManualOpen(false)}
        onSave={(data) => {
          onAddManual({ ...data, id: uid(), confirmado: false });
          setModalManualOpen(false);
        }}
      />
    </div>
  );
}

/* --------------------------------- Investimentos ---------------------------- */

const TIPOS_ATIVO = ['Renda Fixa', 'Ações', 'Fundos Imobiliários', 'Fundos', 'Criptomoedas', 'Poupança', 'Outro'];
const TIPOS_MOV = [
  { v: 'aporte', l: 'Aporte' },
  { v: 'resgate', l: 'Resgate' },
  { v: 'rendimento', l: 'Rendimento' },
];

function patrimonioDoAtivo(ativo, movimentacoes) {
  return movimentacoes
    .filter((m) => m.ativoId === ativo.id)
    .reduce((s, m) => {
      if (m.tipo === 'resgate') return s - m.valor;
      return s + m.valor;
    }, ativo.aporteInicial || 0);
}

  if (!open) return null;

              />

function AtivoCard({ ativo, movimentacoes, onEdit, onDelete, onAddMov, onDeleteMov }) {
  const patrimonio = patrimonioDoAtivo(ativo, movimentacoes);
  const minhas = movimentacoes.filter((m) => m.ativoId === ativo.id).sort((a, b) => b.data.localeCompare(a.data));
  const ganho = patrimonio - (ativo.aporteInicial || 0) - minhas.filter((m) => m.tipo === 'aporte').reduce((s, m) => s + m.valor, 0) + minhas.filter((m) => m.tipo === 'resgate').reduce((s, m) => s + m.valor, 0);

  return (
    <Card className="p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div>
          <h4 className="text-sm font-semibold text-slate-800">{ativo.nome}</h4>
          <span className="text-[11px] text-slate-400">{ativo.tipo}</span>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={() => onEdit(ativo)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
            <Icon name="Pencil" size={13} />
          </button>
          <button onClick={() => onDelete(ativo)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
            <Icon name="Trash2" size={13} />
          </button>
        </div>
      </div>

      <div className="text-xl font-semibold text-slate-800">{formatBRL(patrimonio)}</div>
      <div className={`text-xs mt-0.5 ${ganho < 0 ? 'text-red-500' : 'text-emerald-600'}`}>
        {ganho >= 0 ? '+' : ''}{formatBRL(ganho)} em rendimento
      </div>

      <button
        onClick={() => onAddMov(ativo)}
        className="flex items-center justify-center gap-1.5 w-full mt-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-medium px-3 py-2 rounded-xl transition"
      >
        <Icon name="Plus" size={13} /> Registrar movimentação
      </button>

      {minhas.length > 0 && (
        <details className="mt-3 group">
          <summary className="text-xs font-medium text-slate-500 cursor-pointer select-none list-none flex items-center gap-1">
            <Icon name="ChevronDown" size={13} className="transition group-open:rotate-180" /> Histórico ({minhas.length})
          </summary>
          <div className="mt-2 space-y-1 max-h-40 overflow-y-auto pf-scroll">
            {minhas.map((m) => (
              <div key={m.id} className="flex items-center justify-between text-xs bg-slate-50 rounded-lg px-2.5 py-1.5">
                <span className="text-slate-500">{formatDateBR(m.data)} · {TIPOS_MOV.find((t) => t.v === m.tipo)?.l}</span>
                <div className="flex items-center gap-2">
                  <span className={m.tipo === 'resgate' ? 'text-red-500 font-medium' : 'text-emerald-600 font-medium'}>
                    {m.tipo === 'resgate' ? '-' : '+'}{formatBRL(m.valor)}
                  </span>
                  <button onClick={() => onDeleteMov(m)} className="text-slate-300 hover:text-red-500">
                    <Icon name="X" size={12} />
                  </button>
                </div>
              </div>
            ))}
          </div>
        </details>
      )}
    </Card>
  );
}

function statusEmprestimo(e) {
  const recebido = e.valorRecebido || 0;
  if (recebido >= e.valor) return 'Recebido';
  if (recebido > 0) return 'Parcial';
  if (e.dataPrevista && e.dataPrevista < todayStr()) return 'Em atraso';
  return 'A receber';
}

function RecebimentoModal({ open, onClose, onSave, emprestimo }) {
  const [valor, setValor] = useState('');

  useEffect(() => { if (open) setValor(''); }, [open]);

  if (!open || !emprestimo) return null;
  const recebidoAtual = emprestimo.valorRecebido || 0;
  const falta = Math.max(emprestimo.valor - recebidoAtual, 0);
  const numero = Number(valor);
  const valido = numero > 0;

  const submit = () => {
    if (!valido) return;
    onSave(emprestimo, numero);
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-sm p-5 sm:p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold text-slate-800">Registrar recebimento · {emprestimo.pessoa}</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>
        <p className="text-xs text-slate-500 mb-3">
          Já recebido: <b className="text-emerald-600">{formatBRL(recebidoAtual)}</b> de {formatBRL(emprestimo.valor)} · Falta {formatBRL(falta)}
        </p>
        <label className="text-xs font-medium text-slate-500">Valor recebido agora (R$)</label>
        <input
          type="number" min="0" step="0.01" autoFocus
          value={valor}
          onChange={(e) => setValor(e.target.value)}
          placeholder="0,00"
          className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
        />
        {numero > falta && falta > 0 && (
          <p className="text-[11px] text-amber-600 mt-1.5">
            Esse valor é maior que o restante — vou registrar só {formatBRL(falta)} (o total da dívida).
          </p>
        )}
        <button
          onClick={submit}
          disabled={!valido}
          className="w-full mt-4 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"
        >
          Confirmar recebimento
        </button>
      </div>
    </div>
  );
}
function EmprestimoModal({ open, onClose, onSave, initial }) {
  const blank = { pessoa: '', descricao: '', valor: '', data: todayStr(), dataPrevista: '' };
  const [form, setForm] = useState(blank);

  useEffect(() => {
    if (open) setForm(initial ? { ...initial, valor: String(initial.valor) } : blank);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, initial]);

  if (!open) return null;
  const valid = form.pessoa.trim() && Number(form.valor) > 0;

  const submit = () => {
    if (!valid) return;
    onSave({ ...form, valor: Number(form.valor), valorRecebido: initial ? initial.valorRecebido || 0 : 0 });
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-md p-5 sm:p-6 max-h-[90vh] overflow-y-auto pf-scroll">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold text-slate-800">{initial ? 'Editar valor a receber' : 'Novo valor a receber'}</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium text-slate-500">Quem deve</label>
            <input
              value={form.pessoa}
              onChange={(e) => setForm({ ...form, pessoa: e.target.value })}
              placeholder="Nome da pessoa"
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500">Descrição</label>
            <input
              value={form.descricao}
              onChange={(e) => setForm({ ...form, descricao: e.target.value })}
              placeholder="Ex: Empréstimo, rateio de viagem..."
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-slate-500">Valor (R$)</label>
              <input
                type="number" min="0" step="0.01"
                value={form.valor}
                onChange={(e) => setForm({ ...form, valor: e.target.value })}
                placeholder="0,00"
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-500">Data do empréstimo</label>
              <input
                type="date"
                value={form.data}
                onChange={(e) => setForm({ ...form, data: e.target.value })}
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500">Previsão de devolução (opcional)</label>
            <input
              type="date"
              value={form.dataPrevista}
              onChange={(e) => setForm({ ...form, dataPrevista: e.target.value })}
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
        </div>
        <button
          onClick={submit}
          disabled={!valid}
          className="w-full mt-5 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"
        >
          Salvar
        </button>
      </div>
    </div>
  );
}

function InvestimentosTab({
  ativos, movimentacoes, meta, emprestimos,
  onAddAtivo, onEditAtivo, onDeleteAtivo,
  onAddMov, onDeleteMov,
  onSaveMeta,
  onAddEmprestimo, onEditEmprestimo, onDeleteEmprestimo, onReceberEmprestimo,
}) {
  const [ativoModalOpen, setAtivoModalOpen] = useState(false);
  const [editandoAtivo, setEditandoAtivo] = useState(null);
  const [movAtivo, setMovAtivo] = useState(null);
  const [emprestimoModalOpen, setEmprestimoModalOpen] = useState(false);
  const [editandoEmprestimo, setEditandoEmprestimo] = useState(null);
  const [recebendoEmprestimo, setRecebendoEmprestimo] = useState(null);
  const [periodoView, setPeriodoView] = useState('mes'); // mes | total
  const now = new Date();
  const [mes, setMes] = useState(now.getMonth() + 1);
  const [ano, setAno] = useState(now.getFullYear());
  const mk = monthKey(ano, mes);

  const patrimonioTotal = useMemo(
    () => ativos.reduce((s, a) => s + patrimonioDoAtivo(a, movimentacoes), 0),
    [ativos, movimentacoes],
  );

  const movDoPeriodo = useMemo(
    () => (periodoView === 'total' ? movimentacoes : movimentacoes.filter((m) => m.data.slice(0, 7) === mk)),
    [movimentacoes, periodoView, mk],
  );
  const totalAportes = movDoPeriodo.filter((m) => m.tipo === 'aporte').reduce((s, m) => s + m.valor, 0);
  const totalResgates = movDoPeriodo.filter((m) => m.tipo === 'resgate').reduce((s, m) => s + m.valor, 0);
  const totalRendimento = movDoPeriodo.filter((m) => m.tipo === 'rendimento').reduce((s, m) => s + m.valor, 0);

  const ultimosMeses = useMemo(() => {
    const arr = [];
    for (let i = 5; i >= 0; i -= 1) {
      const d = new Date(ano, mes - 1 - i, 1);
      arr.push({ mk: monthKey(d.getFullYear(), d.getMonth() + 1), label: `${MESES[d.getMonth()].slice(0, 3)}/${String(d.getFullYear()).slice(2)}` });
    }
    return arr;
  }, [ano, mes]);

  const dadosPeriodo = useMemo(() => ultimosMeses.map(({ mk: k, label }) => ({
    mes: label,
    Aportes: movimentacoes.filter((m) => m.data.slice(0, 7) === k && m.tipo === 'aporte').reduce((s, m) => s + m.valor, 0),
    Rendimento: movimentacoes.filter((m) => m.data.slice(0, 7) === k && m.tipo === 'rendimento').reduce((s, m) => s + m.valor, 0),
  })), [ultimosMeses, movimentacoes]);

  // Meta de investimento
  const [metaForm, setMetaForm] = useState({ valorAlvo: meta?.valorAlvo || '', prazo: meta?.prazo || '' });
  useEffect(() => { setMetaForm({ valorAlvo: meta?.valorAlvo || '', prazo: meta?.prazo || '' }); }, [meta]);
  const metaValorAlvo = Number(meta?.valorAlvo) || 0;
  const metaFalta = Math.max(metaValorAlvo - patrimonioTotal, 0);
  const metaPct = metaValorAlvo > 0 ? Math.min((patrimonioTotal / metaValorAlvo) * 100, 100) : 0;
  const metaMeses = meta?.prazo ? monthsUntil(meta.prazo) : null;
  const metaPorMes = metaMeses && metaMeses > 0 ? metaFalta / metaMeses : null;

  // Empréstimos
  const emprestimosPendentes = emprestimos.filter((e) => statusEmprestimo(e) !== 'Recebido');
  const totalPendente = emprestimosPendentes.reduce((s, e) => s + (e.valor - (e.valorRecebido || 0)), 0);

  return (
    <div className="pb-24 space-y-4">
      <Card className="p-4">
        <SectionTitle icon="Landmark" title="Patrimônio investido" subtitle={`${ativos.length} ativo${ativos.length !== 1 ? 's' : ''} cadastrado${ativos.length !== 1 ? 's' : ''}`} />
        <div className="text-2xl font-semibold text-slate-800 mb-3">{formatBRL(patrimonioTotal)}</div>
        <button
          onClick={() => { setEditandoAtivo(null); setAtivoModalOpen(true); }}
          className="flex items-center justify-center gap-1.5 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-2.5 rounded-xl transition"
        >
          <Icon name="Plus" size={15} /> Novo ativo
        </button>
      </Card>

      {ativos.length === 0 ? (
        <EmptyState text="Cadastre seu primeiro ativo para começar a acompanhar." />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {[...ativos].sort((a, b) => patrimonioDoAtivo(b, movimentacoes) - patrimonioDoAtivo(a, movimentacoes)).map((a) => (
            <AtivoCard
              key={a.id}
              ativo={a}
              movimentacoes={movimentacoes}
              onEdit={(at) => { setEditandoAtivo(at); setAtivoModalOpen(true); }}
              onDelete={onDeleteAtivo}
              onAddMov={setMovAtivo}
              onDeleteMov={onDeleteMov}
            />
          ))}
        </div>
      )}

      <Card className="p-4">
        <SectionTitle icon="TrendingUp" title="Aportes e rendimento" subtitle="Por período e no total" />
        <div className="flex items-center justify-between mb-3">
          {periodoView === 'mes' ? (
            <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
          ) : <div />}
          <div className="flex bg-emerald-50 rounded-xl p-1 text-xs font-medium">
            {[{ v: 'mes', l: 'Mês' }, { v: 'total', l: 'Total geral' }].map((op) => (
              <button
                key={op.v}
                onClick={() => setPeriodoView(op.v)}
                className={`px-3 py-1.5 rounded-lg transition ${periodoView === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-600/70'}`}
              >
                {op.l}
              </button>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2 mb-4">
          <div className="bg-emerald-50/60 rounded-xl px-3 py-2">
            <div className="text-[11px] text-slate-500">Aportes</div>
            <div className="text-sm font-semibold text-emerald-700">{formatBRL(totalAportes)}</div>
          </div>
          <div className="bg-red-50/60 rounded-xl px-3 py-2">
            <div className="text-[11px] text-slate-500">Resgates</div>
            <div className="text-sm font-semibold text-red-500">{formatBRL(totalResgates)}</div>
          </div>
          <div className="bg-emerald-50/60 rounded-xl px-3 py-2">
            <div className="text-[11px] text-slate-500">Rendimento</div>
            <div className="text-sm font-semibold text-emerald-700">{formatBRL(totalRendimento)}</div>
          </div>
        </div>
        <ColumnChart
          data={dadosPeriodo}
          seriesKeys={['Aportes', 'Rendimento']}
          seriesColors={{ Aportes: '#6ee7b7', Rendimento: '#059669' }}
          height={180}
        />
      </Card>

      <Card className="p-4">
        <SectionTitle icon="Target" title="Meta de investimento" subtitle="Quanto falta para o patrimônio alvo" />
        <div className="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label className="text-xs font-medium text-slate-500">Valor alvo (R$)</label>
            <input
              type="number" min="0" step="0.01"
              value={metaForm.valorAlvo}
              onChange={(e) => setMetaForm({ ...metaForm, valorAlvo: e.target.value })}
              onBlur={() => onSaveMeta({ valorAlvo: Number(metaForm.valorAlvo) || 0, prazo: metaForm.prazo })}
              placeholder="0,00"
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500">Prazo (opcional)</label>
            <input
              type="date"
              value={metaForm.prazo}
              onChange={(e) => setMetaForm({ ...metaForm, prazo: e.target.value })}
              onBlur={() => onSaveMeta({ valorAlvo: Number(metaForm.valorAlvo) || 0, prazo: metaForm.prazo })}
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
        </div>
        {metaValorAlvo > 0 && (
          <>
            <div className="flex items-center justify-between text-xs mb-1">
              <span className="text-slate-500">{formatBRL(patrimonioTotal)} de {formatBRL(metaValorAlvo)}</span>
              <span className="font-medium text-emerald-600">{metaPct.toFixed(0)}%</span>
            </div>
            <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden mb-2">
              <div className="h-full bg-emerald-500 rounded-full transition-all" style={{ width: `${metaPct}%` }} />
            </div>
            {metaFalta > 0 ? (
              <div className="text-xs text-amber-600">
                Faltam {formatBRL(metaFalta)}
                {metaPorMes != null && <> · ~{formatBRL(metaPorMes)}/mês para chegar no prazo</>}
              </div>
            ) : (
              <div className="text-xs font-medium text-emerald-600">Meta atingida! 🎉</div>
            )}
          </>
        )}
      </Card>

      <Card className="overflow-hidden">
        <div className="p-4 flex items-center justify-between">
          <SectionTitle icon="Users" title="Valores pendentes a receber" subtitle={`${emprestimosPendentes.length} em aberto · ${formatBRL(totalPendente)}`} right={null} />
          <button
            onClick={() => { setEditandoEmprestimo(null); setEmprestimoModalOpen(true); }}
            className="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-2 rounded-xl transition shrink-0"
          >
            <Icon name="Plus" size={14} /> Novo
          </button>
        </div>
        {emprestimos.length === 0 ? (
          <EmptyState text="Nenhum valor emprestado registrado." />
        ) : (
          <div className="overflow-x-auto pf-scroll">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-[11px] uppercase tracking-wide text-slate-400 border-t border-b border-slate-100">
                  <th className="px-4 py-2 font-medium">Quem deve</th>
                  <th className="px-2 py-2 font-medium hidden sm:table-cell">Descrição</th>
                  <th className="px-2 py-2 font-medium text-right">Valor</th>
                  <th className="px-2 py-2 font-medium">Status</th>
                  <th className="px-2 py-2 font-medium text-right">Ações</th>
                </tr>
              </thead>
              <tbody>
                {[...emprestimos].sort((a, b) => (b.valor - (b.valorRecebido || 0)) - (a.valor - (a.valorRecebido || 0))).map((e) => {
                  const status = statusEmprestimo(e);
                  const recebido = e.valorRecebido || 0;
                  return (
                    <tr key={e.id} className="border-b border-slate-50 hover:bg-emerald-50/30 transition">
                      <td className="px-4 py-2.5 text-slate-700">{e.pessoa}</td>
                      <td className="px-2 py-2.5 hidden sm:table-cell text-slate-500 max-w-[160px] truncate">{e.descricao}</td>
                      <td className="px-2 py-2.5 text-right whitespace-nowrap">
                        <div className="font-medium text-emerald-600">{formatBRL(e.valor)}</div>
                        {status === 'Parcial' && (
                          <div className="text-[10px] text-blue-500">recebido {formatBRL(recebido)}</div>
                        )}
                      </td>
                      <td className="px-2 py-2.5"><Badge status={status} /></td>
                      <td className="px-2 py-2.5">
                        <div className="flex items-center justify-end gap-1">
                          {status !== 'Recebido' && (
                            <button onClick={() => setRecebendoEmprestimo(e)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                              <Icon name="PiggyBank" size={13} />
                            </button>
                          )}
                          <button onClick={() => { setEditandoEmprestimo(e); setEmprestimoModalOpen(true); }} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                            <Icon name="Pencil" size={13} />
                          </button>
                          <button onClick={() => onDeleteEmprestimo(e)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
                            <Icon name="Trash2" size={13} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <AtivoModal
        open={ativoModalOpen}
        onClose={() => setAtivoModalOpen(false)}
        initial={editandoAtivo}
        onSave={(data) => {
          if (editandoAtivo) onEditAtivo({ ...editandoAtivo, ...data });
          else onAddAtivo({ ...data, id: uid() });
          setAtivoModalOpen(false);
        }}
      />
      <MovimentacaoModal
        open={!!movAtivo}
        ativo={movAtivo}
        onClose={() => setMovAtivo(null)}
        onSave={(data) => { onAddMov({ ...data, id: uid() }); setMovAtivo(null); }}
      />
      <EmprestimoModal
        open={emprestimoModalOpen}
        initial={editandoEmprestimo}
        onClose={() => setEmprestimoModalOpen(false)}
        onSave={(data) => {
          if (editandoEmprestimo) onEditEmprestimo({ ...editandoEmprestimo, ...data });
          else onAddEmprestimo({ ...data, id: uid() });
          setEmprestimoModalOpen(false);
        }}
      />
      <RecebimentoModal
        open={!!recebendoEmprestimo}
        emprestimo={recebendoEmprestimo}
        onClose={() => setRecebendoEmprestimo(null)}
        onSave={(emprestimo, valor) => {
          onReceberEmprestimo(emprestimo, valor);
          setRecebendoEmprestimo(null);
        }}
      />
    </div>
  );
}

/* --------------------------------- App raiz -------------------------------- */

const TABS = [
  { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
  { id: 'receber', label: 'A Receber', icon: 'ArrowDownCircle' },
  { id: 'pagar', label: 'A Pagar', icon: 'ArrowUpCircle' },
  { id: 'cartao', label: 'Cartão', icon: 'CreditCard' },
  { id: 'investimentos', label: 'Investimentos', icon: 'TrendingUp' },
  { id: 'metas', label: 'Sonhos & Metas', icon: 'Sparkles' },
];

function App() {
  const [tab, setTab] = useState('dashboard');
  const [loading, setLoading] = useState(true);
  const [lancamentos, setLancamentos] = useState([]);
  const [orcamentos, setOrcamentos] = useState({});
  const [config, setConfig] = useState({ saldoInicial: {} });
  const [metas, setMetas] = useState([]);
  const [cartaoTransacoes, setCartaoTransacoes] = useState([]);
  const [investAtivos, setInvestAtivos] = useState([]);
  const [investMovimentacoes, setInvestMovimentacoes] = useState([]);
  const [investMeta, setInvestMeta] = useState({ valorAlvo: 0, prazo: '' });
  const [investEmprestimos, setInvestEmprestimos] = useState([]);
  const [errorMsg, setErrorMsg] = useState(null);
  const [savingState, setSavingState] = useState('idle'); // idle | saving | saved | error
  const [ultimaSincronia, setUltimaSincronia] = useState(null);
  const [pendentes, setPendentes] = useState([]); // alterações que falharam ao salvar, aguardando nova tentativa

  const carregarDados = useCallback(async (silencioso = false) => {
    if (!silencioso) setLoading(true);
    try {
      const dados = await sbGetAll();
      if (dados.lancamentos) setLancamentos(dados.lancamentos);
      if (dados.orcamentos) setOrcamentos(dados.orcamentos);
      if (dados.config) setConfig(dados.config);
      if (dados.metas) setMetas(dados.metas);
      if (dados.cartaoTransacoes) setCartaoTransacoes(dados.cartaoTransacoes);
      if (dados.investAtivos) setInvestAtivos(dados.investAtivos);
      if (dados.investMovimentacoes) setInvestMovimentacoes(dados.investMovimentacoes);
      if (dados.investMeta) setInvestMeta(dados.investMeta);
      if (dados.investEmprestimos) setInvestEmprestimos(dados.investEmprestimos);
      setUltimaSincronia(new Date());
      if (silencioso) setErrorMsg(null);
    } catch (e) {
      // eslint-disable-next-line no-console
      console.error('Falha ao carregar dados do Supabase:', e);
      if (!silencioso) {
        const motivo = e?.message ? ` (${e.message})` : '';
        setErrorMsg(`Não foi possível carregar os dados salvos${motivo}. Verifique sua conexão e tente recarregar a página.`);
      }
    } finally {
      if (!silencioso) setLoading(false);
    }
  }, []);

  useEffect(() => {
    carregarDados(false);
  }, [carregarDados]);

  // Atualização automática: busca dados novos a cada 20s, para refletir o que a outra
  // pessoa salvou em outro dispositivo, sem precisar recarregar a página manualmente.
  useEffect(() => {
    const intervalo = setInterval(() => {
      if (document.visibilityState === 'visible' && pendentes.length === 0) carregarDados(true);
    }, 20000);
    const aoFocar = () => { if (pendentes.length === 0) carregarDados(true); };
    window.addEventListener('focus', aoFocar);
    document.addEventListener('visibilitychange', aoFocar);
    return () => {
      clearInterval(intervalo);
      window.removeEventListener('focus', aoFocar);
      document.removeEventListener('visibilitychange', aoFocar);
    };
  }, [carregarDados, pendentes.length]);

  const flashSaved = () => {
    setSavingState('saved');
    setTimeout(() => setSavingState((s) => (s === 'saved' ? 'idle' : s)), 1500);
  };

  const persist = useCallback(async (key, value, setter, tentativa = 0) => {
    setter(value);
    setSavingState('saving');
    try {
      await sbSet(key, value);
      flashSaved();
      setPendentes((prev) => prev.filter((p) => p.key !== key));
    } catch (e) {
      // eslint-disable-next-line no-console
      console.error(`Falha ao salvar "${key}" (tentativa ${tentativa + 1}/3):`, e);
      if (tentativa < 2) {
        await new Promise((r) => setTimeout(r, 1000 * (tentativa + 1)));
        return persist(key, value, setter, tentativa + 1);
      }
      setSavingState('error');
      const motivo = e?.message ? ` (${e.message})` : '';
      setErrorMsg(`Não consegui salvar sua última alteração${motivo}. Ela continua aparecendo aqui, mas só neste dispositivo até você tentar salvar de novo — toque em "Tentar novamente" abaixo.`);
      setPendentes((prev) => [...prev.filter((p) => p.key !== key), { key, value, setter }]);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (pendentes.length === 0) {
      setErrorMsg((m) => (m && m.startsWith('Não consegui salvar') ? null : m));
      if (savingState === 'error') setSavingState('idle');
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendentes.length]);

  const retentarPendentes = () => {
    const lista = [...pendentes];
    lista.forEach((p) => persist(p.key, p.value, p.setter));
  };

  const addLancamentos = (novos) => persist('lancamentos', [...lancamentos, ...novos], setLancamentos);
  const editLancamento = (editado) => persist('lancamentos', lancamentos.map((t) => (t.id === editado.id ? editado : t)), setLancamentos);
  const toggleQuitado = (t) => persist('lancamentos', lancamentos.map((x) => (x.id === t.id ? { ...x, quitado: !x.quitado } : x)), setLancamentos);
  const duplicar = (t) => persist('lancamentos', [...lancamentos, { ...t, id: uid(), data: todayStr(), quitado: false }], setLancamentos);
  const excluir = (t) => {
    if (window.confirm && !window.confirm(`Excluir o lançamento "${t.descricao}"?`)) return;
    persist('lancamentos', lancamentos.filter((x) => x.id !== t.id), setLancamentos);
  };

  const setOrcamento = (categoria, mk, valor) => {
    const next = { ...orcamentos, [categoria]: { ...(orcamentos[categoria] || {}), [mk]: valor } };
    persist('orcamentos', next, setOrcamentos);
  };

  const setSaldoInicial = (mk, valor) => {
    const next = { ...config, saldoInicial: { ...(config.saldoInicial || {}), [mk]: valor } };
    persist('config', next, setConfig);
  };

  const addMeta = (meta) => persist('metas', [...metas, meta], setMetas);
  const editMeta = (editada) => persist('metas', metas.map((m) => (m.id === editada.id ? editada : m)), setMetas);
  const deleteMeta = (meta) => persist('metas', metas.filter((m) => m.id !== meta.id), setMetas);
  const aportarMeta = (editada) => persist('metas', metas.map((m) => (m.id === editada.id ? editada : m)), setMetas);

  const importarCartao = (novas, atualizacoes = []) => {
    let base = cartaoTransacoes;
    if (atualizacoes.length > 0) {
      base = base.map((t) => {
        const upd = atualizacoes.find((a) => a.id === t.id);
        return upd ? { ...t, ...upd.patch } : t;
      });
    }
    persist('cartaoTransacoes', [...base, ...novas], setCartaoTransacoes);
  };
  const addManualCartao = (entry) => persist('cartaoTransacoes', [...cartaoTransacoes, entry], setCartaoTransacoes);
  const editarCategoriaCartao = (editada) => persist('cartaoTransacoes', cartaoTransacoes.map((t) => (t.id === editada.id ? editada : t)), setCartaoTransacoes);
  const excluirCartao = (t) => persist('cartaoTransacoes', cartaoTransacoes.filter((x) => x.id !== t.id), setCartaoTransacoes);
  const limparCartao = () => persist('cartaoTransacoes', [], setCartaoTransacoes);

  const addAtivo = (ativo) => persist('investAtivos', [...investAtivos, ativo], setInvestAtivos);
  const editAtivo = (editado) => persist('investAtivos', investAtivos.map((a) => (a.id === editado.id ? editado : a)), setInvestAtivos);
  const deleteAtivo = (ativo) => {
    if (window.confirm && !window.confirm(`Excluir o ativo "${ativo.nome}" e todo o seu histórico?`)) return;
    persist('investAtivos', investAtivos.filter((a) => a.id !== ativo.id), setInvestAtivos);
    persist('investMovimentacoes', investMovimentacoes.filter((m) => m.ativoId !== ativo.id), setInvestMovimentacoes);
  };
  const addMov = (mov) => persist('investMovimentacoes', [...investMovimentacoes, mov], setInvestMovimentacoes);
  const deleteMov = (mov) => persist('investMovimentacoes', investMovimentacoes.filter((m) => m.id !== mov.id), setInvestMovimentacoes);
  const saveInvestMeta = (novaMeta) => persist('investMeta', novaMeta, setInvestMeta);
  const addEmprestimo = (e) => persist('investEmprestimos', [...investEmprestimos, e], setInvestEmprestimos);
  const editEmprestimo = (editado) => persist('investEmprestimos', investEmprestimos.map((x) => (x.id === editado.id ? editado : x)), setInvestEmprestimos);
  const deleteEmprestimo = (e) => persist('investEmprestimos', investEmprestimos.filter((x) => x.id !== e.id), setInvestEmprestimos);
  const receberEmprestimo = (emprestimo, valor) => {
    const recebidoAtual = emprestimo.valorRecebido || 0;
    const novoRecebido = Math.min(recebidoAtual + valor, emprestimo.valor);
    persist('investEmprestimos', investEmprestimos.map((x) => (x.id === emprestimo.id ? { ...x, valorRecebido: novoRecebido } : x)), setInvestEmprestimos);
  };

  return (
    <div className="pf-root min-h-screen bg-gradient-to-b from-emerald-50/40 to-white">
      <GlobalStyle />

      <header className="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-emerald-100">
        <div className="max-w-4xl mx-auto px-4 pt-4">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white">
                <Icon name="Wallet" size={18} />
              </div>
              <h1 className="text-[15px] font-semibold text-slate-800">Finanças da Casa</h1>
            </div>
            <div className="flex items-center gap-2">
              <div className="text-[11px] text-slate-400 flex items-center gap-1 min-w-[70px] justify-end">
                {savingState === 'saving' && <><Icon name="Loader2" size={12} className="animate-spin" /> salvando…</>}
                {savingState === 'saved' && <><Icon name="Cloud" size={12} className="text-emerald-500" /> salvo</>}
                {savingState === 'error' && <><Icon name="CloudOff" size={12} className="text-red-500" /> erro ao salvar</>}
                {savingState === 'idle' && ultimaSincronia && (
                  <span title={ultimaSincronia.toLocaleString('pt-BR')}>
                    atualizado {ultimaSincronia.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}
                  </span>
                )}
              </div>
              <button
                onClick={() => carregarDados(true)}
                title="Buscar atualizações agora"
                className="w-8 h-8 flex items-center justify-center rounded-lg text-emerald-600 hover:bg-emerald-50 transition"
              >
                <Icon name="RefreshCw" size={15} />
              </button>
            </div>
          </div>

          <nav className="flex gap-1 mt-3 overflow-x-auto pf-scroll -mx-4 px-4">
            {TABS.map((t) => {
              const active = tab === t.id;
              return (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`flex items-center gap-1.5 px-3 py-2 text-xs font-medium whitespace-nowrap border-b-2 transition ${active ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-400 hover:text-slate-600'}`}
                >
                  <Icon name={t.icon} size={14} /> {t.label}
                </button>
              );
            })}
          </nav>
        </div>
      </header>

      <main className="max-w-4xl mx-auto px-4 pt-4">
        {errorMsg && (
          <div className="mb-4 flex items-start gap-2 bg-red-50 border border-red-100 text-red-600 text-xs rounded-xl px-3 py-2.5">
            <Icon name="AlertTriangle" size={14} className="mt-0.5 shrink-0" />
            <span className="flex-1">{errorMsg}</span>
            {pendentes.length > 0 && (
              <button
                onClick={retentarPendentes}
                className="flex items-center gap-1 shrink-0 bg-red-100 hover:bg-red-200 text-red-700 font-medium px-2 py-1 rounded-lg"
              >
                <Icon name="RefreshCw" size={12} /> Tentar novamente
              </button>
            )}
            <button onClick={() => setErrorMsg(null)} className="shrink-0 text-red-400 hover:text-red-600"><Icon name="X" size={13} /></button>
          </div>
        )}

        {loading ? (
          <div className="flex items-center justify-center py-24 text-emerald-500">
            <Icon name="Loader2" size={22} className="animate-spin" />
          </div>
        ) : (
          <>
            {tab === 'dashboard' && (
              <DashboardTab
                lancamentos={lancamentos}
                orcamentos={orcamentos}
                onSetOrcamento={setOrcamento}
                config={config}
                onSetSaldoInicial={setSaldoInicial}
              />
            )}
            {tab === 'receber' && (
              <ContasTable
                tipo="receber"
                categorias={CATEGORIAS_RECEBER}
                lancamentos={lancamentos}
                onAdd={addLancamentos}
                onEdit={editLancamento}
                onToggleQuitado={toggleQuitado}
                onDuplicate={duplicar}
                onDelete={excluir}
              />
            )}
            {tab === 'pagar' && (
              <ContasTable
                tipo="pagar"
                categorias={CATEGORIAS_PAGAR}
                lancamentos={lancamentos}
                onAdd={addLancamentos}
                onEdit={editLancamento}
                onToggleQuitado={toggleQuitado}
                onDuplicate={duplicar}
                onDelete={excluir}
              />
            )}
            {tab === 'cartao' && (
              <CartaoTab
                transacoes={cartaoTransacoes}
                orcamentos={orcamentos}
                onImport={importarCartao}
                onAddManual={addManualCartao}
                onEditCategoria={editarCategoriaCartao}
                onDelete={excluirCartao}
                onClearAll={limparCartao}
              />
            )}
            {tab === 'investimentos' && (
              <InvestimentosTab
                ativos={investAtivos}
                movimentacoes={investMovimentacoes}
                meta={investMeta}
                emprestimos={investEmprestimos}
                onAddAtivo={addAtivo}
                onEditAtivo={editAtivo}
                onDeleteAtivo={deleteAtivo}
                onAddMov={addMov}
                onDeleteMov={deleteMov}
                onSaveMeta={saveInvestMeta}
                onAddEmprestimo={addEmprestimo}
                onEditEmprestimo={editEmprestimo}
                onDeleteEmprestimo={deleteEmprestimo}
                onReceberEmprestimo={receberEmprestimo}
              />
            )}
            {tab === 'metas' && (
              <MetasTab
                metas={metas}
                onAdd={addMeta}
                onEdit={editMeta}
                onDelete={deleteMeta}
                onAportar={aportarMeta}
              />
            )}
          </>
        )}
      </main>
    </div>
  );
}

const raizApp = ReactDOM.createRoot(document.getElementById('root'));
raizApp.render(<App />);
</script>

<script>
  (function () {
    var fonte = document.getElementById('app-source').textContent;
    var resultado = Babel.transform(fonte, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'app.jsx',
    });
    var script = document.createElement('script');
    script.textContent = resultado.code;
    document.body.appendChild(script);
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
