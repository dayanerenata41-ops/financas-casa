async function sbGetAll() {
  const res = await fetch(`${SUPABASE_URL}/dados?select=chave,valor`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  if (!res.ok) {
    const texto = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}${texto ? `: ${texto.slice(0, 200)}` : ''}`);
  }
  const linhas = await res.json();
  const mapa = {};
  linhas.forEach((l) => { mapa[l.chave] = l.valor; });
  return mapa;
}

async function sbSet(chave, valor) {
  const res = await fetch(`${SUPABASE_URL}/dados?on_conflict=chave`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify([{ chave, valor }]),
  });
  if (!res.ok) {
    const texto = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}${texto ? `: ${texto.slice(0, 200)}` : ''}`);
  }
  return true;
}

function BarListChart({ data, valueKey = 'valor', labelKey = 'name', colorFor }) {
  const max = Math.max(1, ...data.map((d) => d[valueKey] || 0));
  return (
    <div className="space-y-2.5">
      {data.map((d, i) => (
        <div key={i}>

function ColumnChart({ data, seriesKeys, seriesColors, stacked = false, height = 180 }) {
  const totals = data.map((d) => (stacked ? seriesKeys.reduce((s, k) => s + (d[k] || 0), 0) : Math.max(0, ...seriesKeys.map((k) => d[k] || 0))));
  const max = Math.max(1, ...totals);
  return (
    <div>
      <div className="flex items-end gap-2" style={{ height }}>
        {data.map((d, i) => (
          <div key={i} className="flex-1 flex flex-col items-center justify-end h-full min-w-0">
            {stacked ? (
              <div className="w-full flex flex-col-reverse rounded-t-md overflow-hidden bg-slate-50" style={{ height: `${Math.max((totals[i] / max) * 100, totals[i] > 0 ? 2 : 0)}%` }}>
                {seriesKeys.map((k) => (d[k] || 0) > 0 && (
                  <div key={k} title={`${k}: ${formatBRL(d[k])}`} style={{ height: `${((d[k] || 0) / (totals[i] || 1)) * 100}%`, background: seriesColors[k] }} />
                ))}
              </div>
            ) : (
              <div className="w-full flex items-end justify-center gap-0.5 h-full">
                {seriesKeys.map((k) => (
                  <div key={k} title={`${k}: ${formatBRL(d[k])}`} className="flex-1 rounded-t-md transition-all" style={{ height: `${Math.max(((d[k] || 0) / max) * 100, (d[k] || 0) > 0 ? 2 : 0)}%`, background: seriesColors[k] }} />

          </div>
        ))}

}

// Gráfico do ano: receita e despesa em barras, saldo em linha, com rótulos sem casas decimais.
function GraficoAnual({ dados, mesDestaque }) {
  const W = 880; const H = 300; const P = { l: 10, r: 10, t: 34, b: 28 };
  const valores = dados.flatMap((d) => [d.receita, d.despesa, d.saldo]);
  const maxV = Math.max(1, ...valores);
  const minV = Math.min(0, ...valores);
  const y = (v) => P.t + ((maxV - v) / (maxV - minV)) * (H - P.t - P.b);
  const slot = (W - P.l - P.r) / dados.length;
  const bw = Math.min(24, slot * 0.34);
  const cx = (i) => P.l + i * slot + slot / 2;
  const contorno = { paintOrder: 'stroke', stroke: '#fff', strokeWidth: 3, strokeLinejoin: 'round' };
  const rotuloBarra = (x, v, cor) => {
    if (!(v > 0)) return null;
    const alt = y(0) - y(v);
    const dentro = alt > 46;
    return (
      <text
        x={0} y={0}
        transform={`translate(${x + bw / 2 + 3}, ${dentro ? y(v) + 6 : y(v) - 4}) rotate(-90)`}
        textAnchor={dentro ? 'end' : 'start'}
        fontSize="9.5" fontWeight="600"
        fill={dentro ? '#fff' : cor}
      >
        {formatInt(v)}
      </text>
    );
  };
  const linha = dados.map((d, i) => `${i ? 'L' : 'M'}${cx(i).toFixed(1)},${y(d.saldo).toFixed(1)}`).join(' ');
  const caixaRef = useRef(null);
  useEffect(() => {
    const el = caixaRef.current;
    if (!el || el.scrollWidth <= el.clientWidth) return;
    el.scrollLeft = Math.max(0, el.scrollWidth * ((mesDestaque - 0.5) / dados.length) - el.clientWidth / 2);
  }, [mesDestaque, dados.length]);
  return (
    <div>
      <div ref={caixaRef} className="overflow-x-auto pf-scroll">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full min-w-[720px] h-auto">
          {dados.map((d, i) => (
            i + 1 === mesDestaque ? <rect key={`bg${i}`} x={P.l + i * slot + 2} y={P.t - 26} width={slot - 4} height={H - P.t - P.b + 26} rx="10" fill="#ecfdf5" /> : null
          ))}
          <line x1={P.l} x2={W - P.r} y1={y(0)} y2={y(0)} stroke="#cbd5e1" />
          {dados.map((d, i) => {
            const xr = cx(i) - bw - 1.5;
            const xd = cx(i) + 1.5;
            return (
              <g key={i}>
                {d.receita > 0 && <rect x={xr} y={y(d.receita)} width={bw} height={Math.max(y(0) - y(d.receita), 1)} rx="4" fill="#10b981" />}
                {d.despesa > 0 && <rect x={xd} y={y(d.despesa)} width={bw} height={Math.max(y(0) - y(d.despesa), 1)} rx="4" fill="#f43f5e" />}
                {rotuloBarra(xr - 3, d.receita, '#047857')}
                {rotuloBarra(xd - 3, d.despesa, '#be123c')}
                <text x={cx(i)} y={H - 8} textAnchor="middle" fontSize="11" fontWeight={i + 1 === mesDestaque ? '700' : '500'} fill={i + 1 === mesDestaque ? '#047857' : '#64748b'}>{d.mes}</text>
              </g>
            );
          })}
          <path d={linha} fill="none" stroke="#334155" strokeWidth="2.5" strokeLinejoin="round" />
          {dados.map((d, i) => (
            <g key={`s${i}`}>
              <circle cx={cx(i)} cy={y(d.saldo)} r="4" fill={d.saldo < 0 ? '#e11d48' : '#334155'} stroke="#fff" strokeWidth="1.5" />
              <text x={cx(i)} y={y(d.saldo) - 9} textAnchor="middle" fontSize="10.5" fontWeight="700" fill={d.saldo < 0 ? '#e11d48' : '#1e293b'} style={contorno}>
                {formatInt(d.saldo)}
              </text>
            </g>
          ))}
        </svg>
      </div>
      <div className="flex flex-wrap gap-4 mt-2 text-[11px] text-slate-500">
        <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-emerald-500" /> Receita</span>
        <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-rose-500" /> Despesa</span>
        <span className="flex items-center gap-1.5"><span className="w-4 h-0.5 bg-slate-700" /> Saldo</span>
      </div>
    </div>
  );
}

function construirLinhasDre(categorias, tipo, dados, passaFiltro, orcamentos, mk) {
  return categorias
    .map((c) => {
      const realizado = dados.filter((t) => t.tipo === tipo && t.categoria === c && passaFiltro(t)).reduce((s, t) => s + t.valor, 0);
      const orcado = orcamentos?.[c]?.[mk] ?? 0;
      return { categoria: c, realizado, orcado, diferenca: orcado - realizado };
    })
    .filter((l) => l.realizado > 0 || l.orcado > 0)
    .sort((a, b) => b.realizado - a.realizado);
}

// Receitas, entradas e lucro: realizar mais que o orçado é bom. Despesas e pagamentos: realizar menos é bom.
function dreBom(realizado, orcado, maisEhMelhor) {
  return maisEhMelhor ? realizado >= orcado : realizado <= orcado;
}

function DreMiniBarra({ pct, cor }) {
  return (
    <div className="w-14 sm:w-20 h-1.5 bg-slate-100 rounded-full overflow-hidden shrink-0">
      <div className="h-full rounded-full" style={{ width: `${Math.min(Math.max(pct, 0), 1) * 100}%`, background: cor }} />
    </div>
  );
}

// DRE em formato de tabela: seções recolhíveis, linhas de resultado destacadas.
function DreTabela({ modo, itens, receitaTotal, orcamentos, mk, onSetOrcamento, realizadoPorCategoria }) {
  const [fechadas, setFechadas] = usePersistentState('dash:dreFechadas', []);
  const alternar = (id) => setFechadas((f) => (f.includes(id) ? f.filter((x) => x !== id) : [...f, id]));
  const brl = (v) => formatBRL(v);
  const cols = modo === 'orcado' ? 5 : 3;

  const celulasValor = (real, orc, mais, { negrito = false, claro = false } = {}) => {
    if (modo === 'config') {
      return (
        <>
          <td className={`px-3 py-2 text-right pf-num whitespace-nowrap ${claro ? '' : 'text-slate-500'}`}>{brl(real)}</td>
          <td className="px-3 py-2 text-right pf-num whitespace-nowrap">{orc}</td>
        </>
      );
    }
    if (modo === 'realizado') {
      const pct = receitaTotal > 0 ? real / receitaTotal : 0;
      return (
        <>
          <td className={`px-3 py-2 text-right pf-num whitespace-nowrap ${negrito ? 'font-bold' : ''}`}>{brl(real)}</td>
          <td className="px-3 py-2">
            <div className="flex items-center justify-end gap-2">
              {!claro && <DreMiniBarra pct={Math.abs(pct)} cor={real < 0 ? '#f43f5e' : '#10b981'} />}
              <span className={`w-12 text-right text-[11px] pf-num ${claro ? '' : 'text-slate-400'}`}>{receitaTotal > 0 ? `${(pct * 100).toFixed(0)}%` : '—'}</span>
            </div>
          </td>
        </>
      );
    }
    const temOrc = orc !== 0;
    const dif = real - orc;
    const bom = dreBom(real, orc, mais);
    const pct = temOrc ? real / orc : 0;
    const corDif = claro ? '' : !temOrc ? 'text-slate-300' : bom ? 'text-emerald-600' : 'text-rose-600';
    return (
      <>
        <td className={`px-3 py-2 text-right pf-num whitespace-nowrap ${negrito ? 'font-bold' : ''}`}>{brl(real)}</td>
        <td className={`px-3 py-2 text-right pf-num whitespace-nowrap ${claro ? '' : 'text-slate-500'}`}>{temOrc ? brl(orc) : '—'}</td>
        <td className={`px-3 py-2 text-right pf-num whitespace-nowrap font-medium ${corDif}`}>{temOrc ? `${dif > 0 ? '+' : ''}${brl(dif)}` : '—'}</td>
        <td className="px-3 py-2">
          {temOrc ? (
            <div className="flex items-center justify-end gap-2">
              {!claro && <DreMiniBarra pct={pct} cor={bom ? '#10b981' : '#f43f5e'} />}

// Guarda filtros e seleções da tela enquanto o app estiver aberto, para não perder ao trocar de aba.
function usePersistentState(chave, inicial) {
  const k = `pf:${chave}`;
  const [valor, setValor] = useState(() => {
    try {
      const salvo = sessionStorage.getItem(k);
      if (salvo != null) return JSON.parse(salvo);
    } catch (e) { /* sem armazenamento disponível */ }
    return typeof inicial === 'function' ? inicial() : inicial;
  });
  useEffect(() => {
    try { sessionStorage.setItem(k, JSON.stringify(valor)); } catch (e) { /* sem armazenamento disponível */ }
  }, [k, valor]);
  return [valor, setValor];
}

// Normaliza a descrição de uma compra para reconhecer o mesmo estabelecimento em faturas diferentes.
function normalizarDescricao(desc) {
  return String(desc || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/parc(ela)?\.?\s*\d+\s*(\/|de)\s*\d+/g, ' ')
    .replace(/\d+\s*\/\s*\d+/g, ' ')
    .replace(/[0-9]/g, ' ')
    .replace(/[^a-z ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function getStatus(t) {
  const today = todayStr();
  if (t.quitado) return t.tipo === 'pagar' ? 'Pago' : 'Recebido';
  if (t.data < today) return 'Em atraso';
  return t.tipo === 'pagar' ? 'A pagar' : 'A receber';
}

function statusClasses(status) {
  if (status === 'Pago' || status === 'Recebido') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
  if (status === 'Parcial') return 'bg-blue-50 text-blue-700 border-blue-200';
  if (status === 'Em atraso') return 'bg-red-50 text-red-600 border-red-200';
  return 'bg-amber-50 text-amber-700 border-amber-200';
}

function formatDateBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function addMonthsToDateStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1 + n, 1);
  const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  const day = Math.min(d, lastDay);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(day)}`;
}

/* --------------------------- Parsing de extrato --------------------------- */

function parseValorLivre(raw) {
  if (typeof raw === 'number') return raw;
  if (!raw) return 0;
  let s = String(raw).trim().replace(/[^0-9,.\-]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s);
  return Number.isNaN(n) ? 0 : n;
}

function parseDataLivre(raw, formato = 'BR') {
  if (!raw) return '';
  if (raw instanceof Date && !Number.isNaN(raw.getTime())) {
    return `${raw.getFullYear()}-${pad2(raw.getMonth() + 1)}-${pad2(raw.getDate())}`;
  }
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let [, p1, p2, y] = m;
    if (y.length === 2) y = `20${y}`;
    const dia = formato === 'US' ? p2 : p1;
    const mes = formato === 'US' ? p1 : p2;
    return `${y}-${pad2(mes)}-${pad2(dia)}`;
  }
  return '';
}

function guessColIndex(headers, keywords) {
  return headers.findIndex((h) => keywords.some((k) => String(h).toLowerCase().includes(k)));
}

async function lerArquivoExtrato(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  let wb;
  if (ext === 'csv') {
    const text = await file.text();
    wb = XLSX.read(text, { type: 'string', cellDates: true });
  } else {
    const buf = await file.arrayBuffer();
    wb = XLSX.read(buf, { type: 'array', cellDates: true });
  }
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, dateNF: 'yyyy-mm-dd', defval: '' });
}

function CategoryMultiSelect({ categorias, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function onClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, []);

  const toggle = (cat) => {
    if (selected.includes(cat)) onChange(selected.filter((c) => c !== cat));
    else onChange([...selected, cat]);
  };

  const label = selected.length === 0 || selected.length === categorias.length
    ? 'Todas as categorias'
    : `${selected.length} categoria${selected.length > 1 ? 's' : ''}`;

  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen((o) => !o)}
        className="flex items-center gap-2 text-sm bg-white border border-emerald-200 rounded-xl px-3 py-2 text-slate-600 hover:border-emerald-300 transition"
      >
        <Icon name="Filter" size={14} className="text-emerald-500" />
        {label}
        <Icon name="ChevronDown" size={14} className="text-slate-400" />
      </button>
      {open && (
        <div className="absolute z-20 mt-2 w-64 bg-white border border-emerald-100 rounded-xl shadow-lg p-2 max-h-72 overflow-y-auto pf-scroll">
          <button
            onClick={() => onChange([])}
            className="w-full text-left text-xs font-medium text-emerald-600 px-2 py-1.5 hover:bg-emerald-50 rounded-lg mb-1"
          >
            Limpar seleção (todas)
          </button>
          {categorias.map((cat) => (
            <label key={cat} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-emerald-50 cursor-pointer text-sm text-slate-700">
              <input
                type="checkbox"
                checked={selected.includes(cat)}
                onChange={() => toggle(cat)}
                className="accent-emerald-600 w-4 h-4"
              />
              {cat}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

                <Icon name="Repeat" size={14} className="text-emerald-600" />

              </label>
              {recorrente && (

                    type="number" min="1" max="60" value={meses}

                  />
                  meses (incluindo este)

              )}

          )}
        </div>

        <button
          onClick={submit}
          disabled={!valid}
          className="w-full mt-5 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"

        </button>
      </div>
    </div>
  );
}

// Caixa flutuante posicionada na tela (não é cortada pela rolagem da tabela).
function PopoverFixo({ anchorRef, open, onClose, children, largura = 240 }) {
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!open || !anchorRef.current) { setPos(null); return undefined; }
    const r = anchorRef.current.getBoundingClientRect();
    const left = Math.min(Math.max(8, r.left), window.innerWidth - largura - 8);
    const abaixo = r.bottom + 6;
    const cabe = window.innerHeight - abaixo > 220;
    setPos(cabe ? { top: abaixo, left } : { bottom: window.innerHeight - r.top + 6, left });
    const fechar = (e) => {
      if (e.target.closest && e.target.closest('[data-pf-pop]')) return;
      if (anchorRef.current && anchorRef.current.contains(e.target)) return;
      onClose();
    };
    const rolar = (e) => {
      if (e.target instanceof Element && e.target.closest('[data-pf-pop]')) return;
      onClose();
    };
    document.addEventListener('mousedown', fechar);
    document.addEventListener('touchstart', fechar);
    window.addEventListener('scroll', rolar, true);
    return () => {
      document.removeEventListener('mousedown', fechar);
      document.removeEventListener('touchstart', fechar);
      window.removeEventListener('scroll', rolar, true);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open]);
  if (!open || !pos) return null;
  return ReactDOM.createPortal(
    <div
      data-pf-pop
      style={{ position: 'fixed', ...pos, width: largura, zIndex: 60 }}
      className="bg-white border border-slate-200 rounded-xl shadow-xl shadow-slate-900/10 p-2 pf-fade text-left normal-case tracking-normal"
    >
      {children}
    </div>,
    document.body,
  );
}

// Cabeçalho com menu: ordenar (A–Z, maior–menor, data) e filtrar pelos valores da coluna.
function CabecalhoColuna({ label, coluna, tipoDado, ordem, onOrdenar, valores, selecionados, onFiltrar, extra, className = '' }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const ativoOrdem = ordem.col === coluna;
  const ativoFiltro = (selecionados && selecionados.length > 0) || !!extra?.ativo;
  const opcoes = tipoDado === 'num'
    ? [['asc', 'Menor → maior'], ['desc', 'Maior → menor']]
    : tipoDado === 'data'
      ? [['asc', 'Mais antiga primeiro'], ['desc', 'Mais recente primeiro']]
      : [['asc', 'A → Z'], ['desc', 'Z → A']];
  const toggle = (v) => {
    if (selecionados.includes(v)) onFiltrar(selecionados.filter((x) => x !== v));
    else onFiltrar([...selecionados, v]);
  };
  return (
    <th className={`px-2 py-2 font-medium ${className}`}>
      <button
        ref={ref}
        onClick={() => setOpen((o) => !o)}
        className={`inline-flex items-center gap-1 uppercase tracking-wide rounded-md px-1 -mx-1 py-0.5 hover:bg-slate-200/60 transition ${ativoOrdem || ativoFiltro ? 'text-emerald-700' : ''}`}
      >
        {label}
        {ativoOrdem && <span className="text-[10px]">{ordem.dir === 'asc' ? '▲' : '▼'}</span>}
        {ativoFiltro && <Icon name="Filter" size={10} />}
        {!ativoOrdem && !ativoFiltro && <Icon name="ChevronDown" size={11} className="opacity-50" />}
      </button>
      <PopoverFixo anchorRef={ref} open={open} onClose={() => setOpen(false)} largura={230}>
        <div className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider px-2 pt-1 pb-1">Ordenar</div>
        {opcoes.map(([dir, txt]) => (
          <button
            key={dir}
            onClick={() => { onOrdenar({ col: coluna, dir }); setOpen(false); }}
            className={`w-full text-left text-xs px-2 py-1.5 rounded-lg hover:bg-emerald-50 ${ativoOrdem && ordem.dir === dir ? 'text-emerald-700 font-semibold' : 'text-slate-600'}`}
          >
            {txt}
          </button>
        ))}
        {extra && <div className="border-t border-slate-100 mt-1 pt-1">{extra.conteudo}</div>}
        {valores && valores.length > 0 && (
          <div className="border-t border-slate-100 mt-1 pt-1">
            <div className="flex items-center justify-between px-2 pt-1 pb-1">
              <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Filtrar</span>
              {selecionados.length > 0 && <button onClick={() => onFiltrar([])} className="text-[11px] text-emerald-600 font-medium">Limpar</button>}
            </div>
            <div className="max-h-52 overflow-y-auto pf-scroll">
              {valores.map((v) => (
                <label key={v} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-emerald-50 cursor-pointer text-xs text-slate-700">
                  <input type="checkbox" checked={selecionados.includes(v)} onChange={() => toggle(v)} className="accent-emerald-600 w-3.5 h-3.5" />
                  <span className="truncate">{v}</span>
                </label>
              ))}
            </div>
          </div>
        )}
      </PopoverFixo>
    </th>
  );
}

// Lançamentos do cartão que formam um lançamento agrupado em Contas a Pagar.
function itensDoGrupoCartao(t, cartaoTransacoes) {
  let mk = null; let categoria = null;
  if (t.grupoCartao) { mk = t.grupoCartao.mk; categoria = t.grupoCartao.categoria; }
  else {
    const m = /^Cartão - (.+)$/.exec(t.descricao || '');
    if (m && t.tipo === 'pagar') { mk = t.data.slice(0, 7); categoria = m[1]; }
  }
  if (!mk) return null;
  return (cartaoTransacoes || [])
    .filter((c) => (c.mesFatura || c.data.slice(0, 7)) === mk && c.categoria === categoria)
    .sort((a, b) => a.data.localeCompare(b.data));
}

function GrupoCartaoInfo({ itens, valorLancamento }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const total = itens.reduce((s, c) => s + c.valor, 0);
  const diferenca = (valorLancamento || 0) - total;
  const diverge = Math.abs(diferenca) >= 0.01;
  return (
    <>
      <button
        ref={ref}
        onMouseEnter={() => setOpen(true)}
        onMouseLeave={() => setOpen(false)}
        onClick={() => setOpen((o) => !o)}
        className={`inline-flex items-center gap-0.5 ml-1.5 align-middle text-[10px] font-medium rounded-full px-1.5 py-0.5 ${diverge ? 'text-amber-700 bg-amber-50 hover:bg-amber-100' : 'text-emerald-700 bg-emerald-50 hover:bg-emerald-100'}`}
      >
        {diverge ? <Icon name="AlertTriangle" size={10} /> : <Icon name="CreditCard" size={10} />} {itens.length}
      </button>
      <PopoverFixo anchorRef={ref} open={open} onClose={() => setOpen(false)} largura={300}>
        <div className="flex items-center justify-between px-1 pb-1.5 mb-1 border-b border-slate-100">
          <span className="text-xs font-semibold text-slate-700">{itens.length} compra{itens.length !== 1 ? 's' : ''} do cartão</span>
          <span className="text-xs font-semibold text-rose-500 pf-num">{formatBRL(total)}</span>
        </div>
        {diverge && (
          <div className="text-[11px] text-amber-700 bg-amber-50 rounded-lg px-2 py-1.5 mb-1.5">
            Diferença de <b>{formatBRL(diferenca)}</b> em relação a este lançamento ({formatBRL(valorLancamento)}).
            Provavelmente alguma compra mudou de categoria no Cartão depois de ser lançada aqui.
          </div>
        )}
        {itens.length === 0 ? (
          <div className="text-xs text-slate-400 px-1 py-2">Nenhuma compra do cartão encontrada para esse mês e categoria.</div>
        ) : (
          <div className="max-h-64 overflow-y-auto pf-scroll space-y-0.5">
            {itens.map((c) => (
              <div key={c.id} className="flex items-center justify-between gap-2 text-[11px] px-1 py-1 rounded hover:bg-slate-50">
                <span className="text-slate-400 shrink-0 pf-num">{formatDateBR(c.data).slice(0, 5)}</span>
                <span className="text-slate-600 truncate flex-1">{c.descricao}</span>
                <span className="text-slate-700 font-medium pf-num shrink-0">{formatBRL(c.valor)}</span>
              </div>
            ))}
          </div>
        )}
      </PopoverFixo>
    </>
  );
}

function ContasTable({ tipo, categorias, lancamentos, cartaoTransacoes, onAdd, onEdit, onToggleQuitado, onDuplicate, onDelete }) {
  const now = new Date();
  const p = `contas:${tipo}`;
  const [mes, setMes] = usePersistentState(`${p}:mes`, now.getMonth() + 1);
  const [ano, setAno] = usePersistentState(`${p}:ano`, now.getFullYear());
  const [modoFiltro, setModoFiltro] = usePersistentState(`${p}:modo`, 'mes'); // mes | periodo
  const [dataInicio, setDataInicio] = usePersistentState(`${p}:ini`, `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-01`);
  const [dataFim, setDataFim] = usePersistentState(`${p}:fim`, todayStr());
  const [categoriasSel, setCategoriasSel] = usePersistentState(`${p}:cats`, []);
  const [statusFiltro, setStatusFiltro] = usePersistentState(`${p}:status`, 'todos'); // todos | quitado | pendente
  const [busca, setBusca] = usePersistentState(`${p}:busca`, '');
  const [ordem, setOrdem] = usePersistentState(`${p}:ordem`, { col: 'data', dir: 'asc' });
  const [filtroStatusCol, setFiltroStatusCol] = usePersistentState(`${p}:fStatus`, []);
  const [filtroQuitadoCol, setFiltroQuitadoCol] = usePersistentState(`${p}:fQuitado`, []);
  const [valorMin, setValorMin] = usePersistentState(`${p}:vMin`, '');
  const [valorMax, setValorMax] = usePersistentState(`${p}:vMax`, '');
  const [selecionados, setSelecionados] = useState([]);
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  const mk = monthKey(ano, mes);
  const rotuloQuitado = tipo === 'pagar' ? ['Pago', 'Não pago'] : ['Recebido', 'Não recebido'];

  const doTipo = useMemo(
    () => lancamentos.filter((t) => t.tipo === tipo),
    [lancamentos, tipo],
  );

  const doMes = useMemo(() => {
    if (modoFiltro === 'periodo') {
      const ini = dataInicio || '0000-01-01';
      const fim = dataFim || '9999-12-31';
      return doTipo.filter((t) => t.data >= ini && t.data <= fim);
    }
    return doTipo.filter((t) => t.data.slice(0, 7) === mk);
  }, [doTipo, mk, modoFiltro, dataInicio, dataFim]);

  const filtrados = useMemo(() => {
    let list = doMes;
    if (categoriasSel.length > 0) list = list.filter((t) => categoriasSel.includes(t.categoria));
    if (statusFiltro === 'quitado') list = list.filter((t) => t.quitado);
    if (statusFiltro === 'pendente') list = list.filter((t) => !t.quitado);
    if (busca.trim()) {
      const termo = busca.trim().toLowerCase();
      list = list.filter((t) => t.descricao.toLowerCase().includes(termo));
    }
    if (filtroStatusCol.length > 0) list = list.filter((t) => filtroStatusCol.includes(getStatus(t)));
    if (filtroQuitadoCol.length > 0) list = list.filter((t) => filtroQuitadoCol.includes(t.quitado ? rotuloQuitado[0] : rotuloQuitado[1]));
    if (valorMin !== '') list = list.filter((t) => t.valor >= Number(valorMin));
    if (valorMax !== '') list = list.filter((t) => t.valor <= Number(valorMax));
    const chave = {
      data: (t) => t.data,
      descricao: (t) => (t.descricao || '').toLowerCase(),
      categoria: (t) => (t.categoria || '').toLowerCase(),
      valor: (t) => t.valor,
      status: (t) => getStatus(t),
      quitado: (t) => (t.quitado ? 1 : 0),
    }[ordem.col] || ((t) => t.data);
    const sinal = ordem.dir === 'desc' ? -1 : 1;
    return [...list].sort((a, b) => {
      const va = chave(a); const vb = chave(b);
      const c = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'pt-BR');
      return c * sinal || a.data.localeCompare(b.data);
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [doMes, categoriasSel, statusFiltro, busca, filtroStatusCol, filtroQuitadoCol, valorMin, valorMax, ordem]);

  const resumoFiltro = useMemo(() => {
    const map = {};
    filtrados.forEach((t) => {
      if (!map[t.categoria]) map[t.categoria] = { quitado: 0, pendente: 0 };
      if (t.quitado) map[t.categoria].quitado += t.valor;
      else map[t.categoria].pendente += t.valor;
    });
    return Object.entries(map)
      .map(([categoria, v]) => ({ categoria, ...v, total: v.quitado + v.pendente }))
      .sort((a, b) => b.total - a.total);
  }, [filtrados]);

  const previsaoPorCategoria = useMemo(() => {
    const map = {};
    categorias.forEach((c) => { map[c] = 0; });
    doMes.forEach((t) => { map[t.categoria] = (map[t.categoria] || 0) + t.valor; });
    return map;
  }, [doMes, categorias]);

  const previsaoOrdenada = useMemo(
    () => categorias
      .map((c) => ({ categoria: c, valor: previsaoPorCategoria[c] || 0 }))
      .filter((l) => l.valor > 0)
      .sort((a, b) => b.valor - a.valor),
    [categorias, previsaoPorCategoria],
  );

  const totalMes = doMes.reduce((s, t) => s + t.valor, 0);

  // Seleção de linhas (só conta o que está visível com os filtros atuais)
  const selVisiveis = filtrados.filter((t) => selecionados.includes(t.id));
  const somaSel = selVisiveis.reduce((s, t) => s + t.valor, 0);
  const somaSelQuitado = selVisiveis.filter((t) => t.quitado).reduce((s, t) => s + t.valor, 0);
  const todosSelecionados = filtrados.length > 0 && selVisiveis.length === filtrados.length;
  const toggleSel = (id) => setSelecionados((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  const toggleTodos = () => setSelecionados(todosSelecionados ? [] : filtrados.map((t) => t.id));

  const filtrosColunaAtivos = filtroStatusCol.length + filtroQuitadoCol.length + (valorMin !== '' ? 1 : 0) + (valorMax !== '' ? 1 : 0);
  const limparFiltrosColuna = () => { setFiltroStatusCol([]); setFiltroQuitadoCol([]); setValorMin(''); setValorMax(''); };

  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (t) => { setEditing(t); setModalOpen(true); };

  const handleSave = (data, meses) => {
    if (editing) {
      onEdit({ ...editing, ...data });
    } else if (meses > 1) {
      const recorrenciaId = uid();
      const novos = Array.from({ length: meses }, (_, i) => ({
        ...data,
        id: uid(),
        data: addMonthsToDateStr(data.data, i),
        recorrenciaId,
      }));
      onAdd(novos);
    } else {
      onAdd([{ ...data, id: uid() }]);
    }
    setModalOpen(false);
  };

  const corValor = tipo === 'pagar' ? 'text-red-500' : 'text-emerald-600';
  const statusValores = tipo === 'pagar' ? ['Pago', 'A pagar', 'Em atraso'] : ['Recebido', 'A receber', 'Em atraso'];
  const colProps = { ordem, onOrdenar: setOrdem };

  return (
    <div className="pb-24">
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <div className="flex bg-white border border-slate-200 shadow-sm rounded-xl p-1 text-xs font-medium">
          {[{ v: 'mes', l: 'Mês' }, { v: 'periodo', l: 'Período' }].map((op) => (
            <button
              key={op.v}
              onClick={() => setModoFiltro(op.v)}
              className={`px-3 py-1.5 rounded-lg transition ${modoFiltro === op.v ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-500'}`}
            >
              {op.l}
            </button>
          ))}
        </div>
        {modoFiltro === 'mes' ? (
          <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
        ) : (
          <div className="flex items-center gap-1.5 text-sm">
            <input
              type="date"
              value={dataInicio}
              onChange={(e) => setDataInicio(e.target.value)}
              className="border border-slate-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
            <span className="text-slate-400 text-xs">até</span>
            <input
              type="date"
              value={dataFim}
              onChange={(e) => setDataFim(e.target.value)}
              className="border border-slate-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />

            { v: 'todos', l: 'Todos' },
            { v: 'quitado', l: tipo === 'pagar' ? 'Pago' : 'Recebido' },

            >
              {op.l}

                  </th>
                  <CabecalhoColuna {...colProps} label="Quitado" coluna="quitado" tipoDado="texto" valores={rotuloQuitado} selecionados={filtroQuitadoCol} onFiltrar={setFiltroQuitadoCol} className="pl-1" />
                  <CabecalhoColuna {...colProps} label="Data" coluna="data" tipoDado="data" />
                  <CabecalhoColuna
                    {...colProps} label="Descrição" coluna="descricao" tipoDado="texto"
                    extra={{
                      ativo: busca.trim() !== '',
                      conteudo: (
                        <div className="px-2 py-1">
                          <div className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Contém</div>
                          <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Digite parte da descrição" className="w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-200" />
                        </div>
                      ),
                    }}
                  />
                  <CabecalhoColuna {...colProps} label="Categoria" coluna="categoria" tipoDado="texto" valores={categorias} selecionados={categoriasSel} onFiltrar={setCategoriasSel} className="hidden sm:table-cell" />
                  <CabecalhoColuna
                    {...colProps} label="Valor" coluna="valor" tipoDado="num" className="text-right"
                    extra={{
                      ativo: valorMin !== '' || valorMax !== '',
                      conteudo: (
                        <div className="px-2 py-1">
                          <div className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Valor entre</div>
                          <div className="flex items-center gap-1.5">
                            <input type="number" value={valorMin} onChange={(e) => setValorMin(e.target.value)} placeholder="mín." className="w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5" />
                            <input type="number" value={valorMax} onChange={(e) => setValorMax(e.target.value)} placeholder="máx." className="w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5" />
                          </div>
                        </div>
                      ),
                    }}
                  />
                  <CabecalhoColuna {...colProps} label="Status" coluna="status" tipoDado="texto" valores={statusValores} selecionados={filtroStatusCol} onFiltrar={setFiltroStatusCol} />
                  <th className="px-2 py-2 font-medium text-right">Ações</th>
                </tr>
              </thead>
              <tbody>
                {filtrados.map((t) => {
                  const status = getStatus(t);
                  const sel = selecionados.includes(t.id);
                  const grupo = tipo === 'pagar' ? itensDoGrupoCartao(t, cartaoTransacoes) : null;
                  return (
                    <tr key={t.id} className={`border-b border-slate-50 transition ${sel ? 'bg-emerald-50/70' : 'hover:bg-emerald-50/30'}`}>
                      <td className="pl-4 pr-1 py-2.5">
                        <input type="checkbox" checked={sel} onChange={() => toggleSel(t.id)} className="accent-emerald-600 w-4 h-4 align-middle" />
                      </td>
                      <td className="pl-1 pr-2 py-2.5">
                        <button
                          onClick={() => onToggleQuitado(t)}
                          className={`w-6 h-6 rounded-lg flex items-center justify-center border transition ${t.quitado ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 text-transparent hover:border-emerald-400'}`}
                        >
                          <Icon name="Check" size={14} />
                        </button>
                      </td>
                      <td className="px-2 py-2.5 whitespace-nowrap text-slate-500 pf-num">{formatDateBR(t.data)}</td>
                      <td className="px-2 py-2.5 text-slate-700 max-w-[200px]">
                        <div className="flex items-center min-w-0">
                          <span className="truncate">{t.descricao}</span>
                          {grupo && <GrupoCartaoInfo itens={grupo} valorLancamento={t.valor} />}
                        </div>
                      </td>
                      <td className="px-2 py-2.5 hidden sm:table-cell text-slate-500">{t.categoria}</td>
                      <td className={`px-2 py-2.5 text-right font-medium whitespace-nowrap pf-num ${corValor}`}>{formatBRL(t.valor)}</td>
                      <td className="px-2 py-2.5"><Badge status={status} /></td>
                      <td className="px-2 py-2.5">
                        <div className="flex items-center justify-end gap-1">
                          <button onClick={() => openEdit(t)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                            <Icon name="Pencil" size={13} />
                          </button>
                          <button onClick={() => onDuplicate(t)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                            <Icon name="Copy" size={13} />
                          </button>
                          <button onClick={() => onDelete(t)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
                            <Icon name="Trash2" size={13} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {selVisiveis.length > 0 && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 w-[calc(100%-2rem)] max-w-xl pf-fade">
          <div className="flex items-center justify-between gap-3 bg-slate-900 text-white rounded-2xl px-4 py-3 shadow-2xl shadow-slate-900/30">
            <div className="min-w-0">
              <div className="text-[11px] text-slate-300">{selVisiveis.length} selecionado{selVisiveis.length !== 1 ? 's' : ''}</div>
              <div className="text-lg font-semibold pf-num leading-tight">{formatBRL(somaSel)}</div>
              <div className="text-[10px] text-slate-400 pf-num">
                {rotuloQuitado[0].toLowerCase()} {formatBRL(somaSelQuitado)} · em aberto {formatBRL(somaSel - somaSelQuitado)}
              </div>
            </div>
            <button onClick={() => setSelecionados([])} className="shrink-0 text-xs font-medium bg-white/10 hover:bg-white/20 px-3 py-2 rounded-xl">
              Limpar seleção
            </button>
          </div>
        </div>
      )}

      <TransactionModal
        open={modalOpen}
        onClose={() => setModalOpen(false)}
        onSave={handleSave}
        categorias={categorias}
        tipo={tipo}
        initial={editing}
      />
    </div>
  );
}

/* --------------------------------- Dashboard ------------------------------ */

function DashboardTab({ lancamentos, orcamentos, onSetOrcamento, config, onSetSaldoInicial }) {
  const now = new Date();
  const [mes, setMes] = usePersistentState('dash:mes', now.getMonth() + 1);
  const [ano, setAno] = usePersistentState('dash:ano', now.getFullYear());
  const [statusFiltro, setStatusFiltro] = usePersistentState('dash:status', 'todos'); // todos | quitado | pendente
  const [fluxoFiltro, setFluxoFiltro] = usePersistentState('dash:fluxo', 'tudo'); // tudo | quitado | aquitar
  const [modoDre, setModoDre] = usePersistentState('dash:modoDre', 'realizado'); // realizado | orcado | config
  const [catsAnalise, setCatsAnalise] = usePersistentState('dash:catsAnalise', []);

  const mk = monthKey(ano, mes);

  const doMes = useMemo(() => lancamentos.filter((t) => t.data.slice(0, 7) === mk), [lancamentos, mk]);

  const passaFiltroStatus = (t) => {
    if (statusFiltro === 'todos') return true;
    if (statusFiltro === 'quitado') return t.quitado;
    return !t.quitado;
  };

  const totalReceber = doMes.filter((t) => t.tipo === 'receber' && passaFiltroStatus(t)).reduce((s, t) => s + t.valor, 0);
  const totalPagar = doMes.filter((t) => t.tipo === 'pagar' && passaFiltroStatus(t)).reduce((s, t) => s + t.valor, 0);
  const saldoPeriodo = totalReceber - totalPagar;

  // DRE: cada linha traz realizado (respeitando o filtro de status), orçado e a diferença
  const linhasDreReceitas = construirLinhasDre(DRE_RECEITAS, 'receber', doMes, passaFiltroStatus, orcamentos, mk);
  const linhasDreDespesas = construirLinhasDre(DRE_DESPESAS, 'pagar', doMes, passaFiltroStatus, orcamentos, mk);
  const linhasDreEntradasExtras = construirLinhasDre(DRE_ENTRADAS_EXTRAS, 'receber', doMes, passaFiltroStatus, orcamentos, mk);
  const linhasDrePagamentosExtras = construirLinhasDre(DRE_PAGAMENTOS_EXTRAS, 'pagar', doMes, passaFiltroStatus, orcamentos, mk);

  const dreReceitas = linhasDreReceitas.reduce((s, l) => s + l.realizado, 0);
  const dreDespesas = linhasDreDespesas.reduce((s, l) => s + l.realizado, 0);
  const dreLucro = dreReceitas - dreDespesas;
  const dreEntradasExtras = linhasDreEntradasExtras.reduce((s, l) => s + l.realizado, 0);
  const drePagamentosExtras = linhasDrePagamentosExtras.reduce((s, l) => s + l.realizado, 0);
  const dreLucroReal = dreLucro + dreEntradasExtras - drePagamentosExtras;

  const dreReceitasOrc = linhasDreReceitas.reduce((s, l) => s + l.orcado, 0);
  const dreDespesasOrc = linhasDreDespesas.reduce((s, l) => s + l.orcado, 0);
  const dreLucroOrc = dreReceitasOrc - dreDespesasOrc;
  const dreEntradasExtrasOrc = linhasDreEntradasExtras.reduce((s, l) => s + l.orcado, 0);
  const drePagamentosExtrasOrc = linhasDrePagamentosExtras.reduce((s, l) => s + l.orcado, 0);
  const dreLucroRealOrc = dreLucroOrc + dreEntradasExtrasOrc - drePagamentosExtrasOrc;

  const realizadoPorCategoria = useMemo(() => {
    const map = {};
    doMes.filter(passaFiltroStatus).forEach((t) => { map[t.categoria] = (map[t.categoria] || 0) + t.valor; });
    return map;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [doMes, statusFiltro]);

  // Gráfico do ano: receita, despesa e saldo por mês (respeita o filtro de status)
  const dadosAno = useMemo(() => MESES.map((nome, i) => {
    const k = monthKey(ano, i + 1);
    const doM = lancamentos.filter((t) => t.data.slice(0, 7) === k && passaFiltroStatus(t));
    const receita = doM.filter((t) => t.tipo === 'receber').reduce((s, t) => s + t.valor, 0);
    const despesa = doM.filter((t) => t.tipo === 'pagar').reduce((s, t) => s + t.valor, 0);
    return { mes: nome.slice(0, 3), receita, despesa, saldo: receita - despesa };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }), [lancamentos, ano, statusFiltro]);
  const totalAnoReceita = dadosAno.reduce((s, d) => s + d.receita, 0);
  const totalAnoDespesa = dadosAno.reduce((s, d) => s + d.despesa, 0);

  // Análise por categoria no ano
  const todasCategoriasUnicas = useMemo(() => [...new Set([...CATEGORIAS_PAGAR, ...CATEGORIAS_RECEBER])], []);
  const CORES_ANALISE = ['#059669', '#0ea5e9', '#f59e0b', '#8b5cf6', '#f43f5e', '#14b8a6', '#64748b', '#ec4899'];
  const analise = useMemo(() => {
    const doAno = lancamentos.filter((t) => t.data.slice(0, 4) === String(ano) && catsAnalise.includes(t.categoria) && passaFiltroStatus(t));
    const porCat = catsAnalise.map((c) => {
      const lista = doAno.filter((t) => t.categoria === c);
      const total = lista.reduce((s, t) => s + t.valor, 0);
      const quitado = lista.filter((t) => t.quitado).reduce((s, t) => s + t.valor, 0);
      const mesesComValor = new Set(lista.map((t) => t.data.slice(0, 7))).size;
      return { categoria: c, total, quitado, pendente: total - quitado, media: mesesComValor ? total / mesesComValor : 0 };
    });
    const porMes = MESES.map((nome, i) => {
      const k = monthKey(ano, i + 1);
      const row = { mes: nome.slice(0, 3) };
      catsAnalise.forEach((c) => { row[c] = doAno.filter((t) => t.categoria === c && t.data.slice(0, 7) === k).reduce((s, t) => s + t.valor, 0); });
      return row;
    });
    return { porCat, porMes, total: porCat.reduce((s, c) => s + c.total, 0) };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [lancamentos, ano, catsAnalise, statusFiltro]);

  // Top fornecedores (despesas por descrição)
  const porFornecedor = useMemo(() => {
    const map = {};
    doMes.filter((t) => t.tipo === 'pagar').forEach((t) => {
      map[t.descricao] = (map[t.descricao] || 0) + t.valor;
    });
    return Object.entries(map)
      .map(([name, valor]) => ({ name, valor }))
      .sort((a, b) => b.valor - a.valor)
      .slice(0, 8);
  }, [doMes]);

  // Fluxo de caixa diário
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const saldoInicial = config?.saldoInicial?.[mk] ?? 0;

  const passaFluxo = (t) => {
    if (fluxoFiltro === 'tudo') return true;
    if (fluxoFiltro === 'quitado') return t.quitado;
    return !t.quitado;
  };

  const fluxo = useMemo(() => {
    let acumulado = saldoInicial;
    const linhas = [];
    for (let d = 1; d <= diasNoMes; d += 1) {
      const dataStr = `${ano}-${pad2(mes)}-${pad2(d)}`;
      const doDia = doMes.filter((t) => t.data === dataStr && passaFluxo(t));
      const entradas = doDia.filter((t) => t.tipo === 'receber').reduce((s, t) => s + t.valor, 0);
      const saidas = doDia.filter((t) => t.tipo === 'pagar').reduce((s, t) => s + t.valor, 0);
      const saldoDia = entradas - saidas;
      acumulado += saldoDia;
      linhas.push({ dia: d, dataStr, entradas, saidas, saldoDia, acumulado });
    }
    return linhas;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [doMes, diasNoMes, ano, mes, saldoInicial, fluxoFiltro]);

  const rotuloStatus = { todos: 'tudo', quitado: 'só pago/recebido', pendente: 'só a pagar/receber' }[statusFiltro];

  return (
    <div className="pb-24 space-y-4">
      {/* Título */}
      <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-700 via-emerald-600 to-teal-500 text-white px-5 py-6 sm:px-7 sm:py-7 shadow-lg shadow-emerald-900/20">
        <div className="absolute -right-10 -top-12 w-44 h-44 rounded-full bg-white/10" />
        <div className="absolute right-16 -bottom-16 w-36 h-36 rounded-full bg-white/5" />
        <div className="relative">
          <div className="text-[11px] uppercase tracking-[0.2em] text-emerald-100/90 font-medium">Painel da família</div>
          <h2 className="text-2xl sm:text-3xl font-bold tracking-tight mt-1">Finanças Alves de Sousa</h2>
          <p className="mt-3 text-sm sm:text-[15px] text-emerald-50/95 italic max-w-xl leading-relaxed">
            “Na sua casa há prosperidade e riqueza, e a sua justiça permanece para sempre.”
          </p>
          <p className="text-xs text-emerald-100/80 mt-1 font-medium">Salmos 112:3</p>
        </div>
      </div>

      <div className="flex flex-wrap items-center justify-between gap-2">
        <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
        <div className="flex bg-white border border-slate-200 shadow-sm rounded-xl p-1 text-xs font-medium">
          {[
            { v: 'todos', l: 'Tudo' },
            { v: 'quitado', l: 'Pago/Recebido' },
            { v: 'pendente', l: 'A pagar/receber' },
          ].map((op) => (
            <button
              key={op.v}
              onClick={() => setStatusFiltro(op.v)}
              className={`px-3 py-1.5 rounded-lg transition ${statusFiltro === op.v ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-500 hover:text-emerald-700'}`}
            >
              {op.l}
            </button>
          ))}
        </div>
      </div>

      {/* Cards resumo */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Card className="p-4 border-l-4 border-l-emerald-500">
          <div className="flex items-center gap-2 text-emerald-600 text-xs font-medium mb-1">
            <Icon name="ArrowDownCircle" size={14} /> Receitas
          </div>
          <div className="text-xl font-semibold text-slate-800 pf-num">{formatBRL(totalReceber)}</div>
        </Card>
        <Card className="p-4 border-l-4 border-l-rose-500">
          <div className="flex items-center gap-2 text-rose-500 text-xs font-medium mb-1">
            <Icon name="ArrowUpCircle" size={14} /> Despesas
          </div>
          <div className="text-xl font-semibold text-slate-800 pf-num">{formatBRL(totalPagar)}</div>
        </Card>
        <Card className={`p-4 border-l-4 ${saldoPeriodo < 0 ? 'border-l-rose-500' : 'border-l-teal-500'}`}>
          <div className="flex items-center gap-2 text-slate-500 text-xs font-medium mb-1">
            <Icon name="Wallet" size={14} /> Saldo do período
          </div>
          <div className={`text-xl font-semibold pf-num ${saldoPeriodo < 0 ? 'text-red-500' : 'text-emerald-600'}`}>
            {formatBRL(saldoPeriodo)}
          </div>
        </Card>
      </div>

      {/* Gráfico do ano */}
      <Card className="p-4 sm:p-5">
        <SectionTitle
          icon="TrendingUp"
          title={`Receita, despesa e saldo em ${ano}`}
          subtitle={`Mês a mês · filtro: ${rotuloStatus}`}
          right={(
            <div className="text-right text-[11px] leading-tight shrink-0">
              <div className="text-emerald-600 font-semibold pf-num">+{formatInt(totalAnoReceita)}</div>
              <div className="text-rose-500 font-semibold pf-num">−{formatInt(totalAnoDespesa)}</div>
              <div className={`font-bold pf-num ${totalAnoReceita - totalAnoDespesa < 0 ? 'text-rose-600' : 'text-slate-700'}`}>= {formatInt(totalAnoReceita - totalAnoDespesa)}</div>
            </div>
          )}
        />
        <GraficoAnual dados={dadosAno} mesDestaque={mes} />
      </Card>

      {/* DRE */}
      <Card className="p-4 sm:p-5">
        <div className="flex flex-wrap items-start justify-between gap-2 mb-3">
          <SectionTitle icon="FileSpreadsheet" title="DRE" subtitle={`Resultado de ${MESES[mes - 1]} ${ano}`} right={null} />
          <div className="flex bg-slate-100 rounded-xl p-1 text-xs font-medium shrink-0">
            {[
              { v: 'realizado', l: 'Realizado' },
              { v: 'orcado', l: 'Orçado x Realizado' },
              { v: 'config', l: 'Configurar orçado', icon: 'Pencil' },
            ].map((op) => (
              <button
                key={op.v}
                onClick={() => setModoDre(op.v)}
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg transition whitespace-nowrap ${modoDre === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                {op.icon && <Icon name={op.icon} size={12} />}{op.l}
              </button>
            ))}
          </div>
        </div>
        <div className="pf-fade" key={modoDre}>
          <DreTabela
            modo={modoDre}
            receitaTotal={dreReceitas}
            orcamentos={orcamentos}
            mk={mk}
            onSetOrcamento={onSetOrcamento}
            realizadoPorCategoria={realizadoPorCategoria}
            itens={[
              { id: 'rec', sinal: '+', titulo: 'Receitas', linhas: linhasDreReceitas, cats: DRE_RECEITAS, mais: true },
              { id: 'desp', sinal: '−', titulo: 'Despesas', linhas: linhasDreDespesas, cats: DRE_DESPESAS, mais: false },
              { resultado: true, titulo: 'Lucro', valor: dreLucro, orcado: dreLucroOrc },
              { id: 'ent', sinal: '+', titulo: 'Entradas extras', linhas: linhasDreEntradasExtras, cats: DRE_ENTRADAS_EXTRAS, mais: true },
              { id: 'pag', sinal: '−', titulo: 'Pagamentos extras', linhas: linhasDrePagamentosExtras, cats: DRE_PAGAMENTOS_EXTRAS, mais: false },
              { resultado: true, final: true, titulo: 'Lucro real', valor: dreLucroReal, orcado: dreLucroRealOrc },
              ...(modoDre === 'config' ? [{
                id: 'outras', sinal: '·', titulo: 'Outras categorias', linhas: [], mais: false,
                cats: [...new Set([...CATEGORIAS_RECEBER, ...CATEGORIAS_PAGAR])].filter((c) => ![...DRE_RECEITAS, ...DRE_DESPESAS, ...DRE_ENTRADAS_EXTRAS, ...DRE_PAGAMENTOS_EXTRAS].includes(c)),
              }] : []),
            ]}
          />
        </div>
      </Card>

      {/* Análise por categoria */}
      <Card className="p-4 sm:p-5">
        <SectionTitle
          icon="Target"
          title={`Análise por categoria em ${ano}`}
          subtitle={`Quanto já foi no ano · filtro: ${rotuloStatus}`}
          right={<CategoryMultiSelect categorias={todasCategoriasUnicas} selected={catsAnalise} onChange={setCatsAnalise} />}
        />
        {catsAnalise.length === 0 ? (
          <EmptyState text="Selecione uma ou mais categorias para ver o total do ano." />
        ) : (
          <div className="pf-fade">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
              {analise.porCat.map((c, i) => (
                <div key={c.categoria} className="rounded-xl border border-slate-100 bg-slate-50/60 px-3 py-2.5">
                  <div className="flex items-center justify-between gap-2">
                    <span className="flex items-center gap-1.5 text-xs font-medium text-slate-600 truncate">
                      <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: CORES_ANALISE[i % CORES_ANALISE.length] }} />
                      {c.categoria}
                    </span>
                    <span className="text-base font-semibold text-slate-800 pf-num">{formatBRL(c.total)}</span>
                  </div>
                  <div className="h-1.5 bg-slate-200/70 rounded-full overflow-hidden mt-2 flex">
                    <div style={{ width: `${c.total ? (c.quitado / c.total) * 100 : 0}%`, background: CORES_ANALISE[i % CORES_ANALISE.length] }} />
                  </div>
                  <div className="flex justify-between text-[10px] text-slate-400 mt-1 pf-num">
                    <span>quitado {formatBRL(c.quitado)} · em aberto {formatBRL(c.pendente)}</span>
                    <span>média {formatBRL(c.media)}/mês</span>
                  </div>
                </div>
              ))}
            </div>
            {catsAnalise.length > 1 && (
              <div className="flex items-center justify-between text-sm mb-3 px-1">
                <span className="text-slate-500">Total das categorias selecionadas</span>
                <span className="font-semibold text-slate-800 pf-num">{formatBRL(analise.total)}</span>
              </div>
            )}
            <ColumnChart

function monthsUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  const target = new Date(`${dateStr}T00:00:00`);
  let months = (target.getFullYear() - today.getFullYear()) * 12 + (target.getMonth() - today.getMonth());
  if (target.getDate() < today.getDate()) months -= 1;
  return months;
}

  }, [open, initial]);

  if (!open) return null;

  const valid = form.nome.trim() && Number(form.valorAlvo) > 0;

  const submit = () => {
    if (!valid) return;

function MetaCard({ meta, onEdit, onDelete, onAportar }) {
  const pct = meta.valorAlvo > 0 ? Math.min((meta.valorAtual / meta.valorAlvo) * 100, 100) : 0;
  const concluida = meta.valorAtual >= meta.valorAlvo;
  const faltando = Math.max(meta.valorAlvo - meta.valorAtual, 0);
  const meses = monthsUntil(meta.prazo);
  const atrasada = meses !== null && meses < 0 && !concluida;
  const porMes = meses && meses > 0 ? faltando / meses : null;

  return (
    <Card className="p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div>
          <h4 className="text-sm font-semibold text-slate-800">{meta.nome}</h4>
          {meta.prazo && (
            <div className={`flex items-center gap-1 text-[11px] mt-0.5 ${atrasada ? 'text-red-500' : 'text-slate-400'}`}>
              <Icon name="CalendarClock" size={11} />
              {atrasada ? 'Prazo vencido' : `Até ${formatDateBR(meta.prazo)}`}
            </div>
          )}
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={() => onEdit(meta)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
            <Icon name="Pencil" size={13} />
          </button>
          <button onClick={() => onDelete(meta)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
            <Icon name="Trash2" size={13} />
          </button>
        </div>
      </div>

      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden mb-2">
        <div
          className={`h-full rounded-full ${concluida ? 'bg-emerald-500' : 'bg-emerald-400'}`}
          style={{ width: `${pct}%` }}
        />
      </div>

      <div className="flex items-center justify-between text-xs mb-3">
        <span className="text-slate-500">{formatBRL(meta.valorAtual)} de {formatBRL(meta.valorAlvo)}</span>
        <span className="font-medium text-emerald-600">{pct.toFixed(0)}%</span>
      </div>

      {concluida ? (
        <div className="text-xs font-medium text-emerald-600 bg-emerald-50 rounded-lg px-2.5 py-1.5 inline-block">
          Meta concluída! 🎉
        </div>
      ) : (
        <div className="flex items-center justify-between gap-2">
          <div className="text-[11px] text-slate-400">
            Faltam {formatBRL(faltando)}
            {porMes != null && !atrasada && <> · ~{formatBRL(porMes)}/mês</>}
          </div>
          <button
            onClick={() => onAportar(meta)}
            className="flex items-center gap-1 text-xs font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg transition"
          >
            <Icon name="PiggyBank" size={13} /> Atualizar
          </button>
        </div>
      )}
    </Card>
  );
}

function MetasTab({ metas, onAdd, onEdit, onDelete, onAportar }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [aportando, setAportando] = useState(null);

  const totalAlvo = metas.reduce((s, m) => s + m.valorAlvo, 0);
  const totalAtual = metas.reduce((s, m) => s + m.valorAtual, 0);
  const pctGeral = totalAlvo > 0 ? Math.min((totalAtual / totalAlvo) * 100, 100) : 0;

  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (m) => { setEditing(m); setModalOpen(true); };

  const handleSave = (data) => {
    if (editing) onEdit({ ...editing, ...data });
    else onAdd({ ...data, id: uid() });
    setModalOpen(false);
  };

  const handleDelete = (m) => {
    if (window.confirm && !window.confirm(`Excluir a meta "${m.nome}"?`)) return;
    onDelete(m);
  };

  const handleAporte = (meta, valor) => {
    const novoValor = Math.max((meta.valorAtual || 0) + valor, 0);
    onAportar({ ...meta, valorAtual: novoValor });
    setAportando(null);
  };

  return (
    <div className="pb-24">
      <Card className="p-4 mb-4">
        <SectionTitle
          icon="Sparkles"
          title="Sonhos & Metas da família"
          subtitle={`${metas.length} meta${metas.length !== 1 ? 's' : ''} cadastrada${metas.length !== 1 ? 's' : ''}`}
        />
        {metas.length > 0 && (
          <>
            <div className="flex items-center justify-between text-sm mb-2">
              <span className="text-slate-500">Reservado: <b className="text-emerald-600">{formatBRL(totalAtual)}</b></span>
              <span className="text-slate-500">Meta total: <b className="text-slate-700">{formatBRL(totalAlvo)}</b></span>
            </div>
            <div className="w-full h-2.5 bg-emerald-50 rounded-full overflow-hidden">
              <div className="h-full bg-emerald-500 rounded-full transition-all" style={{ width: `${pctGeral}%` }} />
            </div>
          </>
        )}
        <button
          onClick={openNew}
          className="flex items-center justify-center gap-1.5 w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-2.5 rounded-xl transition"
        >
          <Icon name="Plus" size={15} /> Nova meta ou sonho
        </button>
      </Card>

      {metas.length === 0 ? (
        <EmptyState text="Cadastre o primeiro sonho ou meta da família." />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {[...metas].sort((a, b) => b.valorAlvo - a.valorAlvo).map((m) => (
            <MetaCard key={m.id} meta={m} onEdit={openEdit} onDelete={handleDelete} onAportar={setAportando} />
          ))}
        </div>
      )}

      <MetaModal open={modalOpen} onClose={() => setModalOpen(false)} onSave={handleSave} initial={editing} />
      <AporteModal open={!!aportando} onClose={() => setAportando(null)} onSave={handleAporte} meta={aportando} />
    </div>
  );
}

function ImportarExtrato({ onConfirm, pendentes, onReplicar, historico, onAprender }) {
  const agora = new Date();
  const [mesFatura, setMesFatura] = useState(agora.getMonth() + 1);
  const [anoFatura, setAnoFatura] = useState(agora.getFullYear());
  const [rows, setRows] = useState(null); // array de arrays cru
  const [headerRow, setHeaderRow] = useState(1);
  const [colData, setColData] = useState(-1);
  const [colDesc, setColDesc] = useState(-1);
  const [colValor, setColValor] = useState(-1);
  const [formatoData, setFormatoData] = useState('BR'); // BR: dd/mm/aaaa | US: mm/dd/aaaa
  const [replicarContasPagar, setReplicarContasPagar] = useState(false);
  const [linhas, setLinhas] = useState([]); // preview editável
  const [erro, setErro] = useState(null);
  const [carregando, setCarregando] = useState(false);
  const fileRef = useRef(null);

  const mkFatura = monthKey(anoFatura, mesFatura);
  const headers = rows ? (rows[headerRow - 1] || []) : [];
  const dataRows = rows ? rows.slice(headerRow) : [];

  // Guarda a lista de pendentes numa ref: ela muda de referência a cada
  // atualização automática do painel (novo array vindo de .filter()), mas
  // isso não deve reprocessar/resetar as categorias que o usuário já ajustou
  // na prévia. O efeito abaixo só deve reagir a mudanças que o usuário fez
  // de propósito (arquivo, colunas, formato, mês da fatura).
  const pendentesRef = useRef(pendentes);
  pendentesRef.current = pendentes;
  const historicoRef = useRef(historico);
  historicoRef.current = historico;

  const handleFile = async (file) => {
    if (!file) return;
    setErro(null);
    setCarregando(true);
    try {
      const parsed = await lerArquivoExtrato(file);
      if (!parsed || parsed.length === 0) throw new Error('vazio');
      setRows(parsed);
      const h = parsed[0] || [];
      const cD = guessColIndex(h, ['data', 'date', 'dt ']);
      const cDesc = guessColIndex(h, ['descri', 'histor', 'estabelec', 'lançamento', 'lancamento']);
      const cV = guessColIndex(h, ['valor', 'amount', 'r$']);
      setColData(cD);
      setColDesc(cDesc);
      setColValor(cV);
      setHeaderRow(1);
    } catch (e) {
      setErro('Não consegui ler esse arquivo. Confirme se é um .xlsx, .xls ou .csv válido.');
      setRows(null);
    } finally {
      setCarregando(false);
    }
  };

  useEffect(() => {
    if (!rows || colData < 0 || colDesc < 0 || colValor < 0) { setLinhas([]); return; }
    const usados = new Set();
    const novas = dataRows
      .filter((r) => r && r.some((c) => String(c).trim() !== ''))
      .map((r) => {
        const data = parseDataLivre(r[colData], formatoData);
        const descricao = String(r[colDesc] || '').trim();
        const valor = parseValorLivre(r[colValor]);
        const valorAbs = Math.abs(valor);
        const match = (pendentesRef.current || []).find((p) => (
          !usados.has(p.id)
          && Math.abs(p.valor - valorAbs) < 0.01
          && (p.mesFatura || p.data.slice(0, 7)) === mkFatura
        ));
        if (match) usados.add(match.id);
        const doHistorico = (historicoRef.current || {})[normalizarDescricao(descricao)];
        return {
          id: uid(),
          data,
          descricao,
          valorAbs,
          valorOriginal: valor,
          categoria: match ? match.categoria : (doHistorico || sugerirCategoria(descricao)),
          pelaHistoria: !match && !!doHistorico,
          incluir: valor !== 0 && !!data && !!descricao,
          correspondeId: match ? match.id : null,
        };
      });
    setLinhas(novas);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [rows, headerRow, colData, colDesc, colValor, formatoData, mkFatura]);

  const reset = () => {
    setRows(null); setLinhas([]); setErro(null);
    if (fileRef.current) fileRef.current.value = '';
  };

  const totalSelecionado = linhas.filter((l) => l.incluir).reduce((s, l) => s + l.valorAbs, 0);
  const qtdSelecionada = linhas.filter((l) => l.incluir).length;
  const qtdCorrespondentes = linhas.filter((l) => l.incluir && l.correspondeId).length;

  const confirmar = () => {
    const selecionadas = linhas.filter((l) => l.incluir && l.data && l.valorAbs > 0);
    if (selecionadas.length === 0) return;
    const novos = selecionadas
      .filter((l) => !l.correspondeId)
      .map((l) => ({ id: uid(), data: l.data, descricao: l.descricao, valor: l.valorAbs, categoria: l.categoria, confirmado: true, mesFatura: mkFatura }));
    const atualizacoes = selecionadas
      .filter((l) => l.correspondeId)
      .map((l) => ({ id: l.correspondeId, patch: { data: l.data, descricao: l.descricao, categoria: l.categoria, confirmado: true, mesFatura: mkFatura } }));
    onConfirm(novos, atualizacoes);
    if (onAprender) onAprender(selecionadas.map((l) => ({ descricao: l.descricao, categoria: l.categoria })));
    if (replicarContasPagar && onReplicar) {
      const porCategoria = {};
      selecionadas.forEach((l) => { porCategoria[l.categoria] = (porCategoria[l.categoria] || 0) + l.valorAbs; });
      onReplicar(Object.entries(porCategoria).map(([categoria, valor]) => ({ categoria, valor })), mkFatura);
    }
    reset();
  };

  return (
    <Card className="p-4">
      <SectionTitle
        icon="UploadCloud"
        title="Importar extrato do cartão"
        subtitle="Aceita planilha Excel (.xlsx/.xls) ou CSV"
      />

      <div className="bg-emerald-50/60 rounded-xl p-3 mb-3">
        <label className="text-[11px] font-medium text-slate-500">Essa fatura é de qual mês?</label>
        <p className="text-[11px] text-slate-400 mb-1.5">Todas as compras desse extrato entram na análise desse mês, mesmo as feitas em outro mês (comum quando a fatura fecha antes do fim do mês).</p>
        <MonthYearPicker mes={mesFatura} ano={anoFatura} onChange={(m, y) => { setMesFatura(m); setAnoFatura(y); }} />
      </div>

      {!rows && (
        <label className="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-emerald-200 rounded-2xl py-10 cursor-pointer hover:bg-emerald-50/40 transition text-center px-4">
          <Icon name="FileSpreadsheet" size={26} className="text-emerald-400" />
          <span className="text-sm text-slate-600 font-medium">
            {carregando ? 'Lendo arquivo…' : 'Toque para escolher o arquivo do extrato'}
          </span>
          <span className="text-xs text-slate-400">.xlsx, .xls ou .csv</span>
          <input
            ref={fileRef}
            type="file"
            accept=".xlsx,.xls,.csv"
            className="hidden"
            onChange={(e) => handleFile(e.target.files?.[0])}
          />
        </label>
      )}

      {erro && (

          <Icon name="AlertTriangle" size={14} className="mt-0.5 shrink-0" /> {erro}

            <div>
              <label className="text-[11px] font-medium text-slate-500">Coluna da descrição</label>
              <select value={colDesc} onChange={(e) => setColDesc(Number(e.target.value))} className="block mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white max-w-[140px]">
                <option value={-1}>Selecione…</option>
                {headers.map((h, i) => <option key={i} value={i}>{h || `Coluna ${i + 1}`}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[11px] font-medium text-slate-500">Coluna do valor</label>
              <select value={colValor} onChange={(e) => setColValor(Number(e.target.value))} className="block mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white max-w-[140px]">
                <option value={-1}>Selecione…</option>
                {headers.map((h, i) => <option key={i} value={i}>{h || `Coluna ${i + 1}`}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[11px] font-medium text-slate-500">Formato da data</label>
              <select value={formatoData} onChange={(e) => setFormatoData(e.target.value)} className="block mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white">
                <option value="BR">dd/mm/aaaa (Brasil)</option>
                <option value="US">mm/dd/aaaa (EUA)</option>
              </select>
            </div>
            <button onClick={reset} className="text-xs text-slate-400 hover:text-red-500 ml-auto">Cancelar</button>
          </div>

          {colData < 0 || colDesc < 0 || colValor < 0 ? (
            <EmptyState text="Selecione as três colunas acima para pré-visualizar os lançamentos." />
          ) : linhas.length === 0 ? (
