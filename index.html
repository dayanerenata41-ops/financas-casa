/* ------------------------------ Supabase -------------------------------- */
/* Usa a tabela "dados" (colunas: chave text, valor jsonb) como armazenamento
   chave/valor, no lugar do window.storage dos artifacts da Claude. */

const SUPABASE_URL = 'https://asvxjtvwpcgxortaumae.supabase.co/rest/v1';
const SUPABASE_KEY = 'sb_publishable_hxXUXcxZBiJoUQYN01Nwog_OJwWjYE7';

async function sbGetAll() {
  const res = await fetch(`${SUPABASE_URL}/dados?select=chave,valor`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  if (!res.ok) {
    const texto = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}${texto ? `: ${texto.slice(0, 200)}` : ''}`);
  }
  const linhas = await res.json();
  const mapa = {};
  linhas.forEach((l) => { mapa[l.chave] = l.valor; });
  return mapa;
}

async function sbSet(chave, valor) {
  const res = await fetch(`${SUPABASE_URL}/dados?on_conflict=chave`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify([{ chave, valor }]),
  });
  if (!res.ok) {
    const texto = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}${texto ? `: ${texto.slice(0, 200)}` : ''}`);
  }
  return true;
}

function BarListChart({ data, valueKey = 'valor', labelKey = 'name', colorFor }) {
  const max = Math.max(1, ...data.map((d) => d[valueKey] || 0));
  return (
    <div className="space-y-2.5">
      {data.map((d, i) => (
        <div key={i}>
          <div className="flex items-center justify-between text-xs mb-1">
            <span className="text-slate-600 truncate max-w-[65%]">{d[labelKey]}</span>
            <span className="text-slate-500">{formatBRL(d[valueKey])}</span>
          </div>
          <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div
              className="h-full rounded-full transition-all"
              style={{ width: `${((d[valueKey] || 0) / max) * 100}%`, background: colorFor ? colorFor(i) : '#059669' }}
            />
          </div>
        </div>
      ))}
    </div>
  );
}

function ColumnChart({ data, seriesKeys, seriesColors, stacked = false, height = 180 }) {
  const totals = data.map((d) => (stacked
    ? seriesKeys.reduce((s, k) => s + (d[k] || 0), 0)
    : Math.max(0, ...seriesKeys.map((k) => d[k] || 0))));
  const max = Math.max(1, ...totals);
  return (
    <div>
      <div className="flex items-end gap-2" style={{ height }}>
        {data.map((d, i) => (
          <div key={i} className="flex-1 flex flex-col items-center justify-end h-full min-w-0">
            {stacked ? (
              <div
                className="w-full flex flex-col-reverse rounded-t-md overflow-hidden bg-slate-50"
                style={{ height: `${Math.max((totals[i] / max) * 100, totals[i] > 0 ? 2 : 0)}%` }}
              >
                {seriesKeys.map((k) => (d[k] || 0) > 0 && (
                  <div
                    key={k}
                    title={`${k}: ${formatBRL(d[k])}`}
                    style={{ height: `${((d[k] || 0) / (totals[i] || 1)) * 100}%`, background: seriesColors[k] }}
                  />
                ))}
              </div>
            ) : (
              <div className="w-full flex items-end justify-center gap-0.5 h-full">
                {seriesKeys.map((k) => (
                  <div
                    key={k}
                    title={`${k}: ${formatBRL(d[k])}`}
                    className="flex-1 rounded-t-md transition-all"
                    style={{ height: `${Math.max(((d[k] || 0) / max) * 100, (d[k] || 0) > 0 ? 2 : 0)}%`, background: seriesColors[k] }}
                  />
                ))}
              </div>
            )}
            <span className="text-[10px] text-slate-400 mt-1 truncate max-w-full">{d.mes}</span>
          </div>
        ))}
      </div>
      <div className="flex flex-wrap gap-3 mt-3">
        {seriesKeys.map((k) => (
          <div key={k} className="flex items-center gap-1.5 text-[11px] text-slate-500">
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: seriesColors[k] }} /> {k}
          </div>
        ))}
      </div>
    </div>
  );
}

function LineChartSimple({ data, seriesKeys, seriesColors, seriesDash = {}, height = 200 }) {
  const w = 600;
  const h = height;
  const pad = 20;
  const maxX = Math.max(1, data.length - 1);
  const allVals = data.flatMap((d) => seriesKeys.map((k) => d[k] || 0));
  const maxY = Math.max(1, ...allVals);
  const minY = Math.min(0, ...allVals);
  const range = maxY - minY || 1;
  const xScale = (i) => pad + (i / maxX) * (w - pad * 2);
  const yScale = (v) => h - pad - ((v - minY) / range) * (h - pad * 2);

  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ height }} preserveAspectRatio="none">
        {[0, 0.25, 0.5, 0.75, 1].map((f) => (
          <line key={f} x1={pad} x2={w - pad} y1={pad + f * (h - pad * 2)} y2={pad + f * (h - pad * 2)} stroke="#ecfdf5" strokeWidth="1" />
        ))}
        {seriesKeys.map((k) => (
          <polyline
            key={k}
            fill="none"
            stroke={seriesColors[k]}
            strokeWidth="2.5"
            strokeDasharray={seriesDash[k] || undefined}
            points={data.map((d, i) => `${xScale(i)},${yScale(d[k] || 0)}`).join(' ')}
          />
        ))}
      </svg>
      <div className="flex flex-wrap gap-3 mt-2">
        {seriesKeys.map((k) => (
          <div key={k} className="flex items-center gap-1.5 text-[11px] text-slate-500">
            <span className="w-3 h-0.5 rounded-full shrink-0" style={{ background: seriesColors[k] }} /> {k}
          </div>
        ))}
      </div>
    </div>
  );
}

const pad2 = (n) => String(n).padStart(2, '0');

function getStatus(t) {
  const today = todayStr();
  if (t.quitado) return t.tipo === 'pagar' ? 'Pago' : 'Recebido';
  if (t.data < today) return 'Em atraso';
  return t.tipo === 'pagar' ? 'A pagar' : 'A receber';
}

function statusClasses(status) {
  if (status === 'Pago' || status === 'Recebido') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
  if (status === 'Em atraso') return 'bg-red-50 text-red-600 border-red-200';
  if (status === 'Parcial') return 'bg-blue-50 text-blue-700 border-blue-200';
  return 'bg-amber-50 text-amber-700 border-amber-200';
}

function formatDateBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function addMonthsToDateStr(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1 + n, 1);
  const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  const day = Math.min(d, lastDay);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(day)}`;
}

/* --------------------------- Parsing de extrato --------------------------- */

function parseValorLivre(raw) {
  if (typeof raw === 'number') return raw;
  if (!raw) return 0;
  let s = String(raw).trim().replace(/[^0-9,.\-]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s);
  return Number.isNaN(n) ? 0 : n;
}

function parseDataLivre(raw, formato = 'BR') {
  if (!raw) return '';
  if (raw instanceof Date && !Number.isNaN(raw.getTime())) {
    return `${raw.getFullYear()}-${pad2(raw.getMonth() + 1)}-${pad2(raw.getDate())}`;
  }
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let [, p1, p2, y] = m;
    if (y.length === 2) y = `20${y}`;
    const dia = formato === 'US' ? p2 : p1;
    const mes = formato === 'US' ? p1 : p2;
    return `${y}-${pad2(mes)}-${pad2(dia)}`;
  }
  return '';
}

function guessColIndex(headers, keywords) {
  return headers.findIndex((h) => keywords.some((k) => String(h).toLowerCase().includes(k)));
}

  { padrao: /mercado|superm|hortifruti|atacad|hiper/i, categoria: 'Alimentação Casa' },
  { padrao: /ifood|rappi|restaurant|lanchon|cinema|netflix|spotify|bar |cerveja|show|ingresso/i, categoria: 'Alimentação fora + Lazer' },
  { padrao: /uber|99app|taxi|estacionament|oficina|auto ?pe[cç]as|pneu|mecanic/i, categoria: 'Despesas Carro/Moto' },
  { padrao: /farmacia|drogaria|pet ?shop|veterinari/i, categoria: 'Despesas Gerais Casa' },
  { padrao: /viagem|hotel|pousada|passagem|airbnb|decolar|latam|gol |azul /i, categoria: 'Viagens' },
  { padrao: /imposto|iptu|ipva|darf|receita federal/i, categoria: 'Impostos' },
  { padrao: /financiamento|parcela veiculo|consorcio/i, categoria: 'Financiamentos' },
  { padrao: /loja|magazine|shopping|roupa|calcado/i, categoria: 'Extras Day' },
];

function sugerirCategoria(descricao) {
  const found = REGRAS_CATEGORIA.find((r) => r.padrao.test(descricao || ''));
  return found ? found.categoria : CATEGORIAS_PAGAR[0];
}

async function lerArquivoExtrato(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  let wb;
  if (ext === 'csv') {
    const text = await file.text();
    wb = XLSX.read(text, { type: 'string', cellDates: true });
  } else {
    const buf = await file.arrayBuffer();
    wb = XLSX.read(buf, { type: 'array', cellDates: true });
  }
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, dateNF: 'yyyy-mm-dd', defval: '' });
}

/* --------------------------- Seletor de período -------------------------- */

function MonthYearPicker({ mes, ano, onChange }) {
  const go = (delta) => {
    let m = mes + delta;
    let y = ano;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }
    onChange(m, y);
  };
  return (
    <div className="flex items-center gap-1 bg-emerald-50 rounded-xl p-1">
      <button onClick={() => go(-1)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white text-emerald-700 transition">
        <Icon name="ChevronLeft" size={16} />
      </button>
      <div className="px-2 text-sm font-medium text-emerald-800 min-w-[110px] text-center select-none">
        {MESES[mes - 1]} {ano}
      </div>
      <button onClick={() => go(1)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white text-emerald-700 transition">
        <Icon name="ChevronRight" size={16} />
      </button>
    </div>
  );
}

/* --------------------------- Filtro multi-categoria ----------------------- */

function CategoryMultiSelect({ categorias, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function onClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, []);

  const toggle = (cat) => {
    if (selected.includes(cat)) onChange(selected.filter((c) => c !== cat));
    else onChange([...selected, cat]);
  };

  const label = selected.length === 0 || selected.length === categorias.length
    ? 'Todas as categorias'
    : `${selected.length} categoria${selected.length > 1 ? 's' : ''}`;

  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen((o) => !o)}
        className="flex items-center gap-2 text-sm bg-white border border-emerald-200 rounded-xl px-3 py-2 text-slate-600 hover:border-emerald-300 transition"
      >
        <Icon name="Filter" size={14} className="text-emerald-500" />
        {label}
        <Icon name="ChevronDown" size={14} className="text-slate-400" />
      </button>
      {open && (
        <div className="absolute z-20 mt-2 w-64 bg-white border border-emerald-100 rounded-xl shadow-lg p-2 max-h-72 overflow-y-auto pf-scroll">
          <button
            onClick={() => onChange([])}
            className="w-full text-left text-xs font-medium text-emerald-600 px-2 py-1.5 hover:bg-emerald-50 rounded-lg mb-1"
          >
            Limpar seleção (todas)
          </button>
          {categorias.map((cat) => (
            <label key={cat} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-emerald-50 cursor-pointer text-sm text-slate-700">
              <input
                type="checkbox"
                checked={selected.includes(cat)}
                onChange={() => toggle(cat)}
                className="accent-emerald-600 w-4 h-4"
              />
              {cat}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function TransactionModal({ open, onClose, onSave, categorias, tipo, initial }) {
  const blank = {
    descricao: '', categoria: categorias[0], valor: '', data: todayStr(), quitado: false,
  };
  const [form, setForm] = useState(blank);
  const [recorrente, setRecorrente] = useState(false);
  const [meses, setMeses] = useState(12);

  useEffect(() => {
    if (open) {
      setForm(initial ? { ...initial, valor: String(initial.valor) } : blank);
      setRecorrente(false);
      setMeses(12);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, initial]);

  if (!open) return null;

  const valid = form.descricao.trim() && form.categoria && Number(form.valor) > 0 && form.data;

  const submit = () => {
    if (!valid) return;
    onSave({
      ...form,
      valor: Number(form.valor),
      tipo,
    }, recorrente ? meses : 0);
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-md p-5 sm:p-6 max-h-[90vh] overflow-y-auto pf-scroll">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold text-slate-800">
            {initial ? 'Editar lançamento' : 'Novo lançamento'}
          </h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>

        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium text-slate-500">Descrição</label>
            <input
              value={form.descricao}
              onChange={(e) => setForm({ ...form, descricao: e.target.value })}
              placeholder={tipo === 'pagar' ? 'Ex: Supermercado, Aluguel...' : 'Ex: Salário, Freela...'}
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>

          <div>
            <label className="text-xs font-medium text-slate-500">Categoria</label>
            <select
              value={form.categoria}
              onChange={(e) => setForm({ ...form, categoria: e.target.value })}
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300 bg-white"
            >
              {categorias.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-slate-500">Valor (R$)</label>
              <input
                type="number" min="0" step="0.01"
                value={form.valor}
                onChange={(e) => setForm({ ...form, valor: e.target.value })}
                placeholder="0,00"
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-500">Data</label>
              <input
                type="date"
                value={form.data}
                onChange={(e) => setForm({ ...form, data: e.target.value })}
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
          </div>

          <label className="flex items-center gap-2 text-sm text-slate-600 pt-1">
            <input
              type="checkbox"
              checked={form.quitado}
              onChange={(e) => setForm({ ...form, quitado: e.target.checked })}
              className="accent-emerald-600 w-4 h-4"
            />
            Já {tipo === 'pagar' ? 'foi pago' : 'foi recebido'}
          </label>

          {!initial && (
            <div className="border border-emerald-100 bg-emerald-50/50 rounded-xl p-3">
              <label className="flex items-center gap-2 text-sm text-slate-700">
                <input
                  type="checkbox"
                  checked={recorrente}
                  onChange={(e) => setRecorrente(e.target.checked)}
                  className="accent-emerald-600 w-4 h-4"
                />
                <Icon name="Repeat" size={14} className="text-emerald-600" />

              </label>
              {recorrente && (
                <div className="mt-2 flex items-center gap-2 text-sm text-slate-500">
                  Por
                  <input
                    type="number" min="1" max="60" value={meses}
                    onChange={(e) => setMeses(Number(e.target.value))}
                    className="w-16 border border-slate-200 rounded-lg px-2 py-1 text-sm text-center"
                  />
                  meses (incluindo este)

              )}
            </div>
          )}

        <button

          className="w-full mt-5 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"

function ContasTable({ tipo, categorias, lancamentos, onAdd, onEdit, onToggleQuitado, onDuplicate, onDelete }) {
  const now = new Date();
  const [mes, setMes] = useState(now.getMonth() + 1);
  const [ano, setAno] = useState(now.getFullYear());
  const [modoFiltro, setModoFiltro] = useState('mes'); // mes | periodo
  const [dataInicio, setDataInicio] = useState(`${now.getFullYear()}-${pad2(now.getMonth() + 1)}-01`);
  const [dataFim, setDataFim] = useState(todayStr());
  const [categoriasSel, setCategoriasSel] = useState([]);
  const [statusFiltro, setStatusFiltro] = useState('todos'); // todos | quitado | pendente
  const [busca, setBusca] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  const mk = monthKey(ano, mes);

  const doTipo = useMemo(
    () => lancamentos.filter((t) => t.tipo === tipo),
    [lancamentos, tipo],
  );

  const doMes = useMemo(() => {
    if (modoFiltro === 'periodo') {
      const ini = dataInicio || '0000-01-01';
      const fim = dataFim || '9999-12-31';
      return doTipo.filter((t) => t.data >= ini && t.data <= fim);
    }
    return doTipo.filter((t) => t.data.slice(0, 7) === mk);
  }, [doTipo, mk, modoFiltro, dataInicio, dataFim]);

  const filtrados = useMemo(() => {
    let list = doMes;
    if (categoriasSel.length > 0) list = list.filter((t) => categoriasSel.includes(t.categoria));
    if (statusFiltro === 'quitado') list = list.filter((t) => t.quitado);
    if (statusFiltro === 'pendente') list = list.filter((t) => !t.quitado);
    if (busca.trim()) {
      const termo = busca.trim().toLowerCase();
      list = list.filter((t) => t.descricao.toLowerCase().includes(termo));
    }
    return [...list].sort((a, b) => a.data.localeCompare(b.data));
  }, [doMes, categoriasSel, statusFiltro, busca]);

  const resumoFiltro = useMemo(() => {
    const map = {};
    filtrados.forEach((t) => {
      if (!map[t.categoria]) map[t.categoria] = { quitado: 0, pendente: 0 };
      if (t.quitado) map[t.categoria].quitado += t.valor;
      else map[t.categoria].pendente += t.valor;
    });
    return Object.entries(map)
      .map(([categoria, v]) => ({ categoria, ...v, total: v.quitado + v.pendente }))
      .sort((a, b) => b.total - a.total);
  }, [filtrados]);

  const previsaoPorCategoria = useMemo(() => {
    const map = {};
    categorias.forEach((c) => { map[c] = 0; });
    doMes.forEach((t) => { map[t.categoria] = (map[t.categoria] || 0) + t.valor; });
    return map;
  }, [doMes, categorias]);

  const previsaoOrdenada = useMemo(
    () => categorias
      .map((c) => ({ categoria: c, valor: previsaoPorCategoria[c] || 0 }))
      .filter((l) => l.valor > 0)
      .sort((a, b) => b.valor - a.valor),
    [categorias, previsaoPorCategoria],
  );

  const totalMes = doMes.reduce((s, t) => s + t.valor, 0);

  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (t) => { setEditing(t); setModalOpen(true); };

  const handleSave = (data, meses) => {
    if (editing) {
      onEdit({ ...editing, ...data });
    } else if (meses > 1) {
      const recorrenciaId = uid();
      const novos = Array.from({ length: meses }, (_, i) => ({
        ...data,
        id: uid(),
        data: addMonthsToDateStr(data.data, i),
        recorrenciaId,
      }));
      onAdd(novos);
    } else {
      onAdd([{ ...data, id: uid() }]);
    }
    setModalOpen(false);
  };

  const corValor = tipo === 'pagar' ? 'text-red-500' : 'text-emerald-600';

  return (
    <div className="pb-24">
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <div className="flex bg-emerald-50 rounded-xl p-1 text-xs font-medium">
          {[{ v: 'mes', l: 'Mês' }, { v: 'periodo', l: 'Período' }].map((op) => (
            <button
              key={op.v}
              onClick={() => setModoFiltro(op.v)}
              className={`px-3 py-1.5 rounded-lg transition ${modoFiltro === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-600/70'}`}
            >
              {op.l}
            </button>
          ))}
        </div>
        {modoFiltro === 'mes' ? (
          <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
        ) : (
          <div className="flex items-center gap-1.5 text-sm">
            <input
              type="date"
              value={dataInicio}
              onChange={(e) => setDataInicio(e.target.value)}
              className="border border-slate-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
            <span className="text-slate-400 text-xs">até</span>
            <input
              type="date"
              value={dataFim}
              onChange={(e) => setDataFim(e.target.value)}
              className="border border-slate-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
        )}
        <CategoryMultiSelect categorias={categorias} selected={categoriasSel} onChange={setCategoriasSel} />
      </div>

      <div className="flex flex-wrap items-center gap-2 mb-4">
        <div className="flex bg-emerald-50 rounded-xl p-1 text-xs font-medium">
          {[
            { v: 'todos', l: 'Todos' },
            { v: 'quitado', l: tipo === 'pagar' ? 'Pago' : 'Recebido' },
            { v: 'pendente', l: tipo === 'pagar' ? 'A pagar' : 'A receber' },
          ].map((op) => (
            <button
              key={op.v}
              onClick={() => setStatusFiltro(op.v)}
              className={`px-3 py-1.5 rounded-lg transition ${statusFiltro === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-600/70'}`}
            >
              {op.l}
            </button>
          ))}
        </div>
        <div className="relative flex-1 min-w-[160px]">
          <Icon name="Filter" size={13} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300" />
          <input
            value={busca}
            onChange={(e) => setBusca(e.target.value)}
            placeholder="Buscar por descrição..."
            className="w-full text-sm border border-slate-200 rounded-xl pl-8 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
          />
        </div>
      </div>

      <Card className="p-4 mb-4">
        <SectionTitle
          icon={tipo === 'pagar' ? 'ArrowUpCircle' : 'ArrowDownCircle'}
          title={tipo === 'pagar' ? 'Previsão de despesas' : 'Previsão de receita'}
          subtitle={modoFiltro === 'periodo' ? `${formatDateBR(dataInicio)} a ${formatDateBR(dataFim)}` : `${MESES[mes - 1]} ${ano}`}
        />
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
          {previsaoOrdenada.map((l) => (
            <div key={l.categoria} className="bg-emerald-50/60 rounded-xl px-3 py-2">
              <div className="text-[11px] text-slate-500 truncate">{l.categoria}</div>
              <div className="text-sm font-semibold text-slate-700">{formatBRL(l.valor)}</div>
            </div>
          ))}
        </div>
        <div className="flex items-center justify-between mt-3 pt-3 border-t border-emerald-100">
          <span className="text-sm font-medium text-slate-500">Total do período</span>
          <span className={`text-lg font-semibold ${corValor}`}>{formatBRL(totalMes)}</span>
        </div>
      </Card>

      {resumoFiltro.length > 0 && (
        <Card className="p-4 mb-4">
          <SectionTitle title="Subtotal do filtro" subtitle={`${filtrados.length} lançamento(s) · do maior para o menor`} />
          <div className="space-y-2">
            {resumoFiltro.map((r) => (
              <div key={r.categoria} className="flex items-center justify-between text-xs bg-slate-50 rounded-lg px-3 py-2 gap-2">
                <span className="text-slate-600 font-medium truncate">{r.categoria}</span>
                <div className="flex gap-3 shrink-0">
                  <span className="text-emerald-600">{tipo === 'pagar' ? 'Pago' : 'Recebido'}: {formatBRL(r.quitado)}</span>
                  <span className="text-amber-600">{tipo === 'pagar' ? 'A pagar' : 'A receber'}: {formatBRL(r.pendente)}</span>
                </div>
              </div>
            ))}
            <div className="flex items-center justify-between text-sm font-semibold pt-2 mt-1 border-t border-slate-100">
              <span className="text-slate-700">Total do filtro</span>
              <span className={corValor}>{formatBRL(resumoFiltro.reduce((s, r) => s + r.total, 0))}</span>
            </div>
          </div>
        </Card>
      )}

      <Card className="overflow-hidden">
        <div className="p-4 pb-0 flex items-center justify-between">
          <h3 className="text-sm font-semibold text-slate-700">Lançamentos</h3>
          <button

            className="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-2 rounded-xl transition"
          >
            <Icon name="Plus" size={14} /> Novo
          </button>
        </div>

        {filtrados.length === 0 ? (
          <EmptyState text="Nenhum lançamento neste período." />
        ) : (
          <div className="overflow-x-auto pf-scroll mt-3">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-[11px] uppercase tracking-wide text-slate-400 border-t border-b border-slate-100">
                  <th className="px-4 py-2 font-medium">Quitado</th>
                  <th className="px-2 py-2 font-medium">Data</th>
                  <th className="px-2 py-2 font-medium">Descrição</th>

                        <button
                          onClick={() => onToggleQuitado(t)}
                          className={`w-6 h-6 rounded-lg flex items-center justify-center border transition ${t.quitado ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 text-transparent hover:border-emerald-400'}`}
                        >
                          <Icon name="Check" size={14} />
                        </button>
                      </td>
                      <td className="px-2 py-2.5 whitespace-nowrap text-slate-500">{formatDateBR(t.data)}</td>
                      <td className="px-2 py-2.5 text-slate-700 max-w-[160px] truncate">{t.descricao}</td>
                      <td className="px-2 py-2.5 hidden sm:table-cell text-slate-500">{t.categoria}</td>
                      <td className={`px-2 py-2.5 text-right font-medium whitespace-nowrap ${corValor}`}>{formatBRL(t.valor)}</td>
                      <td className="px-2 py-2.5"><Badge status={status} /></td>
                      <td className="px-2 py-2.5">
                        <div className="flex items-center justify-end gap-1">
                          <button onClick={() => openEdit(t)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                            <Icon name="Pencil" size={13} />
                          </button>
                          <button onClick={() => onDuplicate(t)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                            <Icon name="Copy" size={13} />
                          </button>
                          <button onClick={() => onDelete(t)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
                            <Icon name="Trash2" size={13} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <TransactionModal
        open={modalOpen}
        onClose={() => setModalOpen(false)}
        onSave={handleSave}
        categorias={categorias}
        tipo={tipo}
        initial={editing}
      />
    </div>
  );
}

/* --------------------------------- Dashboard ------------------------------ */

function DashboardTab({ lancamentos, orcamentos, onSetOrcamento, config, onSetSaldoInicial }) {
  const now = new Date();
  const [mes, setMes] = useState(now.getMonth() + 1);
  const [ano, setAno] = useState(now.getFullYear());
  const [statusFiltro, setStatusFiltro] = useState('todos'); // todos | quitado | pendente
  const [fluxoFiltro, setFluxoFiltro] = useState('tudo'); // tudo | quitado | aquitar

  const mk = monthKey(ano, mes);

  const doMes = useMemo(() => lancamentos.filter((t) => t.data.slice(0, 7) === mk), [lancamentos, mk]);

  const passaFiltroStatus = (t) => {
    if (statusFiltro === 'todos') return true;
    if (statusFiltro === 'quitado') return t.quitado;
    return !t.quitado;
  };

  const totalReceber = doMes.filter((t) => t.tipo === 'receber' && passaFiltroStatus(t)).reduce((s, t) => s + t.valor, 0);
  const totalPagar = doMes.filter((t) => t.tipo === 'pagar' && passaFiltroStatus(t)).reduce((s, t) => s + t.valor, 0);
  const saldoPeriodo = totalReceber - totalPagar;

  const somaCategoria = (categorias, tipo) => doMes
    .filter((t) => t.tipo === tipo && categorias.includes(t.categoria) && passaFiltroStatus(t))
    .reduce((s, t) => s + t.valor, 0);
  const dreReceitas = somaCategoria(DRE_RECEITAS, 'receber');
  const dreDespesas = somaCategoria(DRE_DESPESAS, 'pagar');
  const dreLucro = dreReceitas - dreDespesas;
  const dreEntradasExtras = somaCategoria(DRE_ENTRADAS_EXTRAS, 'receber');
  const drePagamentosExtras = somaCategoria(DRE_PAGAMENTOS_EXTRAS, 'pagar');
  const dreLucroReal = dreLucro + dreEntradasExtras - drePagamentosExtras;

  // Top fornecedores (despesas por descrição)
  const porFornecedor = useMemo(() => {
    const map = {};
    doMes.filter((t) => t.tipo === 'pagar').forEach((t) => {
      map[t.descricao] = (map[t.descricao] || 0) + t.valor;
    });
    return Object.entries(map)
      .map(([name, valor]) => ({ name, valor }))
      .sort((a, b) => b.valor - a.valor)
      .slice(0, 8);
  }, [doMes]);

  // Dízimo
  const totalReceitasLancadas = doMes.filter((t) => t.tipo === 'receber').reduce((s, t) => s + t.valor, 0);
  const dizimoEsperado = totalReceitasLancadas * 0.10;
  const dizimoPago = doMes.filter((t) => t.tipo === 'pagar' && t.categoria === 'Dízimo' && t.quitado).reduce((s, t) => s + t.valor, 0);
  const dizimoFalta = Math.max(dizimoEsperado - dizimoPago, 0);
  const dizimoPct = dizimoEsperado > 0 ? Math.min((dizimoPago / dizimoEsperado) * 100, 100) : 0;

  // Orçado x Realizado
  const todasCategorias = [
    ...CATEGORIAS_RECEBER.map((c) => ({ categoria: c, tipo: 'receber' })),
    ...CATEGORIAS_PAGAR.map((c) => ({ categoria: c, tipo: 'pagar' })),
  ];
  const realizadoPorCategoria = useMemo(() => {
    const map = {};
    doMes.forEach((t) => {
      if (!t.quitado) return;
      const key = `${t.tipo}:${t.categoria}`;
      map[key] = (map[key] || 0) + t.valor;
    });
    return map;
  }, [doMes]);

  const linhasOrcamento = todasCategorias
    .map(({ categoria, tipo }) => {
      const orcado = orcamentos?.[categoria]?.[mk] ?? 0;
      const realizado = realizadoPorCategoria[`${tipo}:${categoria}`] || 0;
      return { categoria, tipo, orcado, realizado };
    })
    .filter((l) => l.orcado > 0 || l.realizado > 0)
    .sort((a, b) => Math.max(b.orcado, b.realizado) - Math.max(a.orcado, a.realizado));

  // Fluxo de caixa diário
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const saldoInicial = config?.saldoInicial?.[mk] ?? 0;

  const passaFluxo = (t) => {
    if (fluxoFiltro === 'tudo') return true;
    if (fluxoFiltro === 'quitado') return t.quitado;
    return !t.quitado;
  };

  const fluxo = useMemo(() => {
    let acumulado = saldoInicial;
    const linhas = [];
    for (let d = 1; d <= diasNoMes; d += 1) {
      const dataStr = `${ano}-${pad2(mes)}-${pad2(d)}`;
      const doDia = doMes.filter((t) => t.data === dataStr && passaFluxo(t));
      const entradas = doDia.filter((t) => t.tipo === 'receber').reduce((s, t) => s + t.valor, 0);
      const saidas = doDia.filter((t) => t.tipo === 'pagar').reduce((s, t) => s + t.valor, 0);
      const saldoDia = entradas - saidas;
      acumulado += saldoDia;
      linhas.push({ dia: d, dataStr, entradas, saidas, saldoDia, acumulado });
    }
    return linhas;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [doMes, diasNoMes, ano, mes, saldoInicial, fluxoFiltro]);

  return (
    <div className="pb-24 space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
        <div className="flex bg-emerald-50 rounded-xl p-1 text-xs font-medium">
          {[
            { v: 'todos', l: 'Tudo' },
            { v: 'quitado', l: 'Pago/Recebido' },
            { v: 'pendente', l: 'A pagar/receber' },
          ].map((op) => (
            <button
              key={op.v}
              onClick={() => setStatusFiltro(op.v)}
              className={`px-3 py-1.5 rounded-lg transition ${statusFiltro === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-600/70'}`}
            >
              {op.l}
            </button>
          ))}
        </div>
      </div>

      {/* Cards resumo */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Card className="p-4">
          <div className="flex items-center gap-2 text-emerald-600 text-xs font-medium mb-1">
            <Icon name="ArrowDownCircle" size={14} /> Receitas
          </div>
          <div className="text-xl font-semibold text-slate-800">{formatBRL(totalReceber)}</div>
        </Card>
        <Card className="p-4">
          <div className="flex items-center gap-2 text-red-500 text-xs font-medium mb-1">
            <Icon name="ArrowUpCircle" size={14} /> Despesas
          </div>
          <div className="text-xl font-semibold text-slate-800">{formatBRL(totalPagar)}</div>
        </Card>
        <Card className="p-4">
          <div className="flex items-center gap-2 text-slate-500 text-xs font-medium mb-1">
            <Icon name="Wallet" size={14} /> Saldo do período
          </div>
          <div className={`text-xl font-semibold ${saldoPeriodo < 0 ? 'text-red-500' : 'text-emerald-600'}`}>
            {formatBRL(saldoPeriodo)}
          </div>
        </Card>
      </div>

      {/* DRE */}
      <Card className="p-4">
        <SectionTitle icon="FileSpreadsheet" title="DRE" subtitle="Demonstrativo do resultado do mês" />
        <div className="space-y-4">
          <DreSecao titulo="Receitas" categorias={DRE_RECEITAS} tipo="receber" dados={doMes} passaFiltro={passaFiltroStatus} cor="text-emerald-600" />
          <DreSecao titulo="Despesas" categorias={DRE_DESPESAS} tipo="pagar" dados={doMes} passaFiltro={passaFiltroStatus} cor="text-red-500" />
          <DreLinha label="Lucro" valor={dreLucro} />
          <DreSecao titulo="Entradas Extras" categorias={DRE_ENTRADAS_EXTRAS} tipo="receber" dados={doMes} passaFiltro={passaFiltroStatus} cor="text-emerald-600" />
          <DreSecao titulo="Pagamentos Extras" categorias={DRE_PAGAMENTOS_EXTRAS} tipo="pagar" dados={doMes} passaFiltro={passaFiltroStatus} cor="text-red-500" />
          <DreLinha label="Lucro real" valor={dreLucroReal} grande />
        </div>
      </Card>

      {/* Fornecedores */}
      <Card className="p-4">
        <SectionTitle icon="TrendingUp" title="Maiores despesas por fornecedor" subtitle="Top 8 no período" />
        {porFornecedor.length === 0 ? <EmptyState text="Sem despesas lançadas neste mês." /> : (
          <BarListChart data={porFornecedor} valueKey="valor" labelKey="name" colorFor={(i) => (i === 0 ? '#059669' : '#6ee7b7')} />
        )}
      </Card>

      {/* Dízimo */}
      <Card className="p-4">
        <SectionTitle icon="HeartHandshake" title="Dízimo do mês" subtitle="10% das receitas lançadas em Contas a Receber" />
        <div className="flex items-center justify-between text-sm mb-2">
          <span className="text-slate-500">Esperado: <b className="text-slate-700">{formatBRL(dizimoEsperado)}</b></span>
          <span className="text-slate-500">Pago: <b className="text-emerald-600">{formatBRL(dizimoPago)}</b></span>
        </div>
        <div className="w-full h-2.5 bg-emerald-50 rounded-full overflow-hidden">
          <div className="h-full bg-emerald-500 rounded-full transition-all" style={{ width: `${dizimoPct}%` }} />
        </div>
        <div className="mt-2 text-xs">
          {dizimoFalta > 0
            ? <span className="text-amber-600 font-medium">Falta {formatBRL(dizimoFalta)} para completar o dízimo do mês.</span>
            : <span className="text-emerald-600 font-medium">Dízimo do mês em dia. 🎉</span>}
        </div>
      </Card>

      {/* Orçado x Realizado */}
      <Card className="p-4">
        <SectionTitle icon="LayoutDashboard" title="Orçado x Realizado" subtitle="Clique no valor orçado para editar" />
        {linhasOrcamento.length === 0 ? (
          <EmptyState text="Defina um orçamento por categoria abaixo para começar a comparar." />
        ) : (
          <div className="space-y-2 mb-3">
            {linhasOrcamento.map((l) => {
              const isDespesa = l.tipo === 'pagar';
              const estourou = isDespesa && l.orcado > 0 && l.realizado > l.orcado;
              const pct = l.orcado > 0 ? Math.min((l.realizado / l.orcado) * 100, 100) : 0;
              return (
                <div key={`${l.tipo}-${l.categoria}`}>
                  <div className="flex items-center justify-between text-xs mb-1">
                    <span className="text-slate-600">{l.categoria}</span>
                    <span className={estourou ? 'text-red-500 font-medium' : 'text-slate-500'}>
                      {formatBRL(l.realizado)} / {formatBRL(l.orcado)}
                    </span>
                  </div>
                  <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div
                      className={`h-full rounded-full ${estourou ? 'bg-red-500' : isDespesa ? 'bg-emerald-500' : 'bg-emerald-400'}`}
                      style={{ width: `${pct}%` }}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <details className="mt-3 group">
          <summary className="text-xs font-medium text-emerald-600 cursor-pointer select-none list-none flex items-center gap-1">
            <Icon name="ChevronDown" size={13} className="transition group-open:rotate-180" /> Editar orçamentos por categoria
          </summary>
          <div className="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-56 overflow-y-auto pf-scroll pr-1">
            {todasCategorias.map(({ categoria }) => (
              <div key={categoria} className="flex items-center justify-between gap-2 bg-slate-50 rounded-lg px-2.5 py-1.5">
                <span className="text-xs text-slate-500 truncate">{categoria}</span>
                <input
                  type="number" min="0" step="0.01"
                  defaultValue={orcamentos?.[categoria]?.[mk] ?? ''}
                  onBlur={(e) => onSetOrcamento(categoria, mk, Number(e.target.value) || 0)}
                  placeholder="0,00"
                  className="w-24 text-xs text-right border border-slate-200 rounded-md px-2 py-1 focus:outline-none focus:ring-1 focus:ring-emerald-300"
                />
              </div>
            ))}
          </div>
        </details>
      </Card>

      {/* Fluxo de caixa */}
      <Card className="p-4">
        <SectionTitle icon="Wallet" title="Fluxo de caixa diário" subtitle={`${MESES[mes - 1]} ${ano}`} />

        <div className="flex flex-wrap items-center gap-3 mb-3">
          <div className="flex items-center gap-2 text-xs">
            <span className="text-slate-500">Saldo inicial do mês</span>
            <input
              type="number" step="0.01"
              defaultValue={saldoInicial}
              onBlur={(e) => onSetSaldoInicial(mk, Number(e.target.value) || 0)}
              className="w-28 border border-slate-200 rounded-lg px-2 py-1 text-right focus:outline-none focus:ring-1 focus:ring-emerald-300"
            />
          </div>
          <div className="flex bg-emerald-50 rounded-xl p-1 text-xs font-medium ml-auto">
            {[
              { v: 'tudo', l: 'Tudo' },
              { v: 'quitado', l: 'Quitado' },
              { v: 'aquitar', l: 'A quitar' },
            ].map((op) => (
              <button
                key={op.v}
                onClick={() => setFluxoFiltro(op.v)}
                className={`px-2.5 py-1.5 rounded-lg transition ${fluxoFiltro === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-600/70'}`}
              >
                {op.l}
              </button>
            ))}
          </div>
        </div>

        <div className="overflow-x-auto pf-scroll max-h-80 overflow-y-auto">
          <table className="w-full text-xs">
            <thead className="sticky top-0 bg-white">
              <tr className="text-left text-[10px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
                <th className="px-2 py-2">Dia</th>
                <th className="px-2 py-2 text-right">Entradas</th>
                <th className="px-2 py-2 text-right">Saídas</th>
                <th className="px-2 py-2 text-right">Saldo do dia</th>
                <th className="px-2 py-2 text-right">Acumulado</th>
              </tr>
            </thead>
            <tbody>
              {fluxo.map((l) => (
                <tr key={l.dia} className={`border-b border-slate-50 ${l.dataStr === todayStr() ? 'bg-emerald-50/60' : ''}`}>
                  <td className="px-2 py-1.5 text-slate-500 whitespace-nowrap">{pad2(l.dia)}/{pad2(mes)}</td>
                  <td className="px-2 py-1.5 text-right text-emerald-600">{l.entradas > 0 ? formatBRL(l.entradas) : '—'}</td>
                  <td className="px-2 py-1.5 text-right text-red-500">{l.saidas > 0 ? formatBRL(l.saidas) : '—'}</td>
                  <td className={`px-2 py-1.5 text-right font-medium ${l.saldoDia < 0 ? 'text-red-500' : 'text-slate-600'}`}>{formatBRL(l.saldoDia)}</td>
                  <td className={`px-2 py-1.5 text-right font-semibold ${l.acumulado < 0 ? 'text-red-600' : 'text-emerald-700'}`}>
                    {formatBRL(l.acumulado)}
                    {l.acumulado < 0 && <Icon name="AlertTriangle" size={11} className="inline ml-1 -mt-0.5" />}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* --------------------------------- Sonhos & Metas -------------------------- */

function monthsUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  const target = new Date(`${dateStr}T00:00:00`);
  let months = (target.getFullYear() - today.getFullYear()) * 12 + (target.getMonth() - today.getMonth());
  if (target.getDate() < today.getDate()) months -= 1;
  return months;
}

function MetaModal({ open, onClose, onSave, initial }) {
  const blank = { nome: '', valorAlvo: '', valorAtual: '', prazo: '' };
  const [form, setForm] = useState(blank);

  useEffect(() => {
    if (open) {
      setForm(initial
        ? { ...initial, valorAlvo: String(initial.valorAlvo), valorAtual: String(initial.valorAtual) }
        : blank);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, initial]);

  if (!open) return null;

  const valid = form.nome.trim() && Number(form.valorAlvo) > 0;

  const submit = () => {
    if (!valid) return;
    onSave({
      ...form,
      valorAlvo: Number(form.valorAlvo),
      valorAtual: Number(form.valorAtual) || 0,
    });
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-md p-5 sm:p-6 max-h-[90vh] overflow-y-auto pf-scroll">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold text-slate-800">
            {initial ? 'Editar meta' : 'Nova meta ou sonho'}
          </h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>

        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium text-slate-500">Nome do sonho / meta</label>
            <input
              value={form.nome}
              onChange={(e) => setForm({ ...form, nome: e.target.value })}
              placeholder="Ex: Viagem para a praia, Carro novo..."
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-slate-500">Valor necessário (R$)</label>
              <input
                type="number" min="0" step="0.01"
                value={form.valorAlvo}
                onChange={(e) => setForm({ ...form, valorAlvo: e.target.value })}
                placeholder="0,00"
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-500">Já reservado (R$)</label>
              <input
                type="number" min="0" step="0.01"
                value={form.valorAtual}
                onChange={(e) => setForm({ ...form, valorAtual: e.target.value })}
                placeholder="0,00"
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
          </div>

          <div>
            <label className="text-xs font-medium text-slate-500">Prazo (opcional)</label>
            <input
              type="date"
              value={form.prazo}
              onChange={(e) => setForm({ ...form, prazo: e.target.value })}
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
        </div>

        <button
          onClick={submit}
          disabled={!valid}
          className="w-full mt-5 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"
        >
          Salvar
        </button>
      </div>
    </div>
  );
}

function AporteModal({ open, onClose, onSave, meta }) {
  const [valor, setValor] = useState('');

  useEffect(() => { if (open) setValor(''); }, [open]);

  if (!open || !meta) return null;

  const submit = () => {
    const v = Number(valor);
    if (!v) return;
    onSave(meta, v);
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-sm p-5 sm:p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold text-slate-800">Atualizar "{meta.nome}"</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>
        <label className="text-xs font-medium text-slate-500">Valor a somar (use negativo para retirar)</label>
        <input
          type="number" step="0.01" autoFocus
          value={valor}
          onChange={(e) => setValor(e.target.value)}
          placeholder="0,00"
          className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
        />
        <p className="text-[11px] text-slate-400 mt-1">Reservado hoje: {formatBRL(meta.valorAtual)}</p>
        <button
          onClick={submit}
          disabled={!Number(valor)}
          className="w-full mt-4 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"
        >
          Confirmar
        </button>
      </div>
    </div>
  );
}

function MetaCard({ meta, onEdit, onDelete, onAportar }) {
  const pct = meta.valorAlvo > 0 ? Math.min((meta.valorAtual / meta.valorAlvo) * 100, 100) : 0;
  const concluida = meta.valorAtual >= meta.valorAlvo;
  const faltando = Math.max(meta.valorAlvo - meta.valorAtual, 0);
  const meses = monthsUntil(meta.prazo);
  const atrasada = meses !== null && meses < 0 && !concluida;
  const porMes = meses && meses > 0 ? faltando / meses : null;

  return (
    <Card className="p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div>
          <h4 className="text-sm font-semibold text-slate-800">{meta.nome}</h4>
          {meta.prazo && (
            <div className={`flex items-center gap-1 text-[11px] mt-0.5 ${atrasada ? 'text-red-500' : 'text-slate-400'}`}>
              <Icon name="CalendarClock" size={11} />
              {atrasada ? 'Prazo vencido' : `Até ${formatDateBR(meta.prazo)}`}
            </div>
          )}
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={() => onEdit(meta)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
            <Icon name="Pencil" size={13} />
          </button>
          <button onClick={() => onDelete(meta)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
            <Icon name="Trash2" size={13} />
          </button>
        </div>
      </div>

      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden mb-2">
        <div
          className={`h-full rounded-full ${concluida ? 'bg-emerald-500' : 'bg-emerald-400'}`}
          style={{ width: `${pct}%` }}
        />
      </div>

      <div className="flex items-center justify-between text-xs mb-3">
        <span className="text-slate-500">{formatBRL(meta.valorAtual)} de {formatBRL(meta.valorAlvo)}</span>
        <span className="font-medium text-emerald-600">{pct.toFixed(0)}%</span>
      </div>

      {concluida ? (
        <div className="text-xs font-medium text-emerald-600 bg-emerald-50 rounded-lg px-2.5 py-1.5 inline-block">
          Meta concluída! 🎉
        </div>
      ) : (
        <div className="flex items-center justify-between gap-2">
          <div className="text-[11px] text-slate-400">
            Faltam {formatBRL(faltando)}
            {porMes != null && !atrasada && <> · ~{formatBRL(porMes)}/mês</>}
          </div>
          <button
            onClick={() => onAportar(meta)}
            className="flex items-center gap-1 text-xs font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg transition"
          >
            <Icon name="PiggyBank" size={13} /> Atualizar
          </button>
        </div>
      )}
    </Card>
  );
}

function MetasTab({ metas, onAdd, onEdit, onDelete, onAportar }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [aportando, setAportando] = useState(null);

  const totalAlvo = metas.reduce((s, m) => s + m.valorAlvo, 0);
  const totalAtual = metas.reduce((s, m) => s + m.valorAtual, 0);
  const pctGeral = totalAlvo > 0 ? Math.min((totalAtual / totalAlvo) * 100, 100) : 0;

  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (m) => { setEditing(m); setModalOpen(true); };

  const handleSave = (data) => {
    if (editing) onEdit({ ...editing, ...data });
    else onAdd({ ...data, id: uid() });
    setModalOpen(false);
  };

  const handleDelete = (m) => {
    if (window.confirm && !window.confirm(`Excluir a meta "${m.nome}"?`)) return;
    onDelete(m);
  };

  const handleAporte = (meta, valor) => {
    const novoValor = Math.max((meta.valorAtual || 0) + valor, 0);
    onAportar({ ...meta, valorAtual: novoValor });
    setAportando(null);
  };

  return (
    <div className="pb-24">
      <Card className="p-4 mb-4">
        <SectionTitle
          icon="Sparkles"
          title="Sonhos & Metas da família"
          subtitle={`${metas.length} meta${metas.length !== 1 ? 's' : ''} cadastrada${metas.length !== 1 ? 's' : ''}`}
        />
        {metas.length > 0 && (
          <>
            <div className="flex items-center justify-between text-sm mb-2">
              <span className="text-slate-500">Reservado: <b className="text-emerald-600">{formatBRL(totalAtual)}</b></span>
              <span className="text-slate-500">Meta total: <b className="text-slate-700">{formatBRL(totalAlvo)}</b></span>
            </div>
            <div className="w-full h-2.5 bg-emerald-50 rounded-full overflow-hidden">
              <div className="h-full bg-emerald-500 rounded-full transition-all" style={{ width: `${pctGeral}%` }} />
            </div>
          </>
        )}
        <button
          onClick={openNew}
          className="flex items-center justify-center gap-1.5 w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-2.5 rounded-xl transition"
        >
          <Icon name="Plus" size={15} /> Nova meta ou sonho
        </button>
      </Card>

      {metas.length === 0 ? (
        <EmptyState text="Cadastre o primeiro sonho ou meta da família." />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {[...metas].sort((a, b) => b.valorAlvo - a.valorAlvo).map((m) => (
            <MetaCard key={m.id} meta={m} onEdit={openEdit} onDelete={handleDelete} onAportar={setAportando} />
          ))}
        </div>
      )}

      <MetaModal open={modalOpen} onClose={() => setModalOpen(false)} onSave={handleSave} initial={editing} />
      <AporteModal open={!!aportando} onClose={() => setAportando(null)} onSave={handleAporte} meta={aportando} />
    </div>
  );
}

/* --------------------------------- Cartão de Crédito ------------------------ */

function ImportarExtrato({ onConfirm, pendentes }) {
  const agora = new Date();
  const [mesFatura, setMesFatura] = useState(agora.getMonth() + 1);
  const [anoFatura, setAnoFatura] = useState(agora.getFullYear());
  const [rows, setRows] = useState(null); // array de arrays cru
  const [headerRow, setHeaderRow] = useState(1);
  const [colData, setColData] = useState(-1);
  const [colDesc, setColDesc] = useState(-1);
  const [colValor, setColValor] = useState(-1);
  const [formatoData, setFormatoData] = useState('BR'); // BR: dd/mm/aaaa | US: mm/dd/aaaa
  const [linhas, setLinhas] = useState([]); // preview editável
  const [erro, setErro] = useState(null);
  const [carregando, setCarregando] = useState(false);
  const fileRef = useRef(null);

  const mkFatura = monthKey(anoFatura, mesFatura);
  const headers = rows ? (rows[headerRow - 1] || []) : [];
  const dataRows = rows ? rows.slice(headerRow) : [];

  const handleFile = async (file) => {
    if (!file) return;
    setErro(null);
    setCarregando(true);
    try {
      const parsed = await lerArquivoExtrato(file);
      if (!parsed || parsed.length === 0) throw new Error('vazio');
      setRows(parsed);
      const h = parsed[0] || [];
      const cD = guessColIndex(h, ['data', 'date', 'dt ']);
      const cDesc = guessColIndex(h, ['descri', 'histor', 'estabelec', 'lançamento', 'lancamento']);
      const cV = guessColIndex(h, ['valor', 'amount', 'r$']);
      setColData(cD);
      setColDesc(cDesc);
      setColValor(cV);
      setHeaderRow(1);
    } catch (e) {
      setErro('Não consegui ler esse arquivo. Confirme se é um .xlsx, .xls ou .csv válido.');
      setRows(null);
    } finally {
      setCarregando(false);
    }
  };

  useEffect(() => {
    if (!rows || colData < 0 || colDesc < 0 || colValor < 0) { setLinhas([]); return; }
    const usados = new Set();
    const novas = dataRows
      .filter((r) => r && r.some((c) => String(c).trim() !== ''))
      .map((r) => {
        const data = parseDataLivre(r[colData], formatoData);
        const descricao = String(r[colDesc] || '').trim();
        const valor = parseValorLivre(r[colValor]);
        const valorAbs = Math.abs(valor);
        const match = (pendentes || []).find((p) => (
          !usados.has(p.id)
          && Math.abs(p.valor - valorAbs) < 0.01
          && (p.mesFatura || p.data.slice(0, 7)) === mkFatura
        ));
        if (match) usados.add(match.id);
        return {
          id: uid(),
          data,
          descricao,
          valorAbs,
          valorOriginal: valor,
          categoria: match ? match.categoria : sugerirCategoria(descricao),
          incluir: valor !== 0 && !!data && !!descricao,
          correspondeId: match ? match.id : null,
        };
      });
    setLinhas(novas);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [rows, headerRow, colData, colDesc, colValor, formatoData, pendentes, mkFatura]);

  const reset = () => {
    setRows(null); setLinhas([]); setErro(null);
    if (fileRef.current) fileRef.current.value = '';
  };

  const totalSelecionado = linhas.filter((l) => l.incluir).reduce((s, l) => s + l.valorAbs, 0);
  const qtdSelecionada = linhas.filter((l) => l.incluir).length;
  const qtdCorrespondentes = linhas.filter((l) => l.incluir && l.correspondeId).length;

  const confirmar = () => {
    const selecionadas = linhas.filter((l) => l.incluir && l.data && l.valorAbs > 0);
    if (selecionadas.length === 0) return;
    const novos = selecionadas
      .filter((l) => !l.correspondeId)
      .map((l) => ({ id: uid(), data: l.data, descricao: l.descricao, valor: l.valorAbs, categoria: l.categoria, confirmado: true, mesFatura: mkFatura }));
    const atualizacoes = selecionadas
      .filter((l) => l.correspondeId)
      .map((l) => ({ id: l.correspondeId, patch: { data: l.data, descricao: l.descricao, categoria: l.categoria, confirmado: true, mesFatura: mkFatura } }));
    onConfirm(novos, atualizacoes);
    reset();
  };

  return (
    <Card className="p-4">
      <SectionTitle
        icon="UploadCloud"
        title="Importar extrato do cartão"
        subtitle="Aceita planilha Excel (.xlsx/.xls) ou CSV"
      />

      <div className="bg-emerald-50/60 rounded-xl p-3 mb-3">
        <label className="text-[11px] font-medium text-slate-500">Essa fatura é de qual mês?</label>
        <p className="text-[11px] text-slate-400 mb-1.5">Todas as compras desse extrato entram na análise desse mês, mesmo as feitas em outro mês (comum quando a fatura fecha antes do fim do mês).</p>
        <MonthYearPicker mes={mesFatura} ano={anoFatura} onChange={(m, y) => { setMesFatura(m); setAnoFatura(y); }} />
      </div>

      {!rows && (
        <label className="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-emerald-200 rounded-2xl py-10 cursor-pointer hover:bg-emerald-50/40 transition text-center px-4">
          <Icon name="FileSpreadsheet" size={26} className="text-emerald-400" />
          <span className="text-sm text-slate-600 font-medium">
            {carregando ? 'Lendo arquivo…' : 'Toque para escolher o arquivo do extrato'}
          </span>
          <span className="text-xs text-slate-400">.xlsx, .xls ou .csv</span>
          <input
            ref={fileRef}
            type="file"
            accept=".xlsx,.xls,.csv"
            className="hidden"
            onChange={(e) => handleFile(e.target.files?.[0])}
          />
        </label>
      )}

      {erro && (
        <div className="flex items-start gap-2 bg-red-50 border border-red-100 text-red-600 text-xs rounded-xl px-3 py-2.5 mt-3">
          <Icon name="AlertTriangle" size={14} className="mt-0.5 shrink-0" /> {erro}
        </div>
      )}

      {rows && (
        <div className="mt-1">
          <div className="flex flex-wrap items-end gap-3 mb-4 bg-emerald-50/50 rounded-xl p-3">
            <div>
              <label className="text-[11px] font-medium text-slate-500">Linha do cabeçalho</label>
              <input
                type="number" min="1" max={rows.length}
                value={headerRow}
                onChange={(e) => setHeaderRow(Math.max(1, Number(e.target.value) || 1))}
                className="block w-20 mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm"
              />
            </div>
            <div>
              <label className="text-[11px] font-medium text-slate-500">Coluna da data</label>
              <select value={colData} onChange={(e) => setColData(Number(e.target.value))} className="block mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white max-w-[140px]">
                <option value={-1}>Selecione…</option>
                {headers.map((h, i) => <option key={i} value={i}>{h || `Coluna ${i + 1}`}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[11px] font-medium text-slate-500">Coluna da descrição</label>
              <select value={colDesc} onChange={(e) => setColDesc(Number(e.target.value))} className="block mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white max-w-[140px]">
                <option value={-1}>Selecione…</option>
                {headers.map((h, i) => <option key={i} value={i}>{h || `Coluna ${i + 1}`}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[11px] font-medium text-slate-500">Coluna do valor</label>
              <select value={colValor} onChange={(e) => setColValor(Number(e.target.value))} className="block mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white max-w-[140px]">
                <option value={-1}>Selecione…</option>
                {headers.map((h, i) => <option key={i} value={i}>{h || `Coluna ${i + 1}`}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[11px] font-medium text-slate-500">Formato da data</label>
              <select value={formatoData} onChange={(e) => setFormatoData(e.target.value)} className="block mt-1 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white">
                <option value="BR">dd/mm/aaaa (Brasil)</option>
                <option value="US">mm/dd/aaaa (EUA)</option>
              </select>
            </div>
            <button onClick={reset} className="text-xs text-slate-400 hover:text-red-500 ml-auto">Cancelar</button>
          </div>

          {colData < 0 || colDesc < 0 || colValor < 0 ? (
            <EmptyState text="Selecione as três colunas acima para pré-visualizar os lançamentos." />
          ) : linhas.length === 0 ? (
            <EmptyState text="Nenhuma linha válida encontrada com essas colunas." />
          ) : (
            <>
              <div className="flex items-start gap-2 bg-amber-50 border border-amber-100 text-amber-700 text-xs rounded-xl px-3 py-2.5 mb-3">
                <Icon name="Info" size={14} className="mt-0.5 shrink-0" />
                Confira e ajuste a categoria de cada linha antes de confirmar — a sugestão é automática e pode errar.
                {qtdCorrespondentes > 0 && <> {qtdCorrespondentes} linha{qtdCorrespondentes !== 1 ? 's' : ''} já bate{qtdCorrespondentes === 1 ? '' : 'm'} com o que você já tinha lançado.</>}
              </div>
              <div className="overflow-x-auto pf-scroll max-h-80 overflow-y-auto border border-slate-100 rounded-xl">
                <table className="w-full text-xs">
                  <thead className="sticky top-0 bg-white">
                    <tr className="text-left text-[10px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
                      <th className="px-3 py-2">Incluir</th>
                      <th className="px-2 py-2">Data</th>
                      <th className="px-2 py-2">Descrição</th>
                      <th className="px-2 py-2 text-right">Valor</th>
                      <th className="px-2 py-2">Categoria</th>
                    </tr>
                  </thead>
                  <tbody>
                    {linhas.map((l, i) => (
                      <tr key={l.id} className={`border-b border-slate-50 ${!l.incluir ? 'opacity-40' : ''} ${l.correspondeId ? 'bg-emerald-50/40' : ''}`}>
                        <td className="px-3 py-1.5">
                          <input
                            type="checkbox"
                            checked={l.incluir}
                            onChange={(e) => setLinhas((prev) => prev.map((x, xi) => (xi === i ? { ...x, incluir: e.target.checked } : x)))}
                            className="accent-emerald-600 w-4 h-4"
                          />
                        </td>
                        <td className="px-2 py-1.5 whitespace-nowrap text-slate-500">{l.data ? formatDateBR(l.data) : <span className="text-red-400">inválida</span>}</td>
                        <td className="px-2 py-1.5 text-slate-700 max-w-[180px]">
                          <div className="truncate">{l.descricao}</div>
                          {l.correspondeId && (
                            <div className="text-[10px] text-emerald-600 flex items-center gap-1 mt-0.5">
                              <Icon name="Check" size={10} /> já lançado — só confirmar
                            </div>
                          )}
                        </td>
                        <td className={`px-2 py-1.5 text-right font-medium whitespace-nowrap ${l.valorOriginal < 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                          {formatBRL(l.valorAbs)}{l.valorOriginal < 0 && ' (crédito)'}
                        </td>
                        <td className="px-2 py-1.5">
                          <select
                            value={l.categoria}
                            onChange={(e) => setLinhas((prev) => prev.map((x, xi) => (xi === i ? { ...x, categoria: e.target.value } : x)))}
                            className="border border-slate-200 rounded-lg px-1.5 py-1 text-xs bg-white max-w-[150px]"
                          >
                            {CATEGORIAS_PAGAR.map((c) => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="flex items-center justify-between mt-4">
                <span className="text-xs text-slate-500">{qtdSelecionada} lançamento{qtdSelecionada !== 1 ? 's' : ''} selecionado{qtdSelecionada !== 1 ? 's' : ''} · {formatBRL(totalSelecionado)}</span>
                <button
                  onClick={confirmar}
                  disabled={qtdSelecionada === 0}
                  className="bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white text-sm font-medium px-4 py-2.5 rounded-xl hover:bg-emerald-700 transition"
                >
                  Confirmar importação
                </button>
              </div>
            </>
          )}
        </div>
      )}
    </Card>
  );
}

    descricao: '', categoria: CATEGORIAS_PAGAR[0], valor: '', data: todayStr(),

  const [form, setForm] = useState(blank);

  useEffect(() => { if (open) setForm(blank); }, [open]);
  if (!open) return null;
  const valid = form.descricao.trim() && Number(form.valor) > 0;

  const submit = () => {
    if (!valid) return;
    onSave({
      descricao: form.descricao,
      categoria: form.categoria,
      data: form.data,
      valor: Number(form.valor),
      mesFatura: monthKey(form.mesFaturaAno, form.mesFaturaMes),

            />
          </div>

            <label className="text-xs font-medium text-slate-500">Categoria</label>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-slate-500">Valor (R$)</label>

                placeholder="0,00"
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />

              <label className="text-xs font-medium text-slate-500">Data da compra</label>

              />
            </div>
          </div>
