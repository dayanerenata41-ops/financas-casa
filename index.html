            <>
              <div className="flex items-start gap-2 bg-amber-50 border border-amber-100 text-amber-700 text-xs rounded-xl px-3 py-2.5 mb-3">
                <Icon name="Info" size={14} className="mt-0.5 shrink-0" />
                Confira e ajuste a categoria de cada linha antes de confirmar — compras que já apareceram antes usam a categoria do histórico; as demais têm sugestão automática e podem errar.
                {qtdCorrespondentes > 0 && <> {qtdCorrespondentes} linha{qtdCorrespondentes !== 1 ? 's' : ''} já bate{qtdCorrespondentes === 1 ? '' : 'm'} com o que você já tinha lançado.</>}
              </div>
              <div className="overflow-x-auto pf-scroll max-h-80 overflow-y-auto border border-slate-100 rounded-xl">
                <table className="w-full text-xs">
                  <thead className="sticky top-0 bg-white">
                    <tr className="text-left text-[10px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
                      <th className="px-3 py-2">Incluir</th>
                      <th className="px-2 py-2">Data</th>
                      <th className="px-2 py-2">Descrição</th>
                      <th className="px-2 py-2 text-right">Valor</th>
                      <th className="px-2 py-2">Categoria</th>
                    </tr>
                  </thead>
                  <tbody>
                    {linhas.map((l, i) => (
                      <tr key={l.id} className={`border-b border-slate-50 ${!l.incluir ? 'opacity-40' : ''} ${l.correspondeId ? 'bg-emerald-50/40' : ''}`}>
                        <td className="px-3 py-1.5">
                          <input
                            type="checkbox"
                            checked={l.incluir}
                            onChange={(e) => setLinhas((prev) => prev.map((x, xi) => (xi === i ? { ...x, incluir: e.target.checked } : x)))}
                            className="accent-emerald-600 w-4 h-4"
                          />
                        </td>
                        <td className="px-2 py-1.5 whitespace-nowrap text-slate-500">{l.data ? formatDateBR(l.data) : <span className="text-red-400">inválida</span>}</td>
                        <td className="px-2 py-1.5 text-slate-700 max-w-[180px]">
                          <div className="truncate">{l.descricao}</div>
                          {l.correspondeId && (
                            <div className="text-[10px] text-emerald-600 flex items-center gap-1 mt-0.5">
                              <Icon name="Check" size={10} /> já lançado — só confirmar
                            </div>
                          )}
                          {l.pelaHistoria && (
                            <div className="text-[10px] text-sky-600 flex items-center gap-1 mt-0.5">
                              <Icon name="RefreshCw" size={10} /> categoria pelo histórico
                            </div>
                          )}
                        </td>
                        <td className={`px-2 py-1.5 text-right font-medium whitespace-nowrap ${l.valorOriginal < 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                          {formatBRL(l.valorAbs)}{l.valorOriginal < 0 && ' (crédito)'}
                        </td>
                        <td className="px-2 py-1.5">
                          <select
                            value={l.categoria}
                            onChange={(e) => setLinhas((prev) => prev.map((x, xi) => (xi === i ? { ...x, categoria: e.target.value } : x)))}
                            className="border border-slate-200 rounded-lg px-1.5 py-1 text-xs bg-white max-w-[150px]"
                          >
                            {CATEGORIAS_PAGAR.map((c) => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <label className="flex items-start gap-2 text-xs text-slate-600 mt-3 bg-slate-50 rounded-xl px-3 py-2.5 cursor-pointer">
                <input
                  type="checkbox"
                  checked={replicarContasPagar}
                  onChange={(e) => setReplicarContasPagar(e.target.checked)}
                  className="accent-emerald-600 w-4 h-4 mt-0.5"
                />
                <span>
                  Também lançar essas despesas em <b>Contas a Pagar</b>, separadas por categoria (um lançamento por categoria, somando os valores dessa fatura).
                </span>
              </label>

              <div className="flex items-center justify-between mt-3">
                <span className="text-xs text-slate-500">{qtdSelecionada} lançamento{qtdSelecionada !== 1 ? 's' : ''} selecionado{qtdSelecionada !== 1 ? 's' : ''} · {formatBRL(totalSelecionado)}</span>
                <button
                  onClick={confirmar}
                  disabled={qtdSelecionada === 0}
                  className="bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white text-sm font-medium px-4 py-2.5 rounded-xl hover:bg-emerald-700 transition"
                >
                  Confirmar importação
                </button>
              </div>
            </>
          )}
        </div>
      )}
    </Card>
  );
}

function LancamentoCartaoModal({ open, onClose, onSave, historico }) {
  const agora = new Date();
  const blank = {
    descricao: '', categoria: CATEGORIAS_PAGAR[0], valor: '', data: todayStr(),
    mesFaturaMes: agora.getMonth() + 1, mesFaturaAno: agora.getFullYear(),
  };
  const [form, setForm] = useState(blank);
  const [categoriaManual, setCategoriaManual] = useState(false);

  useEffect(() => { if (open) { setForm(blank); setCategoriaManual(false); } }, [open]);
  const doHistorico = (historico || {})[normalizarDescricao(form.descricao)];
  if (!open) return null;
  const valid = form.descricao.trim() && Number(form.valor) > 0;

  const submit = () => {
    if (!valid) return;
    onSave({
      descricao: form.descricao,
      categoria: form.categoria,
      data: form.data,
      valor: Number(form.valor),
      mesFatura: monthKey(form.mesFaturaAno, form.mesFaturaMes),
    });
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-md p-5 sm:p-6 max-h-[90vh] overflow-y-auto pf-scroll">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold text-slate-800">Lançar compra do cartão</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>
        <p className="text-xs text-slate-400 mb-3">
          Registre a compra agora, categorizada. Quando o extrato chegar, o sistema tenta casar pelo valor e mês, e você só confirma.
        </p>
        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium text-slate-500">Descrição</label>
            <input
              value={form.descricao}
              onChange={(e) => {
                const descricao = e.target.value;
                const cat = (historico || {})[normalizarDescricao(descricao)];
                setForm({ ...form, descricao, ...(cat && !categoriaManual ? { categoria: cat } : {}) });
              }}
              placeholder="Ex: Supermercado, Uber..."
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500">
              Categoria
              {doHistorico && !categoriaManual && <span className="ml-1.5 text-[10px] font-normal text-sky-600">· preenchida pelo histórico</span>}
            </label>
            <select
              value={form.categoria}
              onChange={(e) => { setCategoriaManual(true); setForm({ ...form, categoria: e.target.value }); }}
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            >
              {CATEGORIAS_PAGAR.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-slate-500">Valor (R$)</label>
              <input
                type="number" min="0" step="0.01"
                value={form.valor}
                onChange={(e) => setForm({ ...form, valor: e.target.value })}
                placeholder="0,00"
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
            <div>
              <label className="text-xs font-medium text-slate-500">Data</label>
              <input
                type="date"
                value={form.data}
                onChange={(e) => setForm({ ...form, data: e.target.value })}
                className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
              />
            </div>
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500">Entra na fatura de qual mês?</label>
            <div className="mt-1">
              <MonthYearPicker
                mes={form.mesFaturaMes}
                ano={form.mesFaturaAno}
                onChange={(m, y) => setForm({ ...form, mesFaturaMes: m, mesFaturaAno: y })}
              />
            </div>
          </div>
        </div>
        <button
          onClick={submit}
          disabled={!valid}
          className="w-full mt-5 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"
        >
          Salvar
        </button>
      </div>
    </div>
  );
}

function CartaoTab({ transacoes, orcamentos, historico, onAprender, onImport, onAddManual, onReplicar, onEditCategoria, onDelete, onClearMes }) {
  const [modalManualOpen, setModalManualOpen] = useState(false);
  const now = new Date();
  const [mes, setMes] = usePersistentState('cartao:mes', now.getMonth() + 1);
  const [ano, setAno] = usePersistentState('cartao:ano', now.getFullYear());
  const [categoriasSel, setCategoriasSel] = usePersistentState('cartao:cats', []);
  const [busca, setBusca] = usePersistentState('cartao:busca', '');
  const [statusFiltro, setStatusFiltro] = usePersistentState('cartao:status', 'todos'); // todos | confirmado | aguardando
  const [ordem, setOrdem] = usePersistentState('cartao:ordem', 'data'); // data | valorDesc | valorAsc | descricao
  const mk = monthKey(ano, mes);

  const doMes = useMemo(() => [...transacoes.filter((t) => (t.mesFatura || t.data.slice(0, 7)) === mk)].sort((a, b) => a.data.localeCompare(b.data)), [transacoes, mk]);
  const totalMes = doMes.reduce((s, t) => s + t.valor, 0);

  const filtrados = useMemo(() => {
    let lista = doMes;
    if (categoriasSel.length > 0) lista = lista.filter((t) => categoriasSel.includes(t.categoria));
    if (statusFiltro === 'confirmado') lista = lista.filter((t) => t.confirmado !== false);
    if (statusFiltro === 'aguardando') lista = lista.filter((t) => t.confirmado === false);
    if (busca.trim()) {
      const termo = busca.trim().toLowerCase();
      lista = lista.filter((t) => (t.descricao || '').toLowerCase().includes(termo));
    }
    const ord = {
      data: (a, b) => a.data.localeCompare(b.data),
      valorDesc: (a, b) => b.valor - a.valor,
      valorAsc: (a, b) => a.valor - b.valor,
      descricao: (a, b) => (a.descricao || '').localeCompare(b.descricao || '', 'pt-BR'),
    }[ordem] || ((a, b) => a.data.localeCompare(b.data));
    return [...lista].sort(ord);
  }, [doMes, categoriasSel, statusFiltro, busca, ordem]);
  const totalFiltrado = filtrados.reduce((s, t) => s + t.valor, 0);
  const temFiltro = categoriasSel.length > 0 || statusFiltro !== 'todos' || busca.trim() !== '';

  const porCategoriaMes = useMemo(() => {
    const map = {};
    doMes.forEach((t) => { map[t.categoria] = (map[t.categoria] || 0) + t.valor; });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [doMes]);

  // últimos 6 meses para comparativo
  const ultimosMeses = useMemo(() => {
    const arr = [];
    for (let i = 5; i >= 0; i -= 1) {
      const d = new Date(ano, mes - 1 - i, 1);
      arr.push({ mk: monthKey(d.getFullYear(), d.getMonth() + 1), label: `${MESES[d.getMonth()].slice(0, 3)}/${String(d.getFullYear()).slice(2)}` });
    }
    return arr;
  }, [ano, mes]);

  const topCategorias = useMemo(() => {
    const totals = {};
    transacoes.forEach((t) => { totals[t.categoria] = (totals[t.categoria] || 0) + t.valor; });
    return Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([c]) => c);
  }, [transacoes]);

  const dadosComparativo = useMemo(() => ultimosMeses.map(({ mk: k, label }) => {
    const row = { mes: label };
    topCategorias.forEach((c) => {
      row[c] = transacoes.filter((t) => (t.mesFatura || t.data.slice(0, 7)) === k && t.categoria === c).reduce((s, t) => s + t.valor, 0);
    });
    return row;
  }), [ultimosMeses, topCategorias, transacoes]);

  const CORES = ['#059669', '#34d399', '#a7f3d0', '#fbbf24', '#f87171'];

  const orcadoRealizado = useMemo(() => {
    const map = {};
    doMes.forEach((t) => { map[t.categoria] = (map[t.categoria] || 0) + t.valor; });
    return CATEGORIAS_PAGAR
      .map((c) => ({ categoria: c, realizado: map[c] || 0, orcado: orcamentos?.[c]?.[mk] ?? 0 }))
      .filter((l) => l.realizado > 0 || l.orcado > 0)
      .sort((a, b) => Math.max(b.orcado, b.realizado) - Math.max(a.orcado, a.realizado));
  }, [doMes, orcamentos, mk]);

  const limparMes = () => {
    const msg = `Isso vai apagar os ${doMes.length} lançamentos de cartão da fatura de ${MESES[mes - 1]} ${ano} (${formatBRL(totalMes)}). Os outros meses e os lançamentos de Contas a Pagar não são afetados. Continuar?`;
    if (window.confirm && window.confirm(msg)) onClearMes(mk);
  };

  return (
    <div className="pb-24 space-y-4">
      <Card className="p-4">
        <SectionTitle icon="Pencil" title="Lançar compra do cartão" subtitle="Categorize agora, confirme quando o extrato chegar" right={null} />
        <button
          onClick={() => setModalManualOpen(true)}
          className="flex items-center justify-center gap-1.5 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-2.5 rounded-xl transition"
        >
          <Icon name="Plus" size={15} /> Lançar compra agora
        </button>
      </Card>

      <ImportarExtrato
        onConfirm={onImport}
        pendentes={transacoes.filter((t) => t.confirmado === false)}
        onReplicar={onReplicar}
        historico={historico}
        onAprender={onAprender}
      />

      <div className="flex flex-wrap items-center justify-between gap-2">
        <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
        <div className="text-sm text-slate-500">Total no mês: <b className="text-red-500 pf-num">{formatBRL(totalMes)}</b></div>
      </div>

      {porCategoriaMes.length > 0 && (
        <div className="flex gap-2 overflow-x-auto pf-scroll pb-1 -mx-4 px-4">
          {porCategoriaMes.map(([c, v]) => {
            const ativo = categoriasSel.includes(c);
            return (
              <button
                key={c}
                onClick={() => setCategoriasSel(ativo ? categoriasSel.filter((x) => x !== c) : [...categoriasSel, c])}
                className={`shrink-0 text-left rounded-xl px-3 py-2 border transition ${ativo ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white border-slate-200 hover:border-emerald-300'}`}
              >
                <div className={`text-[10px] ${ativo ? 'text-emerald-50' : 'text-slate-500'}`}>{c}</div>
                <div className={`text-sm font-semibold pf-num ${ativo ? 'text-white' : 'text-slate-700'}`}>{formatBRL(v)}</div>
              </button>
            );
          })}
        </div>
      )}

      <Card className="overflow-hidden">
        <div className="p-4 pb-0 flex items-center justify-between gap-2">
          <div>
            <h3 className="text-sm font-semibold text-slate-700">Lançamentos da fatura</h3>
            {temFiltro && <p className="text-[11px] text-slate-400 pf-num">{filtrados.length} de {doMes.length} lançamentos · {formatBRL(totalFiltrado)}</p>}
          </div>
          {doMes.length > 0 && (
            <button
              onClick={limparMes}
              className="flex items-center gap-1.5 text-xs font-medium text-red-500 hover:bg-red-50 px-2.5 py-1.5 rounded-lg transition shrink-0"
            >
              <Icon name="Trash2" size={13} /> Limpar mês
            </button>
          )}
        </div>

        <div className="px-4 pt-3 flex flex-wrap items-center gap-2">
          <CategoryMultiSelect categorias={CATEGORIAS_PAGAR} selected={categoriasSel} onChange={setCategoriasSel} />
          <div className="flex bg-slate-100 rounded-xl p-1 text-xs font-medium">
            {[{ v: 'todos', l: 'Todos' }, { v: 'confirmado', l: 'Confirmados' }, { v: 'aguardando', l: 'Aguardando extrato' }].map((op) => (
              <button
                key={op.v}
                onClick={() => setStatusFiltro(op.v)}
                className={`px-2.5 py-1.5 rounded-lg transition whitespace-nowrap ${statusFiltro === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500'}`}
              >
                {op.l}
              </button>
            ))}
          </div>
          <select value={ordem} onChange={(e) => setOrdem(e.target.value)} className="text-xs bg-white border border-slate-200 rounded-xl px-2.5 py-2 text-slate-600">
            <option value="data">Ordenar por data</option>
            <option value="valorDesc">Maior valor primeiro</option>
            <option value="valorAsc">Menor valor primeiro</option>
            <option value="descricao">Descrição (A → Z)</option>
          </select>
          <div className="relative flex-1 min-w-[160px]">
            <Icon name="Filter" size={13} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300" />
            <input
              value={busca}
              onChange={(e) => setBusca(e.target.value)}
              placeholder="Buscar por descrição..."
              className="w-full text-sm bg-white border border-slate-200 rounded-xl pl-8 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
          {temFiltro && (
            <button onClick={() => { setCategoriasSel([]); setStatusFiltro('todos'); setBusca(''); }} className="text-xs font-medium text-emerald-700 hover:underline">
              Limpar filtros
            </button>
          )}
        </div>

        {doMes.length === 0 ? (
          <EmptyState text="Nenhum lançamento do cartão importado neste mês." />
        ) : filtrados.length === 0 ? (
          <EmptyState text="Nenhum lançamento com esses filtros." />
        ) : (
          <div className="overflow-x-auto pf-scroll mt-3">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-[11px] uppercase tracking-wide text-slate-400 border-t border-b border-slate-100">
                  <th className="px-4 py-2 font-medium">Data</th>
                  <th className="px-2 py-2 font-medium">Descrição</th>
                  <th className="px-2 py-2 font-medium">Categoria</th>
                  <th className="px-2 py-2 font-medium text-right">Valor</th>
                  <th className="px-2 py-2 font-medium text-right">Ações</th>
                </tr>
              </thead>

function patrimonioDoAtivo(ativo, movimentacoes) {
  return movimentacoes
    .filter((m) => m.ativoId === ativo.id)
    .reduce((s, m) => {
      if (m.tipo === 'resgate') return s - m.valor;
      return s + m.valor;
    }, ativo.aporteInicial || 0);
}

const CORES_TIPO_ATIVO = {
  'Renda Fixa': '#059669', 'Ações': '#0ea5e9', 'Fundos Imobiliários': '#f59e0b', 'Fundos': '#8b5cf6',
  Criptomoedas: '#f43f5e', 'Poupança': '#14b8a6', Outro: '#64748b',
};
const formatPct = (v, casas = 2) => `${((Number(v) || 0) * 100).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas })}%`;

// Rentabilidade pelo método de Dietz modificado: rendimento ÷ capital médio aplicado no período.
function rentabilidadeDoAtivo(ativo, movimentacoes) {
  const hoje = todayStr();
  const minhas = movimentacoes.filter((m) => m.ativoId === ativo.id);
  const datas = [ativo.dataInicio, ...minhas.map((m) => m.data)].filter(Boolean).sort();
  const inicio = datas[0] || hoje;
  const dia = 86400000;
  const dias = Math.max((new Date(hoje) - new Date(inicio)) / dia, 1);
  let base = ativo.aporteInicial || 0;
  let ganho = 0;
  minhas.forEach((m) => {
    if (m.tipo === 'rendimento') { ganho += m.valor; return; }
    const peso = Math.min(Math.max((new Date(hoje) - new Date(m.data)) / dia, 0) / dias, 1);
    base += peso * (m.tipo === 'aporte' ? m.valor : -m.valor);
  });
  const meses = Math.max(dias / 30.4375, 1);
  const total = base > 0 ? ganho / base : 0;
  const mensal = total > -1 ? Math.pow(1 + total, 1 / meses) - 1 : 0;
  return { ganho, total, mensal, meses, inicio, base };
}

// Atualiza o valor de todos os ativos de uma vez (como o "Atualizar valor" de cada um).
function AtualizarTodosModal({ open, onClose, onSave, ativos, movimentacoes }) {
  const [valores, setValores] = useState({});
  const [tipos, setTipos] = useState({});
  const [data, setData] = useState(todayStr());
  useEffect(() => { if (open) { setValores({}); setTipos({}); setData(todayStr()); } }, [open]);
  if (!open) return null;

  const linhas = ativos.map((a) => {
    const calc = patrimonioDoAtivo(a, movimentacoes);
    const v = valores[a.id];
    const dif = v === undefined || v === '' ? 0 : Number(v) - calc;
    const tipo = dif < 0 ? 'resgate' : (tipos[a.id] || 'rendimento');
    return { a, calc, v, dif, tipo };
  });
  const comMudanca = linhas.filter((l) => Math.abs(l.dif) >= 0.005);

  const salvar = () => {
    if (comMudanca.length === 0) return;
    onSave(comMudanca.map((l) => ({ id: uid(), ativoId: l.a.id, tipo: l.tipo, valor: Math.round(Math.abs(l.dif) * 100) / 100, data })));
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-lg p-5 sm:p-6 max-h-[92vh] overflow-y-auto pf-scroll">
        <div className="flex items-center justify-between mb-1">
          <h3 className="text-base font-semibold text-slate-800">Atualizar saldos da carteira</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>
        <p className="text-xs text-slate-400 mb-3">Digite o valor de hoje de cada ativo (extrato/corretora). A diferença vira rendimento, aporte ou resgate. Deixe em branco o que não mudou.</p>
        <div className="flex items-center gap-2 mb-3">
          <label className="text-xs font-medium text-slate-500">Data</label>
          <input type="date" value={data} onChange={(e) => setData(e.target.value)} className="border border-slate-200 rounded-lg px-2 py-1.5 text-xs" />
        </div>
        <div className="space-y-2">
          {linhas.map(({ a, calc, v, dif, tipo }) => (
            <div key={a.id} className="rounded-xl border border-slate-100 p-3">
              <div className="flex items-center justify-between gap-2">
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-700 truncate">{a.nome}</div>
                  <div className="text-[10px] text-slate-400 pf-num">hoje no app: {formatBRL(calc)}</div>
                </div>
                <div className="relative shrink-0">
                  <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-[11px] text-slate-400">R$</span>
                  <input
                    type="number" step="0.01" value={v ?? ''} placeholder={calc.toFixed(2)}
                    onChange={(e) => setValores({ ...valores, [a.id]: e.target.value })}
                    className="w-36 text-sm text-right border border-slate-200 rounded-lg pl-8 pr-2 py-1.5 pf-num focus:outline-none focus:ring-2 focus:ring-emerald-200"
                  />
                </div>
              </div>
              {Math.abs(dif) >= 0.005 && (
                <div className="flex items-center justify-between gap-2 mt-2">
                  <span className={`text-xs font-medium pf-num ${dif > 0 ? 'text-emerald-600' : 'text-red-500'}`}>{dif > 0 ? '+' : ''}{formatBRL(dif)}</span>
                  {dif > 0 ? (
                    <div className="flex bg-emerald-50 rounded-lg p-0.5 text-[11px] font-medium">
                      {['rendimento', 'aporte'].map((op) => (
                        <button key={op} onClick={() => setTipos({ ...tipos, [a.id]: op })} className={`px-2 py-1 rounded-md ${tipo === op ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-600/70'}`}>
                          {TIPOS_MOV.find((t) => t.v === op)?.l}
                        </button>
                      ))}
                    </div>
                  ) : <span className="text-[11px] text-slate-500">vira resgate</span>}
                </div>
              )}
            </div>
          ))}
        </div>
        <button
          onClick={salvar}
          disabled={comMudanca.length === 0}
          className="w-full mt-5 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"
        >
          Salvar {comMudanca.length > 0 ? `${comMudanca.length} ${comMudanca.length > 1 ? 'atualizações' : 'atualização'}` : ''}
        </button>
      </div>
    </div>
  );
}

function RecebimentoModal({ open, onClose, onSave, emprestimo }) {
  const [valor, setValor] = useState('');

  useEffect(() => { if (open) setValor(''); }, [open]);

  if (!open || !emprestimo) return null;
  const recebidoAtual = emprestimo.valorRecebido || 0;
  const falta = Math.max(emprestimo.valor - recebidoAtual, 0);
  const numero = Number(valor);
  const valido = numero > 0;

  const submit = () => {
    if (!valido) return;
    onSave(emprestimo, numero);
  };

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4">
      <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-sm p-5 sm:p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold text-slate-800">Registrar recebimento</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400">
            <Icon name="X" size={18} />
          </button>
        </div>
        <p className="text-xs text-slate-500 mb-3">
          {emprestimo.pessoa} deve {formatBRL(emprestimo.valor)}
          {recebidoAtual > 0 && <> · já recebido {formatBRL(recebidoAtual)} · falta {formatBRL(falta)}</>}
        </p>
        <label className="text-xs font-medium text-slate-500">Valor recebido agora (R$)</label>
        <input
          type="number" min="0" step="0.01" autoFocus
          value={valor}
          onChange={(e) => setValor(e.target.value)}
          placeholder="0,00"
          className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
        />
        {numero > falta && falta > 0 && (
          <p className="text-[11px] text-amber-600 mt-1.5">
            Esse valor é maior que o restante — vou registrar só {formatBRL(falta)} (o total da dívida).
          </p>
        )}
        <button
          onClick={submit}
          disabled={!valido}
          className="w-full mt-4 bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition"
        >
          Confirmar
        </button>
      </div>
    </div>
  );
}

function statusEmprestimo(e) {
  const recebido = e.valorRecebido || 0;
  if (recebido >= e.valor) return 'Recebido';
  if (recebido > 0) return 'Parcial';
  if (e.dataPrevista && e.dataPrevista < todayStr()) return 'Em atraso';
  return 'A receber';
}

function InvestimentosTab({
  ativos, movimentacoes, meta, emprestimos,
  onAddAtivo, onEditAtivo, onDeleteAtivo,
  onAddMov, onAddMovs, onDeleteMov,
  onSaveMeta,
  onAddEmprestimo, onEditEmprestimo, onDeleteEmprestimo, onReceberEmprestimo,
}) {
  const [ativoModalOpen, setAtivoModalOpen] = useState(false);
  const [editandoAtivo, setEditandoAtivo] = useState(null);
  const [movAtivo, setMovAtivo] = useState(null);
  const [atualizandoValorAtivo, setAtualizandoValorAtivo] = useState(null);
  const [atualizarTodosOpen, setAtualizarTodosOpen] = useState(false);
  const [emprestimoModalOpen, setEmprestimoModalOpen] = useState(false);
  const [editandoEmprestimo, setEditandoEmprestimo] = useState(null);
  const [recebendoEmprestimo, setRecebendoEmprestimo] = useState(null);
  const [periodoView, setPeriodoView] = usePersistentState('invest:periodo', 'mes'); // mes | total
  const now = new Date();
  const [mes, setMes] = usePersistentState('invest:mes', now.getMonth() + 1);
  const [ano, setAno] = usePersistentState('invest:ano', now.getFullYear());
  const mk = monthKey(ano, mes);

  // CDI: valor digitado (se houver) ou o último CDI anual publicado pelo Banco Central
  const [cdiBcb, setCdiBcb] = useState(null);
  useEffect(() => {
    let vivo = true;
    fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/1?formato=json')
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        if (vivo && j && j[0]) setCdiBcb({ anual: parseFloat(String(j[0].valor).replace(',', '.')) / 100, data: j[0].data });
      })
      .catch(() => {});
    return () => { vivo = false; };
  }, []);
  const cdiManual = meta?.cdiAnual != null && meta.cdiAnual !== '' ? Number(meta.cdiAnual) / 100 : null;
  const cdiAnual = cdiManual ?? cdiBcb?.anual ?? 0;
  const cdiMensal = cdiAnual > 0 ? Math.pow(1 + cdiAnual, 1 / 12) - 1 : 0;
  const [cdiForm, setCdiForm] = useState(meta?.cdiAnual ?? '');
  useEffect(() => { setCdiForm(meta?.cdiAnual ?? ''); }, [meta]);

  const patrimonioTotal = useMemo(
    () => ativos.reduce((s, a) => s + patrimonioDoAtivo(a, movimentacoes), 0),
    [ativos, movimentacoes],
  );

  const resumoCarteira = useMemo(() => {
    let base = 0; let somaPonderada = 0; let ganho = 0; let aportado = 0;
    ativos.forEach((a) => {
      const r = rentabilidadeDoAtivo(a, movimentacoes);
      if (r.base > 0) { base += r.base; somaPonderada += r.base * r.mensal; }
      ganho += r.ganho;
      const minhas = movimentacoes.filter((m) => m.ativoId === a.id);
      aportado += (a.aporteInicial || 0)
        + minhas.filter((m) => m.tipo === 'aporte').reduce((s, m) => s + m.valor, 0)
        - minhas.filter((m) => m.tipo === 'resgate').reduce((s, m) => s + m.valor, 0);
    });
    const mensal = base > 0 ? somaPonderada / base : 0;
    return { mensal, anual: Math.pow(1 + mensal, 12) - 1, ganho, aportado };
  }, [ativos, movimentacoes]);

  const porTipo = useMemo(() => {
    const map = {};
    ativos.forEach((a) => { map[a.tipo] = (map[a.tipo] || 0) + patrimonioDoAtivo(a, movimentacoes); });
    return Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  }, [ativos, movimentacoes]);

  const movDoPeriodo = useMemo(
    () => (periodoView === 'total' ? movimentacoes : movimentacoes.filter((m) => m.data.slice(0, 7) === mk)),
    [movimentacoes, periodoView, mk],
  );
  const totalAportes = movDoPeriodo.filter((m) => m.tipo === 'aporte').reduce((s, m) => s + m.valor, 0);
  const totalResgates = movDoPeriodo.filter((m) => m.tipo === 'resgate').reduce((s, m) => s + m.valor, 0);
  const totalRendimento = movDoPeriodo.filter((m) => m.tipo === 'rendimento').reduce((s, m) => s + m.valor, 0);

  const ultimosMeses = useMemo(() => {
    const arr = [];
    for (let i = 5; i >= 0; i -= 1) {
      const d = new Date(ano, mes - 1 - i, 1);
      arr.push({ mk: monthKey(d.getFullYear(), d.getMonth() + 1), label: `${MESES[d.getMonth()].slice(0, 3)}/${String(d.getFullYear()).slice(2)}` });
    }
    return arr;
  }, [ano, mes]);

  const dadosPeriodo = useMemo(() => ultimosMeses.map(({ mk: k, label }) => ({
    mes: label,
    Aportes: movimentacoes.filter((m) => m.data.slice(0, 7) === k && m.tipo === 'aporte').reduce((s, m) => s + m.valor, 0),
    Rendimento: movimentacoes.filter((m) => m.data.slice(0, 7) === k && m.tipo === 'rendimento').reduce((s, m) => s + m.valor, 0),
  })), [ultimosMeses, movimentacoes]);

  // Meta de investimento
  const [metaForm, setMetaForm] = useState({ valorAlvo: meta?.valorAlvo || '', prazo: meta?.prazo || '' });
  useEffect(() => { setMetaForm({ valorAlvo: meta?.valorAlvo || '', prazo: meta?.prazo || '' }); }, [meta]);
  const metaValorAlvo = Number(meta?.valorAlvo) || 0;
  const metaFalta = Math.max(metaValorAlvo - patrimonioTotal, 0);
  const metaPct = metaValorAlvo > 0 ? Math.min((patrimonioTotal / metaValorAlvo) * 100, 100) : 0;
  const metaMeses = meta?.prazo ? monthsUntil(meta.prazo) : null;
  const metaPorMes = metaMeses && metaMeses > 0 ? metaFalta / metaMeses : null;
  const salvarMeta = () => onSaveMeta({ ...(meta || {}), valorAlvo: Number(metaForm.valorAlvo) || 0, prazo: metaForm.prazo });

  // Empréstimos
  const emprestimosPendentes = emprestimos.filter((e) => statusEmprestimo(e) !== 'Recebido');
  const totalPendente = emprestimosPendentes.reduce((s, e) => s + (e.valor - (e.valorRecebido || 0)), 0);

  const pctDoCdi = cdiMensal > 0 ? resumoCarteira.mensal / cdiMensal : 0;
  const maxBarra = Math.max(resumoCarteira.mensal, cdiMensal, 0.0001);

  return (
    <div className="pb-24 space-y-4">
      {/* Painel da carteira */}
      <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-emerald-900 to-emerald-700 text-white p-5 sm:p-6 shadow-lg shadow-emerald-900/20">
        <div className="absolute -right-12 -top-12 w-48 h-48 rounded-full bg-white/5" />
        <div className="relative">
          <div className="flex items-start justify-between gap-3">
            <div>
              <div className="text-[11px] uppercase tracking-[0.18em] text-emerald-200/90 font-medium">Patrimônio investido</div>
              <div className="text-3xl font-bold tracking-tight mt-1 pf-num">{formatBRL(patrimonioTotal)}</div>
              <div className="text-xs text-emerald-100/80 mt-0.5">{ativos.length} ativo{ativos.length !== 1 ? 's' : ''} na carteira</div>
            </div>
            <button
              onClick={() => { setEditandoAtivo(null); setAtivoModalOpen(true); }}
              className="flex items-center gap-1.5 bg-white text-emerald-800 hover:bg-emerald-50 text-xs font-semibold px-3 py-2 rounded-xl transition shrink-0"
            >
              <Icon name="Plus" size={14} /> Novo ativo
            </button>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-5">
            <div className="rounded-2xl bg-white/10 px-3 py-2.5">
              <div className="text-[10px] text-emerald-100/80">Total aplicado</div>
              <div className="text-sm font-semibold pf-num">{formatBRL(resumoCarteira.aportado)}</div>
            </div>
            <div className="rounded-2xl bg-white/10 px-3 py-2.5">
              <div className="text-[10px] text-emerald-100/80">Rendimento acumulado</div>
              <div className="text-sm font-semibold text-emerald-300 pf-num">+{formatBRL(resumoCarteira.ganho)}</div>
            </div>
            <div className="rounded-2xl bg-white/10 px-3 py-2.5">
              <div className="text-[10px] text-emerald-100/80">Rentab. média</div>
              <div className="text-sm font-semibold pf-num">{formatPct(resumoCarteira.mensal)} a.m.</div>
            </div>
          </div>
          {porTipo.length > 0 && (
            <div className="mt-5">
              <div className="flex h-2.5 rounded-full overflow-hidden bg-white/10">
                {porTipo.map(([tipo, v]) => (
                  <div key={tipo} title={`${tipo}: ${formatBRL(v)}`} style={{ width: `${(v / patrimonioTotal) * 100}%`, background: CORES_TIPO_ATIVO[tipo] || '#94a3b8' }} />
                ))}
              </div>
              <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2">
                {porTipo.map(([tipo, v]) => (
                  <span key={tipo} className="flex items-center gap-1.5 text-[11px] text-emerald-50/90">
                    <span className="w-2 h-2 rounded-full" style={{ background: CORES_TIPO_ATIVO[tipo] || '#94a3b8' }} />
                    {tipo} · {formatPct(v / patrimonioTotal, 0)}
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Rentabilidade x CDI */}
      <Card className="p-4 sm:p-5">
        <SectionTitle icon="Activity" title="Rentabilidade da carteira x CDI" subtitle="Média ponderada pelo capital aplicado em cada ativo" />
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
          <div className="rounded-2xl bg-emerald-50 p-3">
            <div className="text-[11px] text-emerald-700">Carteira</div>
            <div className="text-xl font-bold text-emerald-700 pf-num">{formatPct(resumoCarteira.mensal)} <span className="text-xs font-medium">a.m.</span></div>
            <div className="text-[11px] text-emerald-700/70 pf-num">≈ {formatPct(resumoCarteira.anual)} ao ano</div>
          </div>
          <div className="rounded-2xl bg-slate-50 p-3">
            <div className="text-[11px] text-slate-500">CDI</div>
            <div className="text-xl font-bold text-slate-700 pf-num">{formatPct(cdiMensal)} <span className="text-xs font-medium">a.m.</span></div>
            <div className="text-[11px] text-slate-400 pf-num">{formatPct(cdiAnual)} ao ano</div>
          </div>
          <div className={`rounded-2xl p-3 ${pctDoCdi >= 1 ? 'bg-gradient-to-br from-emerald-600 to-teal-600 text-white' : 'bg-amber-50 text-amber-700'}`}>
            <div className={`text-[11px] ${pctDoCdi >= 1 ? 'text-emerald-50' : ''}`}>Sua carteira rende</div>
            <div className="text-xl font-bold pf-num">{cdiMensal > 0 ? `${Math.round(pctDoCdi * 100)}% do CDI` : '—'}</div>
            <div className={`text-[11px] ${pctDoCdi >= 1 ? 'text-emerald-50/90' : ''}`}>{pctDoCdi >= 1 ? 'acima do CDI' : 'abaixo do CDI'}</div>
          </div>
        </div>
        <div className="space-y-2.5">
          {[
            { label: 'Carteira', v: resumoCarteira.mensal, cor: '#059669' },
            { label: 'CDI', v: cdiMensal, cor: '#94a3b8' },
          ].map((b) => (
            <div key={b.label} className="flex items-center gap-3">
              <span className="w-16 text-xs text-slate-500">{b.label}</span>
              <div className="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full" style={{ width: `${(Math.max(b.v, 0) / maxBarra) * 100}%`, background: b.cor }} />
              </div>
              <span className="w-16 text-right text-xs font-semibold text-slate-700 pf-num">{formatPct(b.v)}</span>
            </div>
          ))}
        </div>
        <div className="flex flex-wrap items-center gap-2 mt-4 pt-3 border-t border-slate-100 text-[11px] text-slate-400">
          <span>CDI usado:</span>
          <div className="relative">
            <input
              type="number" step="0.01" value={cdiForm}
              placeholder={cdiBcb ? (cdiBcb.anual * 100).toFixed(2) : '0,00'}
              onChange={(e) => setCdiForm(e.target.value)}
              onBlur={() => { if (String(cdiForm) !== String(meta?.cdiAnual ?? '')) onSaveMeta({ ...(meta || {}), cdiAnual: cdiForm === '' ? null : Number(cdiForm) }); }}
              className="w-24 text-xs text-right border border-slate-200 rounded-lg pl-2 pr-7 py-1"
            />
            <span className="absolute right-2 top-1/2 -translate-y-1/2">%</span>
          </div>
          <span>a.a. · {cdiManual != null ? 'valor digitado (apague para usar o do Banco Central)' : cdiBcb ? `Banco Central, ${cdiBcb.data}` : 'buscando no Banco Central…'}</span>
        </div>
        <p className="text-[10px] text-slate-400 mt-2">
          Rentabilidade de cada ativo = rendimentos lançados ÷ capital médio aplicado desde a data de início, convertida em taxa mensal. Quanto mais em dia estiverem os rendimentos lançados, mais fiel fica a comparação.
        </p>
      </Card>

      <div className="flex items-center justify-between gap-2">
        <h3 className="text-sm font-semibold text-slate-700">Meus ativos</h3>
        {ativos.length > 0 && (
          <button
            onClick={() => setAtualizarTodosOpen(true)}
            className="flex items-center gap-1.5 text-xs font-medium text-emerald-700 bg-white border border-emerald-200 hover:bg-emerald-50 px-3 py-2 rounded-xl transition"
          >
            <Icon name="RefreshCw" size={13} /> Atualizar saldos de todos
          </button>
        )}
      </div>

      {ativos.length === 0 ? (
        <EmptyState text="Cadastre seu primeiro ativo para começar a acompanhar." />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {[...ativos].sort((a, b) => patrimonioDoAtivo(b, movimentacoes) - patrimonioDoAtivo(a, movimentacoes)).map((a) => (
            <AtivoCard
              key={a.id}
              ativo={a}
              movimentacoes={movimentacoes}
              patrimonioCarteira={patrimonioTotal}
              cdiMensal={cdiMensal}
              onEdit={(at) => { setEditandoAtivo(at); setAtivoModalOpen(true); }}
              onDelete={onDeleteAtivo}
              onAddMov={setMovAtivo}
              onDeleteMov={onDeleteMov}
              onAtualizarValor={setAtualizandoValorAtivo}
            />
          ))}
        </div>
      )}

      <Card className="p-4">
        <SectionTitle icon="TrendingUp" title="Aportes e rendimento" subtitle="Por período e no total" />
        <div className="flex items-center justify-between mb-3">
          {periodoView === 'mes' ? (
            <MonthYearPicker mes={mes} ano={ano} onChange={(m, y) => { setMes(m); setAno(y); }} />
          ) : <div />}
          <div className="flex bg-emerald-50 rounded-xl p-1 text-xs font-medium">
            {[{ v: 'mes', l: 'Mês' }, { v: 'total', l: 'Total geral' }].map((op) => (
              <button
                key={op.v}
                onClick={() => setPeriodoView(op.v)}
                className={`px-3 py-1.5 rounded-lg transition ${periodoView === op.v ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-600/70'}`}
              >
                {op.l}
              </button>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2 mb-4">
          <div className="bg-emerald-50/60 rounded-xl px-3 py-2">
            <div className="text-[11px] text-slate-500">Aportes</div>
            <div className="text-sm font-semibold text-emerald-700 pf-num">{formatBRL(totalAportes)}</div>
          </div>
          <div className="bg-red-50/60 rounded-xl px-3 py-2">
            <div className="text-[11px] text-slate-500">Resgates</div>
            <div className="text-sm font-semibold text-red-500 pf-num">{formatBRL(totalResgates)}</div>
          </div>
          <div className="bg-emerald-50/60 rounded-xl px-3 py-2">
            <div className="text-[11px] text-slate-500">Rendimento</div>
            <div className="text-sm font-semibold text-emerald-700 pf-num">{formatBRL(totalRendimento)}</div>
          </div>
        </div>
        <ColumnChart
          data={dadosPeriodo}
          seriesKeys={['Aportes', 'Rendimento']}
          seriesColors={{ Aportes: '#6ee7b7', Rendimento: '#059669' }}
          height={180}
        />
      </Card>

      <Card className="p-4">
        <SectionTitle icon="Target" title="Meta de investimento" subtitle="Quanto falta para o patrimônio alvo" />
        <div className="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label className="text-xs font-medium text-slate-500">Valor alvo (R$)</label>
            <input
              type="number" min="0" step="0.01"
              value={metaForm.valorAlvo}
              onChange={(e) => setMetaForm({ ...metaForm, valorAlvo: e.target.value })}
              onBlur={salvarMeta}
              placeholder="0,00"
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
          <div>
            <label className="text-xs font-medium text-slate-500">Prazo (opcional)</label>
            <input
              type="date"
              value={metaForm.prazo}
              onChange={(e) => setMetaForm({ ...metaForm, prazo: e.target.value })}
              onBlur={salvarMeta}
              className="w-full mt-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-200 focus:border-emerald-300"
            />
          </div>
        </div>
        {metaValorAlvo > 0 && (
          <>
            <div className="flex items-center justify-between text-xs mb-1">
              <span className="text-slate-500 pf-num">{formatBRL(patrimonioTotal)} de {formatBRL(metaValorAlvo)}</span>
              <span className="font-medium text-emerald-600">{metaPct.toFixed(0)}%</span>
            </div>
            <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden mb-2">
              <div className="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full transition-all" style={{ width: `${metaPct}%` }} />
            </div>
            {metaFalta > 0 ? (
              <div className="text-xs text-amber-600">
                Faltam {formatBRL(metaFalta)}
                {metaPorMes != null && <> · ~{formatBRL(metaPorMes)}/mês para chegar no prazo</>}
              </div>
            ) : (
              <div className="text-xs font-medium text-emerald-600">Meta atingida! 🎉</div>
            )}
          </>
        )}
      </Card>

      <Card className="overflow-hidden">
        <div className="p-4 flex items-center justify-between">
          <SectionTitle icon="Users" title="Valores pendentes a receber" subtitle={`${emprestimosPendentes.length} em aberto · ${formatBRL(totalPendente)}`} right={null} />
          <button
            onClick={() => { setEditandoEmprestimo(null); setEmprestimoModalOpen(true); }}
            className="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-2 rounded-xl transition shrink-0"
          >
            <Icon name="Plus" size={14} /> Novo
          </button>
        </div>
        {emprestimos.length === 0 ? (
          <EmptyState text="Nenhum valor emprestado registrado." />
        ) : (
          <div className="overflow-x-auto pf-scroll">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-[11px] uppercase tracking-wide text-slate-400 border-t border-b border-slate-100">
                  <th className="px-4 py-2 font-medium">Quem deve</th>
                  <th className="px-2 py-2 font-medium hidden sm:table-cell">Descrição</th>
                  <th className="px-2 py-2 font-medium text-right">Valor</th>
                  <th className="px-2 py-2 font-medium">Status</th>
                  <th className="px-2 py-2 font-medium text-right">Ações</th>
                </tr>
              </thead>
              <tbody>
                {[...emprestimos].sort((a, b) => (b.valor - (b.valorRecebido || 0)) - (a.valor - (a.valorRecebido || 0))).map((e) => {
                  const status = statusEmprestimo(e);
                  const recebido = e.valorRecebido || 0;
                  return (
                    <tr key={e.id} className="border-b border-slate-50 hover:bg-emerald-50/30 transition">
                      <td className="px-4 py-2.5 text-slate-700">{e.pessoa}</td>
                      <td className="px-2 py-2.5 hidden sm:table-cell text-slate-500 max-w-[160px] truncate">{e.descricao}</td>
                      <td className="px-2 py-2.5 text-right whitespace-nowrap">
                        <div className="font-medium text-emerald-600">{formatBRL(e.valor)}</div>
                        {status === 'Parcial' && (
                          <div className="text-[10px] text-blue-500">recebido {formatBRL(recebido)}</div>
                        )}
                      </td>
                      <td className="px-2 py-2.5"><Badge status={status} /></td>
                      <td className="px-2 py-2.5">
                        <div className="flex items-center justify-end gap-1">
                          {status !== 'Recebido' && (
                            <button onClick={() => setRecebendoEmprestimo(e)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                              <Icon name="PiggyBank" size={13} />
                            </button>
                          )}
                          <button onClick={() => { setEditandoEmprestimo(e); setEmprestimoModalOpen(true); }} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
                            <Icon name="Pencil" size={13} />
                          </button>
                          <button onClick={() => onDeleteEmprestimo(e)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50">
                            <Icon name="Trash2" size={13} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <AtivoModal
        open={ativoModalOpen}
        onClose={() => setAtivoModalOpen(false)}
        initial={editandoAtivo}
        onSave={(data) => {
          if (editandoAtivo) onEditAtivo({ ...editandoAtivo, ...data });
          else onAddAtivo({ ...data, id: uid() });
          setAtivoModalOpen(false);
        }}
      />
      <MovimentacaoModal
        open={!!movAtivo}
        ativo={movAtivo}
        onClose={() => setMovAtivo(null)}
        onSave={(data) => { onAddMov({ ...data, id: uid() }); setMovAtivo(null); }}
      />
      <AtualizarValorModal
        open={!!atualizandoValorAtivo}
        ativo={atualizandoValorAtivo}
        movimentacoes={movimentacoes}
        onClose={() => setAtualizandoValorAtivo(null)}
        onSave={(data) => { onAddMov({ ...data, id: uid() }); setAtualizandoValorAtivo(null); }}
      />
      <AtualizarTodosModal
        open={atualizarTodosOpen}
        ativos={ativos}
        movimentacoes={movimentacoes}
        onClose={() => setAtualizarTodosOpen(false)}
        onSave={(novas) => { onAddMovs(novas); setAtualizarTodosOpen(false); }}
      />
      <EmprestimoModal
        open={emprestimoModalOpen}
        initial={editandoEmprestimo}
        onClose={() => setEmprestimoModalOpen(false)}
        onSave={(data) => {
          if (editandoEmprestimo) onEditEmprestimo({ ...editandoEmprestimo, ...data });
          else onAddEmprestimo({ ...data, id: uid() });
          setEmprestimoModalOpen(false);
        }}
      />
      <RecebimentoModal
        open={!!recebendoEmprestimo}
        emprestimo={recebendoEmprestimo}
        onClose={() => setRecebendoEmprestimo(null)}
        onSave={(emprestimo, valor) => {
          onReceberEmprestimo(emprestimo, valor);
          setRecebendoEmprestimo(null);
        }}
      />
    </div>
  );
}

  banco: 'Santander', contrato: '0010406141', valorFinanciado: 220000, dataContrato: '2023-11-30',
  taxaAnual: 11.09, trMensal: 0.17, prazoRemanescente: 184, prazoBaseParcela: 34,
  mipTaxa: 0.00017, dfi: 15.14, tarifa: 25, extraPlano: 2600,
};

const FIN_MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const finNum = (v) => (v === '' || v == null || Number.isNaN(Number(v)) ? 0 : Number(v));
const finR2 = (v) => Math.round(v * 100) / 100;
const finMesAno = (iso) => { if (!iso) return '—'; const [a, m] = iso.split('-'); return `${FIN_MESES[Number(m) - 1]}/${a}`; };
const finDuracao = (meses) => {
  const a = Math.floor(meses / 12); const m = meses % 12;
  return [a ? `${a} ano${a > 1 ? 's' : ''}` : '', m ? `${m} ${m > 1 ? 'meses' : 'mês'}` : ''].filter(Boolean).join(' e ') || '0 mês';
};
const finValorParcela = (r) => finNum(r.amort) + finNum(r.juros) + finNum(r.mip) + finNum(r.dfi) + finNum(r.tar);
const finChaveData = (r) => r.pag || r.venc || '';

function finOrdenar(lista) {
  const ordemTipo = { outro: 0, parcela: 1, extra: 2 };
  return [...lista].sort((a, b) => finChaveData(a).localeCompare(finChaveData(b)) || (ordemTipo[a.t] - ordemTipo[b.t]));
}

// Recalcula o saldo devedor linha a linha. Quando o saldo do extrato foi informado, ele prevalece.
function finHistorico(lancamentos, cfg) {
  const tr = finNum(cfg.trMensal) / 100;
  let saldo = finNum(cfg.valorFinanciado);
  return finOrdenar(lancamentos).map((r) => {
    if (r.saldo !== undefined && r.saldo !== null && r.saldo !== '') saldo = finNum(r.saldo);
    else if (r.t === 'parcela') saldo = saldo * (1 + tr) - finNum(r.amort);
    else saldo = saldo - finNum(r.amort);
    return { ...r, saldoCalc: Math.max(saldo, 0) };
  });
}

// Projeção mês a mês. Sem amortização extra: SAC do banco (amortização = saldo / prazo restante).
// Com amortização extra: o banco mantém o valor da parcela e reduz o prazo (comportamento visto no extrato).
function finProjetar({ saldo, extra, cfg, parcelaRef, prazoRem, inicio }) {
  const i = Math.pow(1 + finNum(cfg.taxaAnual) / 100, 1 / 12) - 1;
  const tr = finNum(cfg.trMensal) / 100;
  const linhas = [];
  let s = saldo;
  let amortSac = prazoRem > 0 ? s / prazoRem : s;
  let [ano, mes] = inicio.venc.split('-').map(Number);
  const dia = inicio.venc.split('-')[2] || '10';
  let n = inicio.n;
  while (s > 0.005 && linhas.length < 600) {
    s *= 1 + tr;
    amortSac *= 1 + tr;
    const juros = s * i;
    const mip = s * finNum(cfg.mipTaxa);
    const dfi = finNum(cfg.dfi);
    const tar = finNum(cfg.tarifa);
    let amort = extra > 0 ? Math.max(amortSac, parcelaRef - juros - mip - dfi - tar) : amortSac;
    amort = Math.min(amort, s);
    s -= amort;
    const ex = Math.min(extra, s);
    s -= ex;
    linhas.push({
      n, venc: `${ano}-${pad2(mes)}-${dia}`, amort, juros, mip, dfi, tar,
      valor: amort + juros + mip + dfi + tar, extra: ex, saldo: Math.max(s, 0),
    });
    n += 1; mes += 1; if (mes > 12) { mes = 1; ano += 1; }
  }
  const soma = (k) => linhas.reduce((t, l) => t + l[k], 0);
  const juros = soma('juros');
  const principal = soma('amort') + soma('extra');
  const total = soma('valor') + soma('extra');
  return { linhas, meses: linhas.length, quitacao: linhas.length ? linhas[linhas.length - 1].venc : null, juros, principal, total, encargos: total - juros - principal };
}

function finCalcular(dados, extraSimulado) {
  const cfg = { ...FIN_CONFIG_PADRAO, ...(dados.config || {}) };
  const hist = finHistorico(dados.lancamentos || [], cfg);
  const parcelas = hist.filter((r) => r.t === 'parcela');
  const ultimaParcela = parcelas[parcelas.length - 1];
  const saldoAtual = hist.length ? hist[hist.length - 1].saldoCalc : finNum(cfg.valorFinanciado);
  const pagasDepoisBase = parcelas.filter((r) => finNum(r.n) > finNum(cfg.prazoBaseParcela)).length;
  const prazoRem = Math.max(finNum(cfg.prazoRemanescente) - pagasDepoisBase, 1);
  const parcelaRef = ultimaParcela ? finValorParcela(ultimaParcela) : 0;
  let inicio = { n: 1, venc: cfg.dataContrato };
  if (ultimaParcela) {
    let [a, m] = ultimaParcela.venc.split('-').map(Number);
    m += 1; if (m > 12) { m = 1; a += 1; }
    inicio = { n: finNum(ultimaParcela.n) + 1, venc: `${a}-${pad2(m)}-10` };
  }
  const base = { saldo: saldoAtual, cfg, parcelaRef, prazoRem, inicio };
  const banco = finProjetar({ ...base, extra: 0 });
  const plano = finProjetar({ ...base, extra: finNum(cfg.extraPlano) });
  const simulado = extraSimulado == null ? plano : finProjetar({ ...base, extra: finNum(extraSimulado) });

  const soma = (lista, f) => lista.reduce((t, r) => t + f(r), 0);
  const pago = {
    total: soma(hist, (r) => finNum(r.pago)),
    principal: soma(hist, (r) => finNum(r.amort)),
    juros: soma(hist, (r) => finNum(r.juros)),
    parcelas: soma(parcelas, (r) => finNum(r.pago)),
    extras: soma(hist.filter((r) => r.t === 'extra'), (r) => finNum(r.pago)),
    principalParcelas: soma(parcelas, (r) => finNum(r.amort)),
    principalExtras: soma(hist.filter((r) => r.t === 'extra'), (r) => finNum(r.amort)),
    qtdParcelas: parcelas.length,
    qtdExtras: hist.filter((r) => r.t === 'extra').length,
  };
  pago.encargos = pago.total - pago.principal - pago.juros;
  return { cfg, hist, saldoAtual, prazoRem, parcelaRef, inicio, banco, plano, simulado, pago, ultimaParcela };
}

function FinGraficoSaldo({ hist, series }) {
  const W = 640; const H = 200; const P = { l: 44, r: 10, t: 10, b: 24 };
  const pontosHist = hist.filter((r) => r.t !== 'outro').map((r) => ({ d: finChaveData(r), v: r.saldoCalc }));
  const todas = [...pontosHist, ...series.flatMap((s) => s.pontos)];
  if (todas.length < 2) return null;
  const tempo = (iso) => { const [a, m] = iso.split('-').map(Number); return a * 12 + m - 1; };
  const t0 = Math.min(...todas.map((p) => tempo(p.d)));
  const t1 = Math.max(...todas.map((p) => tempo(p.d)));
  const vMax = Math.max(...todas.map((p) => p.v));
  const x = (iso) => P.l + ((tempo(iso) - t0) / Math.max(t1 - t0, 1)) * (W - P.l - P.r);
  const y = (v) => P.t + (1 - v / vMax) * (H - P.t - P.b);
  const caminho = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const anos = [];
  for (let a = Math.ceil(t0 / 12); a * 12 <= t1; a += 1) anos.push(a);
  const passo = Math.ceil(anos.length / 8);
  const marcasV = [0, 0.25, 0.5, 0.75, 1].map((f) => f * vMax);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
      {marcasV.map((v, i) => (
        <g key={i}>
          <line x1={P.l} x2={W - P.r} y1={y(v)} y2={y(v)} stroke="#f1f5f9" />
          <text x={P.l - 6} y={y(v) + 3} textAnchor="end" fontSize="9" fill="#94a3b8">{v >= 1000 ? `${Math.round(v / 1000)} mil` : '0'}</text>
        </g>
      ))}
      {anos.filter((_, i) => i % passo === 0).map((a) => (
        <text key={a} x={x(`${a}-01`)} y={H - 6} textAnchor="middle" fontSize="9" fill="#94a3b8">{a}</text>
      ))}
      {series.map((s) => (
        <path key={s.label} d={caminho([pontosHist[pontosHist.length - 1], ...s.pontos].filter(Boolean))} fill="none" stroke={s.cor} strokeWidth="2" strokeDasharray={s.tracejado ? '5 4' : undefined} />
      ))}
      <path d={caminho(pontosHist)} fill="none" stroke="#047857" strokeWidth="2.5" />
    </svg>
  );
}

// Registro rápido do mês: valor da parcela + amortização extra. O detalhamento do extrato é opcional.
function FinRegistrarMesModal({ open, onClose, onSave, calc }) {
  const [f, setF] = useState({});
  const [detalhar, setDetalhar] = useState(false);
  const prox = calc.plano.linhas[0];

  useEffect(() => {
    if (!open) return;
    setDetalhar(false);
    setF({
      n: calc.inicio.n, venc: calc.inicio.venc, pag: todayStr(),
      valorParcela: prox ? finR2(prox.valor).toFixed(2) : '', extra: String(finNum(calc.cfg.extraPlano) || ''),
      dataExtra: '', amort: '', juros: '', mip: '', dfi: '', tar: '', mora: '', saldoParcela: '', saldoExtra: '', jurosExtra: '',
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open]);

  if (!open) return null;
  const set = (k) => (v) => setF((x) => ({ ...x, [k]: v }));
  const cfg = calc.cfg;

  const salvar = () => {
    const novos = [];
    const valorParcela = finNum(f.valorParcela);
    if (valorParcela > 0) {
      let det;
      if (detalhar) {
        det = { amort: finNum(f.amort), juros: finNum(f.juros), mip: finNum(f.mip), dfi: finNum(f.dfi), tar: finNum(f.tar), mora: finNum(f.mora) };
      } else {
        // Estimativa a partir da taxa do contrato, a partir do saldo atual corrigido pela TR.
        const i = Math.pow(1 + finNum(cfg.taxaAnual) / 100, 1 / 12) - 1;
        const s = calc.saldoAtual * (1 + finNum(cfg.trMensal) / 100);
        const juros = finR2(s * i); const mip = finR2(s * finNum(cfg.mipTaxa));
        const dfi = finNum(cfg.dfi); const tar = finNum(cfg.tarifa);
        det = { amort: finR2(valorParcela - juros - mip - dfi - tar), juros, mip, dfi, tar, mora: 0 };
      }
      novos.push({
        id: uid(), t: 'parcela', n: finNum(f.n), venc: f.venc, pag: f.pag, ...det, pago: valorParcela,
        ...(f.saldoParcela !== '' && detalhar ? { saldo: finNum(f.saldoParcela) } : {}),
        ...(detalhar ? {} : { obs: 'Detalhamento estimado pelo app' }),
      });
    }
    const extra = finNum(f.extra);
    if (extra > 0) {
      const jurosExtra = detalhar ? finNum(f.jurosExtra) : 0;
      novos.push({
        id: uid(), t: 'extra', venc: f.dataExtra || f.pag, pag: f.dataExtra || f.pag,
        amort: finR2(extra - jurosExtra), juros: jurosExtra, pago: extra,
        ...(f.saldoExtra !== '' && detalhar ? { saldo: finNum(f.saldoExtra) } : {}),
      });
    }
    if (novos.length) onSave(novos);
  };

  return (
    <FinModalShell
      titulo="Registrar pagamento do mês"
      onClose={onClose}
      rodape={(
        <button onClick={salvar} className="w-full mt-5 bg-emerald-600 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition">
          Salvar
        </button>
      )}
    >
      <div className="space-y-3">
        <div className="grid grid-cols-3 gap-3">
          <FinCampo label="Parcela nº" value={f.n} onChange={set('n')} />
          <FinCampo label="Vencimento" type="date" value={f.venc} onChange={set('venc')} />
          <FinCampo label="Data do pagamento" type="date" value={f.pag} onChange={set('pag')} />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <FinCampo label="Valor pago da parcela (R$)" value={f.valorParcela} onChange={set('valorParcela')} hint={prox ? `Previsto: ${formatBRL(prox.valor)}` : undefined} />
          <FinCampo label="Amortização extra (R$)" value={f.extra} onChange={set('extra')} hint="Deixe 0 se não amortizou" />
        </div>
        <label className="flex items-center gap-2 text-xs text-slate-600 pt-1">
          <input type="checkbox" checked={detalhar} onChange={(e) => setDetalhar(e.target.checked)} className="accent-emerald-600" />
          Detalhar conforme o extrato do banco (opcional)
        </label>
        {detalhar ? (
          <div className="bg-slate-50 rounded-xl p-3 space-y-3">
            <p className="text-[11px] font-semibold text-slate-600">Parcela</p>
            <div className="grid grid-cols-3 gap-2">
              <FinCampo label="Amortização" value={f.amort} onChange={set('amort')} />
              <FinCampo label="Juros" value={f.juros} onChange={set('juros')} />
              <FinCampo label="Seguro MIP" value={f.mip} onChange={set('mip')} />
              <FinCampo label="Seguro DFI" value={f.dfi} onChange={set('dfi')} />
              <FinCampo label="Tarifas" value={f.tar} onChange={set('tar')} />
              <FinCampo label="Juros de mora" value={f.mora} onChange={set('mora')} />
            </div>
            <FinCampo label="Saldo devedor após a parcela" value={f.saldoParcela} onChange={set('saldoParcela')} hint="Em branco = o app calcula" />
            <p className="text-[11px] font-semibold text-slate-600 pt-1">Amortização extra</p>
            <div className="grid grid-cols-3 gap-2">
              <FinCampo label="Data" type="date" value={f.dataExtra} onChange={set('dataExtra')} />
              <FinCampo label="Juros pró-rata" value={f.jurosExtra} onChange={set('jurosExtra')} />
              <FinCampo label="Saldo após" value={f.saldoExtra} onChange={set('saldoExtra')} />
            </div>
          </div>
        ) : (
          <p className="text-[11px] text-slate-400">Sem detalhar, o app estima juros, seguros e tarifa pela taxa do contrato e calcula o saldo. Dá para corrigir depois com os números do extrato (ícone de lápis na tabela).</p>
        )}
      </div>
    </FinModalShell>
  );
}

          {f.t === 'parcela' ? <FinCampo label="Parcela nº" value={f.n} onChange={set('n')} /> : <div />}
