          <FinCampo label="Pagamento" type="date" value={f.pag} onChange={set('pag')} />
        </div>
        <div className="grid grid-cols-3 gap-2">
          <FinCampo label="Amortização" value={f.amort} onChange={set('amort')} />
          <FinCampo label="Juros" value={f.juros} onChange={set('juros')} />
          <FinCampo label="Seguro MIP" value={f.mip} onChange={set('mip')} />
          <FinCampo label="Seguro DFI" value={f.dfi} onChange={set('dfi')} />
          <FinCampo label="Tarifas" value={f.tar} onChange={set('tar')} />
          <FinCampo label="Juros de mora" value={f.mora} onChange={set('mora')} />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <FinCampo label="Valor pago" value={f.pago} onChange={set('pago')} hint={`Em branco = soma (${formatBRL(somaComp)})`} />
          <FinCampo label="Saldo devedor após" value={f.saldo} onChange={set('saldo')} hint="Em branco = o app calcula" />
        </div>
        <FinCampo label="Observação" type="text" value={f.obs} onChange={set('obs')} />
      </div>
    </FinModalShell>
  );
}

function FinConfigModal({ open, onClose, onSave, cfg }) {
  const [f, setF] = useState({});
  useEffect(() => { if (open) setF({ ...cfg }); }, [open, cfg]);
  if (!open) return null;
  const set = (k) => (v) => setF((x) => ({ ...x, [k]: v }));
  const salvar = () => {
    const num = ['valorFinanciado', 'taxaAnual', 'trMensal', 'prazoRemanescente', 'prazoBaseParcela', 'dfi', 'tarifa', 'extraPlano'];
    const out = { ...f };
    num.forEach((k) => { out[k] = finNum(f[k]); });
    onSave(out);
  };
  return (
    <FinModalShell
      titulo="Dados do contrato e premissas"
      onClose={onClose}
      rodape={<button onClick={salvar} className="w-full mt-5 bg-emerald-600 text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-700 transition">Salvar</button>}
    >
      <div className="grid grid-cols-2 gap-3">
        <FinCampo label="Banco" type="text" value={f.banco} onChange={set('banco')} />
        <FinCampo label="Contrato" type="text" value={f.contrato} onChange={set('contrato')} />
        <FinCampo label="Valor financiado (R$)" value={f.valorFinanciado} onChange={set('valorFinanciado')} />
        <FinCampo label="Taxa efetiva (% ao ano)" value={f.taxaAnual} onChange={set('taxaAnual')} />
        <FinCampo label="TR estimada (% ao mês)" value={f.trMensal} onChange={set('trMensal')} hint="O banco projeta com 0" />
        <FinCampo label="Amortização extra do plano (R$/mês)" value={f.extraPlano} onChange={set('extraPlano')} />
        <FinCampo label="Prazo remanescente (meses)" value={f.prazoRemanescente} onChange={set('prazoRemanescente')} hint="Conforme último extrato" />
        <FinCampo label="...contado após a parcela nº" value={f.prazoBaseParcela} onChange={set('prazoBaseParcela')} />
        <FinCampo label="Seguro DFI mensal (R$)" value={f.dfi} onChange={set('dfi')} />
        <FinCampo label="Tarifa mensal (R$)" value={f.tarifa} onChange={set('tarifa')} />
      </div>
    </FinModalShell>
  );
}

function FinanciamentoTab({ dados, onSave }) {
  const [extraSim, setExtraSim] = useState(null);
  const [filtro, setFiltro] = usePersistentState('fin:filtro', 'pagos');
  const [cenarioTabela, setCenarioTabela] = usePersistentState('fin:cenario', 'plano');
  const [mesOpen, setMesOpen] = useState(false);
  const [linhaOpen, setLinhaOpen] = useState(false);
  const [editando, setEditando] = useState(null);
  const [cfgOpen, setCfgOpen] = useState(false);

  const calc = useMemo(() => finCalcular(dados, extraSim), [dados, extraSim]);
  const { cfg, hist, pago, plano, banco, simulado, saldoAtual } = calc;
  const extraSimValor = extraSim == null ? finNum(cfg.extraPlano) : extraSim;

  const salvarLancamentos = (lista) => onSave({ ...dados, lancamentos: lista });
  const addVarios = (novos) => { salvarLancamentos([...(dados.lancamentos || []), ...novos]); setMesOpen(false); };
  const salvarLinha = (r) => {
    const lista = dados.lancamentos || [];
    salvarLancamentos(lista.some((x) => x.id === r.id) ? lista.map((x) => (x.id === r.id ? r : x)) : [...lista, r]);
    setLinhaOpen(false); setEditando(null);
  };
  const excluirLinha = (r) => {
    const nome = r.t === 'parcela' ? `a parcela ${r.n}` : r.t === 'extra' ? `a amortização extra de ${formatDateBR(r.pag)}` : 'este lançamento';
    if (window.confirm && !window.confirm(`Excluir ${nome}? (${formatBRL(r.pago)})`)) return;
    salvarLancamentos((dados.lancamentos || []).filter((x) => x.id !== r.id));
  };
  const salvarConfig = (novo) => { onSave({ ...dados, config: novo }); setCfgOpen(false); };
  const usarComoPlano = () => { onSave({ ...dados, config: { ...cfg, extraPlano: extraSimValor } }); setExtraSim(null); };

  const custoTotal = pago.total + plano.total;
  const principalTotal = pago.principal + saldoAtual;
  const pctQuitado = principalTotal > 0 ? (pago.principal / principalTotal) * 100 : 0;
  const mesesAntes = banco.meses - plano.meses;
  const economiaJuros = banco.juros - plano.juros;

  const projecao = cenarioTabela === 'banco' ? banco : plano;
  const linhasTabela = useMemo(() => {
    const h = hist.map((r) => ({ ...r, origem: 'hist' }));
    const p = [];
    projecao.linhas.forEach((l) => {
      p.push({ origem: 'proj', t: 'parcela', n: l.n, venc: l.venc, amort: l.amort, juros: l.juros, mip: l.mip, dfi: l.dfi, tar: l.tar, valor: l.valor, saldoCalc: l.saldo + l.extra });
      if (l.extra > 0) p.push({ origem: 'proj', t: 'extra', venc: l.venc, amort: l.extra, juros: 0, valor: l.extra, saldoCalc: l.saldo });
    });
    if (filtro === 'pagos') return h;
    if (filtro === 'parcelas') return h.filter((r) => r.t === 'parcela');
    if (filtro === 'extras') return h.filter((r) => r.t === 'extra');
    if (filtro === 'apagar') return p;
    return [...h, ...p];
  }, [hist, projecao, filtro]);

  const tot = linhasTabela.reduce((t, r) => {
    t.amort += finNum(r.amort); t.juros += finNum(r.juros); t.mip += finNum(r.mip); t.dfi += finNum(r.dfi); t.tar += finNum(r.tar); t.mora += finNum(r.mora);
    t.pago += r.origem === 'hist' ? finNum(r.pago) : 0; t.apagar += r.origem === 'proj' ? finNum(r.valor) : 0;
    return t;
  }, { amort: 0, juros: 0, mip: 0, dfi: 0, tar: 0, mora: 0, pago: 0, apagar: 0 });

  const cores = { pagoPrincipal: '#059669', pagoJuros: '#6ee7b7', restPrincipal: '#64748b', restJuros: '#cbd5e1', extras: '#0d9488' };
  const pontos = (proj) => proj.linhas.map((l) => ({ d: l.venc, v: l.saldo }));
  const vazio = hist.length === 0;

  return (
    <div className="pb-24 space-y-4">
      {/* Painel principal */}
      <Card className="p-4 sm:p-5">
        <div className="flex items-start justify-between gap-3 mb-4">
          <div>
            <div className="flex items-center gap-2 text-slate-800">
              <Icon name="Landmark" size={18} className="text-emerald-600" />
              <h2 className="text-base font-semibold">Financiamento do imóvel</h2>
            </div>
            <p className="text-[11px] text-slate-400 mt-0.5">{cfg.banco} · contrato {cfg.contrato} · SAC + TR · {String(cfg.taxaAnual).replace('.', ',')}% a.a.</p>
          </div>
          <button onClick={() => setCfgOpen(true)} title="Dados do contrato e premissas" className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50">
            <Icon name="Pencil" size={14} />
          </button>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
          <div className="rounded-xl bg-slate-50 p-3">
            <div className="text-[11px] text-slate-500">Dívida total estimada</div>
            <div className="text-lg font-semibold text-slate-800">{formatBRL(custoTotal)}</div>
            <div className="text-[10px] text-slate-400">já pago + restante do plano</div>
          </div>
          <div className="rounded-xl bg-emerald-50 p-3">
            <div className="text-[11px] text-emerald-700">Total já pago</div>
            <div className="text-lg font-semibold text-emerald-700">{formatBRL(pago.total)}</div>
            <div className="text-[10px] text-emerald-600/70">{pago.qtdParcelas} parcelas · {pago.qtdExtras} amortizações</div>
          </div>
          <div className="rounded-xl bg-slate-50 p-3">
            <div className="text-[11px] text-slate-500">Restante a pagar</div>
            <div className="text-lg font-semibold text-slate-800">{formatBRL(plano.total)}</div>
            <div className="text-[10px] text-slate-400">saldo devedor hoje {formatBRL(saldoAtual)}</div>
          </div>
          <div className="rounded-xl bg-emerald-600 p-3 text-white">
            <div className="text-[11px] text-emerald-100">Quitação prevista</div>
            <div className="text-lg font-semibold">{finMesAno(plano.quitacao)}</div>
            <div className="text-[10px] text-emerald-100">em {finDuracao(plano.meses)}{mesesAntes > 0 ? ` · ${finDuracao(mesesAntes)} antes do banco` : ''}</div>
          </div>
        </div>

        <div className="mb-1 flex items-center justify-between text-xs">
          <span className="font-medium text-slate-600">Para onde vai o dinheiro (contrato inteiro)</span>
          <span className="text-slate-400">{custoTotal > 0 ? ((pago.total / custoTotal) * 100).toFixed(0) : 0}% pago</span>
        </div>
        <FinBarra segmentos={[
          { label: 'Pago – principal', valor: pago.principal, cor: cores.pagoPrincipal },
          { label: 'Pago – juros e encargos', valor: pago.juros + pago.encargos, cor: cores.pagoJuros },
          { label: 'A pagar – principal', valor: plano.principal, cor: cores.restPrincipal },
          { label: 'A pagar – juros e encargos', valor: plano.juros + plano.encargos, cor: cores.restJuros },
        ]} />
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3 mb-5">
          <FinLegenda cor={cores.pagoPrincipal} label="Pago · principal" valor={pago.principal} />
          <FinLegenda cor={cores.pagoJuros} label="Pago · juros e encargos" valor={pago.juros + pago.encargos} sub={`juros ${formatBRL(pago.juros)}`} />
          <FinLegenda cor={cores.restPrincipal} label="A pagar · principal" valor={plano.principal} />
          <FinLegenda cor={cores.restJuros} label="A pagar · juros e encargos" valor={plano.juros + plano.encargos} sub={`juros ${formatBRL(plano.juros)}`} />
        </div>

        <div className="mb-1 flex items-center justify-between text-xs">
          <span className="font-medium text-slate-600">Dívida (principal) quitada</span>
          <span className="font-semibold text-emerald-700">{pctQuitado.toFixed(1)}%</span>
        </div>
        <FinBarra altura="h-3" segmentos={[
          { label: 'Amortizado nas parcelas', valor: pago.principalParcelas, cor: cores.pagoPrincipal },
          { label: 'Amortizado com extras', valor: pago.principalExtras, cor: cores.extras },
          { label: 'Saldo devedor', valor: saldoAtual, cor: '#e2e8f0' },
        ]} />
        <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[11px] text-slate-500">
          <span><span className="inline-block w-2 h-2 rounded-sm mr-1" style={{ background: cores.pagoPrincipal }} />Parcelas {formatBRL(pago.principalParcelas)}</span>
          <span><span className="inline-block w-2 h-2 rounded-sm mr-1" style={{ background: cores.extras }} />Amortizações extras {formatBRL(pago.principalExtras)}</span>
          <span><span className="inline-block w-2 h-2 rounded-sm mr-1 bg-slate-200" />Saldo devedor {formatBRL(saldoAtual)}</span>
        </div>
        {economiaJuros > 1 && (
          <div className="mt-4 text-xs bg-emerald-50 text-emerald-800 rounded-xl px-3 py-2">
            Com {formatBRL(cfg.extraPlano)}/mês de amortização extra, vocês deixam de pagar <b>{formatBRL(economiaJuros)}</b> de juros em relação ao plano do banco (quitação em {finMesAno(banco.quitacao)}).
          </div>
        )}
        <button onClick={() => setMesOpen(true)} className="flex items-center justify-center gap-1.5 w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-2.5 rounded-xl transition">
          <Icon name="Plus" size={15} /> Registrar pagamento do mês
        </button>
      </Card>

      {/* Simulador */}
      <Card className="p-4 sm:p-5">
        <SectionTitle icon="TrendingUp" title="Simulador de amortização" subtitle="Quanto amortizar por mês e quando a dívida acaba" />
        <div className="flex flex-col sm:flex-row sm:items-end gap-3 mb-4">
          <div className="flex-1">
            <label className="text-[11px] font-medium text-slate-500">Amortização extra por mês: <b className="text-emerald-700">{formatBRL(extraSimValor)}</b></label>
            <input type="range" min="0" max="6000" step="100" value={extraSimValor} onChange={(e) => setExtraSim(Number(e.target.value))} className="w-full accent-emerald-600" />
          </div>
          <div className="w-full sm:w-36">
            <input type="number" step="50" value={extraSimValor} onChange={(e) => setExtraSim(finNum(e.target.value))} className={finInput} />
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          {[
            { titulo: 'Sem amortização extra', p: banco, cor: 'border-slate-200', destaque: false },
            { titulo: `Meu plano (${formatBRL(cfg.extraPlano)}/mês)`, p: plano, cor: 'border-emerald-200', destaque: false },
            { titulo: `Simulação (${formatBRL(extraSimValor)}/mês)`, p: simulado, cor: 'border-emerald-500', destaque: true },
          ].map((c) => (
            <div key={c.titulo} className={`rounded-xl border ${c.cor} p-3 ${c.destaque ? 'bg-emerald-50/60' : ''}`}>
              <div className="text-[11px] text-slate-500 mb-1">{c.titulo}</div>
              <div className="text-base font-semibold text-slate-800">Quita em {finMesAno(c.p.quitacao)}</div>
              <div className="text-[11px] text-slate-400 mb-2">{finDuracao(c.p.meses)}</div>
              <div className="flex justify-between text-xs"><span className="text-slate-500">Juros a pagar</span><span className="font-medium text-slate-700">{formatBRL(c.p.juros)}</span></div>
              <div className="flex justify-between text-xs"><span className="text-slate-500">Total a desembolsar</span><span className="font-medium text-slate-700">{formatBRL(c.p.total)}</span></div>
              {c.p !== banco && banco.juros - c.p.juros > 1 && (
                <div className="flex justify-between text-xs"><span className="text-slate-500">Economia de juros</span><span className="font-semibold text-emerald-700">{formatBRL(banco.juros - c.p.juros)}</span></div>
              )}
            </div>
          ))}
        </div>
        {extraSimValor !== finNum(cfg.extraPlano) && (
          <button onClick={usarComoPlano} className="mt-3 text-xs font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-3 py-2 rounded-lg">
            Usar {formatBRL(extraSimValor)}/mês como meu plano
          </button>
        )}
        <div className="mt-4">
          <div className="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-500 mb-1">
            <span><span className="inline-block w-3 h-0.5 align-middle mr-1 bg-emerald-700" />Saldo real</span>
            <span><span className="inline-block w-3 h-0.5 align-middle mr-1 bg-slate-400" />Sem extra</span>
            <span><span className="inline-block w-3 h-0.5 align-middle mr-1 bg-emerald-400" />Simulação</span>
          </div>
          <FinGraficoSaldo hist={hist} series={[
            { label: 'banco', pontos: pontos(banco), cor: '#94a3b8', tracejado: true },
            { label: 'sim', pontos: pontos(simulado), cor: '#34d399' },
          ]} />
        </div>
        <p className="text-[10px] text-slate-400 mt-2">
          Premissas: taxa de {String(cfg.taxaAnual).replace('.', ',')}% a.a., TR de {String(cfg.trMensal).replace('.', ',')}% a.m. e amortização extra no dia da parcela. Com amortização extra, considera que o banco mantém o valor da parcela e reduz o prazo (como aparece no extrato). Sem extra, segue o SAC com {calc.prazoRem} meses restantes. É uma estimativa: o valor exato depende da TR de cada mês.
        </p>
      </Card>

      {/* Tabela */}
      <Card className="p-4 sm:p-5">
        <SectionTitle
          icon="FileSpreadsheet"
          title="Evolução do financiamento"
          subtitle="Lançamentos pagos e projeção das parcelas a vencer"
          right={(
            <button onClick={() => { setEditando(null); setLinhaOpen(true); }} className="flex items-center gap-1 text-xs font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg whitespace-nowrap">
              <Icon name="Plus" size={13} /> Lançamento
            </button>
          )}
        />
        <div className="flex flex-wrap gap-1.5 mb-3">
          {[['pagos', 'Pagos'], ['parcelas', 'Parcelas normais'], ['extras', 'Amortizações extras'], ['apagar', 'A pagar'], ['tudo', 'Tudo']].map(([id, label]) => (
            <button key={id} onClick={() => setFiltro(id)} className={`text-xs px-3 py-1.5 rounded-full border transition ${filtro === id ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-200 text-slate-500 hover:border-emerald-300'}`}>{label}</button>
          ))}
          {(filtro === 'apagar' || filtro === 'tudo') && (
            <select value={cenarioTabela} onChange={(e) => setCenarioTabela(e.target.value)} className="text-xs border border-slate-200 rounded-full px-2 py-1.5 text-slate-600">
              <option value="plano">Projeção com meu plano</option>
              <option value="banco">Projeção sem extra (banco)</option>
            </select>
          )}
        </div>
        {vazio && filtro !== 'apagar' ? <EmptyState text="Nenhum pagamento lançado ainda." /> : (
          <div className="overflow-auto pf-scroll max-h-[70vh] -mx-4 sm:mx-0">
            <table className="min-w-[1050px] w-full text-[11px]">
              <thead className="sticky top-0 bg-emerald-700 text-white z-[1]">
                <tr>
                  {['Nº', 'Vencimento', 'Pagamento', 'Histórico', 'Amortização', 'Juros', 'MIP', 'DFI', 'Tarifas', 'Mora', 'Valor pago', 'A pagar', 'Saldo devedor', ''].map((h, i) => (
                    <th key={i} className={`px-2 py-2 font-medium ${i >= 4 && i <= 12 ? 'text-right' : 'text-left'}`}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {linhasTabela.map((r, idx) => {
                  const proj = r.origem === 'proj';
                  const cls = proj ? 'text-slate-400' : r.t === 'extra' ? 'bg-teal-50/70' : r.t === 'outro' ? 'text-slate-400' : '';
                  const rotulo = r.t === 'parcela' ? (proj ? 'Parcela (projeção)' : 'Parcela') : r.t === 'extra' ? (proj ? 'Amort. extra (plano)' : 'Amortização extra') : 'Outro';
                  const v = (x) => (finNum(x) ? finNum(x).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '–');
                  return (
                    <tr key={r.id || `p${idx}`} className={`border-b border-slate-100 ${cls}`}>
                      <td className="px-2 py-1.5">{r.t === 'parcela' ? r.n : ''}</td>
                      <td className="px-2 py-1.5 whitespace-nowrap">{formatDateBR(r.venc)}</td>
                      <td className="px-2 py-1.5 whitespace-nowrap">{proj ? '' : formatDateBR(r.pag)}</td>
                      <td className="px-2 py-1.5 whitespace-nowrap" title={r.obs || ''}>{rotulo}{r.obs ? ' *' : ''}</td>
                      <td className="px-2 py-1.5 text-right">{v(r.amort)}</td>
                      <td className="px-2 py-1.5 text-right">{v(r.juros)}</td>
                      <td className="px-2 py-1.5 text-right">{v(r.mip)}</td>
                      <td className="px-2 py-1.5 text-right">{v(r.dfi)}</td>
                      <td className="px-2 py-1.5 text-right">{v(r.tar)}</td>
                      <td className="px-2 py-1.5 text-right">{v(r.mora)}</td>
                      <td className="px-2 py-1.5 text-right font-medium text-slate-700">{proj ? '' : v(r.pago)}</td>
                      <td className="px-2 py-1.5 text-right">{proj ? v(r.valor) : ''}</td>
                      <td className="px-2 py-1.5 text-right">{v(r.saldoCalc)}</td>
                      <td className="px-1 py-1 whitespace-nowrap">
                        {!proj && (
                          <div className="flex gap-0.5 justify-end">
                            <button onClick={() => { setEditando(r); setLinhaOpen(true); }} title="Editar" className="w-6 h-6 flex items-center justify-center rounded text-slate-400 hover:text-emerald-600 hover:bg-emerald-50"><Icon name="Pencil" size={12} /></button>
                            <button onClick={() => excluirLinha(r)} title="Excluir" className="w-6 h-6 flex items-center justify-center rounded text-slate-400 hover:text-red-500 hover:bg-red-50"><Icon name="Trash2" size={12} /></button>
                          </div>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot className="sticky bottom-0 bg-slate-100 font-semibold text-slate-700">
                <tr>
                  <td className="px-2 py-2" colSpan={4}>Total ({linhasTabela.length} linhas)</td>
                  {['amort', 'juros', 'mip', 'dfi', 'tar', 'mora', 'pago', 'apagar'].map((k) => (
                    <td key={k} className="px-2 py-2 text-right">{tot[k] ? tot[k].toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '–'}</td>
                  ))}
                  <td colSpan={2} />
                </tr>
              </tfoot>
            </table>
          </div>
        )}
        <p className="text-[10px] text-slate-400 mt-2">* passe o mouse no histórico para ver a observação. Histórico importado do extrato Santander de 13/10/2026; a linha repetida da parcela 25 (11/12/2025) não foi incluída.</p>
      </Card>

      <FinRegistrarMesModal open={mesOpen} onClose={() => setMesOpen(false)} onSave={addVarios} calc={calc} />
      <FinLinhaModal open={linhaOpen} onClose={() => { setLinhaOpen(false); setEditando(null); }} onSave={salvarLinha} inicial={editando} />
      <FinConfigModal open={cfgOpen} onClose={() => setCfgOpen(false)} onSave={salvarConfig} cfg={cfg} />
    </div>
  );
}


/* --------------------------------- App raiz -------------------------------- */

const TABS = [
  { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
  { id: 'receber', label: 'A Receber', icon: 'ArrowDownCircle' },
  { id: 'pagar', label: 'A Pagar', icon: 'ArrowUpCircle' },
  { id: 'cartao', label: 'Cartão', icon: 'CreditCard' },
  { id: 'investimentos', label: 'Investimentos', icon: 'TrendingUp' },
  { id: 'financiamento', label: 'Financiamento', icon: 'Landmark' },
  { id: 'metas', label: 'Sonhos & Metas', icon: 'Sparkles' },
];

function App() {
  const [tab, setTab] = useState('dashboard');
  const [loading, setLoading] = useState(true);
  const [lancamentos, setLancamentos] = useState([]);
  const [orcamentos, setOrcamentos] = useState({});
  const [config, setConfig] = useState({ saldoInicial: {} });
  const [metas, setMetas] = useState([]);
  const [cartaoTransacoes, setCartaoTransacoes] = useState([]);
  const [investAtivos, setInvestAtivos] = useState([]);
  const [investMovimentacoes, setInvestMovimentacoes] = useState([]);
  const [investMeta, setInvestMeta] = useState({ valorAlvo: 0, prazo: '' });
  const [investEmprestimos, setInvestEmprestimos] = useState([]);
  const [cartaoHistorico, setCartaoHistorico] = useState({});
  const [financiamento, setFinanciamento] = useState({ lancamentos: FIN_SEED_LANCAMENTOS, config: {} });
  const [errorMsg, setErrorMsg] = useState(null);
  const [savingState, setSavingState] = useState('idle'); // idle | saving | saved | error
  const [ultimaSincronia, setUltimaSincronia] = useState(null);
  const [pendentes, setPendentes] = useState([]); // alterações que falharam ao salvar, aguardando nova tentativa

  const carregarDados = useCallback(async (silencioso = false) => {
    if (!silencioso) setLoading(true);
    try {
      const dados = await sbGetAll();
      if (dados.lancamentos) setLancamentos(dados.lancamentos);
      if (dados.orcamentos) setOrcamentos(dados.orcamentos);
      if (dados.config) setConfig(dados.config);
      if (dados.metas) setMetas(dados.metas);
      if (dados.cartaoTransacoes) setCartaoTransacoes(dados.cartaoTransacoes);
      if (dados.investAtivos) setInvestAtivos(dados.investAtivos);
      if (dados.investMovimentacoes) setInvestMovimentacoes(dados.investMovimentacoes);
      if (dados.investMeta) setInvestMeta(dados.investMeta);
      if (dados.investEmprestimos) setInvestEmprestimos(dados.investEmprestimos);
      if (dados.cartaoHistorico) setCartaoHistorico(dados.cartaoHistorico);
      if (dados.financiamento) setFinanciamento(dados.financiamento);
      setUltimaSincronia(new Date());
      if (silencioso) setErrorMsg(null);
    } catch (e) {
      // eslint-disable-next-line no-console
      console.error('Falha ao carregar dados do Supabase:', e);
      if (!silencioso) {
        const motivo = e?.message ? ` (${e.message})` : '';
        setErrorMsg(`Não foi possível carregar os dados salvos${motivo}. Verifique sua conexão e tente recarregar a página.`);
      }
    } finally {
      if (!silencioso) setLoading(false);
    }
  }, []);

  useEffect(() => {
    carregarDados(false);
  }, [carregarDados]);

  // Atualização automática: busca dados novos a cada 20s, para refletir o que a outra
  // pessoa salvou em outro dispositivo, sem precisar recarregar a página manualmente.
  useEffect(() => {
    const intervalo = setInterval(() => {
      if (document.visibilityState === 'visible' && pendentes.length === 0) carregarDados(true);
    }, 20000);
    const aoFocar = () => { if (pendentes.length === 0) carregarDados(true); };
    window.addEventListener('focus', aoFocar);
    document.addEventListener('visibilitychange', aoFocar);
    return () => {
      clearInterval(intervalo);
      window.removeEventListener('focus', aoFocar);
      document.removeEventListener('visibilitychange', aoFocar);
    };
  }, [carregarDados, pendentes.length]);

  const flashSaved = () => {
    setSavingState('saved');
    setTimeout(() => setSavingState((s) => (s === 'saved' ? 'idle' : s)), 1500);
  };

  const persist = useCallback(async (key, value, setter, tentativa = 0) => {
    setter(value);
    setSavingState('saving');
    try {
      await sbSet(key, value);
      flashSaved();
      setPendentes((prev) => prev.filter((p) => p.key !== key));
    } catch (e) {
      // eslint-disable-next-line no-console
      console.error(`Falha ao salvar "${key}" (tentativa ${tentativa + 1}/3):`, e);
      if (tentativa < 2) {
        await new Promise((r) => setTimeout(r, 1000 * (tentativa + 1)));
        return persist(key, value, setter, tentativa + 1);
      }
      setSavingState('error');
      const motivo = e?.message ? ` (${e.message})` : '';
      setErrorMsg(`Não consegui salvar sua última alteração${motivo}. Ela continua aparecendo aqui, mas só neste dispositivo até você tentar salvar de novo — toque em "Tentar novamente" abaixo.`);
      setPendentes((prev) => [...prev.filter((p) => p.key !== key), { key, value, setter }]);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (pendentes.length === 0) {
      setErrorMsg((m) => (m && m.startsWith('Não consegui salvar') ? null : m));
      if (savingState === 'error') setSavingState('idle');
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendentes.length]);

  const retentarPendentes = () => {
    const lista = [...pendentes];
    lista.forEach((p) => persist(p.key, p.value, p.setter));
  };

  const addLancamentos = (novos) => persist('lancamentos', [...lancamentos, ...novos], setLancamentos);
  const editLancamento = (editado) => persist('lancamentos', lancamentos.map((t) => (t.id === editado.id ? editado : t)), setLancamentos);
  const toggleQuitado = (t) => persist('lancamentos', lancamentos.map((x) => (x.id === t.id ? { ...x, quitado: !x.quitado } : x)), setLancamentos);
  const duplicar = (t) => persist('lancamentos', [...lancamentos, { ...t, id: uid(), data: todayStr(), quitado: false }], setLancamentos);
  const excluir = (t) => {
    if (window.confirm && !window.confirm(`Excluir o lançamento "${t.descricao}"?`)) return;
    persist('lancamentos', lancamentos.filter((x) => x.id !== t.id), setLancamentos);
  };

  const setOrcamento = (categoria, mk, valor) => {
    const next = { ...orcamentos, [categoria]: { ...(orcamentos[categoria] || {}), [mk]: valor } };
    persist('orcamentos', next, setOrcamentos);
  };

  const setSaldoInicial = (mk, valor) => {
    const next = { ...config, saldoInicial: { ...(config.saldoInicial || {}), [mk]: valor } };
    persist('config', next, setConfig);
  };

  const addMeta = (meta) => persist('metas', [...metas, meta], setMetas);
  const editMeta = (editada) => persist('metas', metas.map((m) => (m.id === editada.id ? editada : m)), setMetas);
  const deleteMeta = (meta) => persist('metas', metas.filter((m) => m.id !== meta.id), setMetas);
  const aportarMeta = (editada) => persist('metas', metas.map((m) => (m.id === editada.id ? editada : m)), setMetas);

  const importarCartao = (novas, atualizacoes = []) => {
    let base = cartaoTransacoes;
    if (atualizacoes.length > 0) {
      base = base.map((t) => {
        const upd = atualizacoes.find((a) => a.id === t.id);
        return upd ? { ...t, ...upd.patch } : t;
      });
    }
    persist('cartaoTransacoes', [...base, ...novas], setCartaoTransacoes);
  };
  const addManualCartao = (entry) => persist('cartaoTransacoes', [...cartaoTransacoes, entry], setCartaoTransacoes);
  const editarCategoriaCartao = (editada) => {
    const anterior = cartaoTransacoes.find((t) => t.id === editada.id);
    persist('cartaoTransacoes', cartaoTransacoes.map((t) => (t.id === editada.id ? editada : t)), setCartaoTransacoes);
    if (!anterior || anterior.categoria === editada.categoria) return;
    // Se a fatura já foi lançada em Contas a Pagar, move o valor da compra entre os lançamentos agrupados.
    const mk = anterior.mesFatura || anterior.data.slice(0, 7);
    const ehDoGrupo = (l, categoria) => l.tipo === 'pagar' && (l.grupoCartao
      ? l.grupoCartao.mk === mk && l.grupoCartao.categoria === categoria
      : l.descricao === `Cartão - ${categoria}` && l.data.slice(0, 7) === mk);
    const origem = lancamentos.find((l) => ehDoGrupo(l, anterior.categoria));
    if (!origem) return;
    const valor = anterior.valor;
    const destino = lancamentos.find((l) => ehDoGrupo(l, editada.categoria));
    const arred = (v) => Math.round(v * 100) / 100;
    let lista = lancamentos
      .map((l) => {
        if (l.id === origem.id) return { ...l, valor: arred(l.valor - valor) };
        if (destino && l.id === destino.id) return { ...l, valor: arred(l.valor + valor) };
        return l;
      })
      .filter((l) => !(l.id === origem.id && l.valor <= 0.005));
    if (!destino) {
      lista = [...lista, {
        id: uid(), tipo: 'pagar', descricao: `Cartão - ${editada.categoria}`, categoria: editada.categoria,
        valor: arred(valor), data: `${mk}-01`, quitado: !!origem.quitado, grupoCartao: { mk, categoria: editada.categoria },
      }];
    }
    persist('lancamentos', lista, setLancamentos);
  };
  const excluirCartao = (t) => persist('cartaoTransacoes', cartaoTransacoes.filter((x) => x.id !== t.id), setCartaoTransacoes);
  const limparCartaoMes = (mk) => persist('cartaoTransacoes', cartaoTransacoes.filter((t) => (t.mesFatura || t.data.slice(0, 7)) !== mk), setCartaoTransacoes);
  const replicarCartaoEmContasPagar = (linhasPorCategoria, mk) => {
    const novosLancamentos = linhasPorCategoria.map((l) => ({
      id: uid(), tipo: 'pagar', descricao: `Cartão - ${l.categoria}`, categoria: l.categoria,
      valor: l.valor, data: `${mk}-01`, quitado: false, grupoCartao: { mk, categoria: l.categoria },
    }));
    persist('lancamentos', [...lancamentos, ...novosLancamentos], setLancamentos);
  };

  // Histórico de categorias do cartão: o que já foi categorizado (inclusive meses apagados) é reaproveitado.
  const historicoCartaoEfetivo = useMemo(() => {
    const map = {};
    [...cartaoTransacoes].sort((a, b) => a.data.localeCompare(b.data)).forEach((t) => {
      const k = normalizarDescricao(t.descricao);
      if (k) map[k] = t.categoria;
    });
    return { ...map, ...cartaoHistorico };
  }, [cartaoTransacoes, cartaoHistorico]);
  const aprenderCartao = (lista) => {
    const novo = { ...cartaoHistorico };
    let mudou = false;
    lista.forEach((l) => {
      const k = normalizarDescricao(l.descricao);
      if (k && novo[k] !== l.categoria) { novo[k] = l.categoria; mudou = true; }
    });
    if (mudou) persist('cartaoHistorico', novo, setCartaoHistorico);
  };

  const addAtivo = (ativo) => persist('investAtivos', [...investAtivos, ativo], setInvestAtivos);
  const editAtivo = (editado) => persist('investAtivos', investAtivos.map((a) => (a.id === editado.id ? editado : a)), setInvestAtivos);
  const deleteAtivo = (ativo) => {
    if (window.confirm && !window.confirm(`Excluir o ativo "${ativo.nome}" e todo o seu histórico?`)) return;
    persist('investAtivos', investAtivos.filter((a) => a.id !== ativo.id), setInvestAtivos);
    persist('investMovimentacoes', investMovimentacoes.filter((m) => m.ativoId !== ativo.id), setInvestMovimentacoes);
  };
  const addMov = (mov) => persist('investMovimentacoes', [...investMovimentacoes, mov], setInvestMovimentacoes);
  const addMovs = (movs) => persist('investMovimentacoes', [...investMovimentacoes, ...movs], setInvestMovimentacoes);
  const deleteMov = (mov) => persist('investMovimentacoes', investMovimentacoes.filter((m) => m.id !== mov.id), setInvestMovimentacoes);
  const saveInvestMeta = (novaMeta) => persist('investMeta', novaMeta, setInvestMeta);
  const addEmprestimo = (e) => persist('investEmprestimos', [...investEmprestimos, e], setInvestEmprestimos);
  const editEmprestimo = (editado) => persist('investEmprestimos', investEmprestimos.map((x) => (x.id === editado.id ? editado : x)), setInvestEmprestimos);
  const deleteEmprestimo = (e) => persist('investEmprestimos', investEmprestimos.filter((x) => x.id !== e.id), setInvestEmprestimos);
  const receberEmprestimo = (emprestimo, valor) => {
    const recebidoAtual = emprestimo.valorRecebido || 0;
    const novoRecebido = Math.min(recebidoAtual + valor, emprestimo.valor);
    persist('investEmprestimos', investEmprestimos.map((x) => (x.id === emprestimo.id ? { ...x, valorRecebido: novoRecebido } : x)), setInvestEmprestimos);
  };

  const salvarFinanciamento = (novo) => persist('financiamento', novo, setFinanciamento);

  return (
    <div className="pf-root min-h-screen">
      <GlobalStyle />

      <header className="sticky top-0 z-10 bg-white/85 backdrop-blur-md border-b border-slate-200/70 shadow-sm shadow-slate-900/5">
        <div className="max-w-5xl mx-auto px-4 pt-3.5">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md shadow-emerald-600/30">
                <Icon name="Wallet" size={18} />
              </div>
              <h1 className="text-[15px] font-bold text-slate-800 tracking-tight">Finanças da Casa</h1>
            </div>
            <div className="flex items-center gap-2">
              <div className="text-[11px] text-slate-400 flex items-center gap-1 min-w-[70px] justify-end">
                {savingState === 'saving' && <><Icon name="Loader2" size={12} className="animate-spin" /> salvando…</>}
                {savingState === 'saved' && <><Icon name="Cloud" size={12} className="text-emerald-500" /> salvo</>}
                {savingState === 'error' && <><Icon name="CloudOff" size={12} className="text-red-500" /> erro ao salvar</>}
                {savingState === 'idle' && ultimaSincronia && (
                  <span title={ultimaSincronia.toLocaleString('pt-BR')}>
                    atualizado {ultimaSincronia.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}
                  </span>
                )}
              </div>
              <button
                onClick={() => carregarDados(true)}
                title="Buscar atualizações agora"
                className="w-8 h-8 flex items-center justify-center rounded-lg text-emerald-600 hover:bg-emerald-50 transition"
              >
                <Icon name="RefreshCw" size={15} />
              </button>
            </div>
          </div>

          <nav className="flex gap-1 mt-3 pb-2.5 overflow-x-auto pf-scroll -mx-4 px-4">
            {TABS.map((t) => {
              const active = tab === t.id;
              return (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`flex items-center gap-1.5 px-3 py-2 text-xs font-medium whitespace-nowrap rounded-xl transition ${active ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/25' : 'text-slate-500 hover:text-emerald-700 hover:bg-emerald-50'}`}
                >
                  <Icon name={t.icon} size={14} /> {t.label}
                </button>
              );
            })}
          </nav>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 pt-5">
        {errorMsg && (
          <div className="mb-4 flex items-start gap-2 bg-red-50 border border-red-100 text-red-600 text-xs rounded-xl px-3 py-2.5">
            <Icon name="AlertTriangle" size={14} className="mt-0.5 shrink-0" />
            <span className="flex-1">{errorMsg}</span>
            {pendentes.length > 0 && (
              <button
                onClick={retentarPendentes}
                className="flex items-center gap-1 shrink-0 bg-red-100 hover:bg-red-200 text-red-700 font-medium px-2 py-1 rounded-lg"
              >
                <Icon name="RefreshCw" size={12} /> Tentar novamente
              </button>
            )}
            <button onClick={() => setErrorMsg(null)} className="shrink-0 text-red-400 hover:text-red-600"><Icon name="X" size={13} /></button>
          </div>
        )}

        {loading ? (
          <div className="flex items-center justify-center py-24 text-emerald-500">
            <Icon name="Loader2" size={22} className="animate-spin" />
          </div>
        ) : (
          <>
            {tab === 'dashboard' && (
              <DashboardTab
                lancamentos={lancamentos}
                orcamentos={orcamentos}
                onSetOrcamento={setOrcamento}
                config={config}
                onSetSaldoInicial={setSaldoInicial}
              />
            )}
            {tab === 'receber' && (
              <ContasTable
                tipo="receber"
                categorias={CATEGORIAS_RECEBER}
                lancamentos={lancamentos}
                onAdd={addLancamentos}
                onEdit={editLancamento}
                onToggleQuitado={toggleQuitado}
                onDuplicate={duplicar}
                onDelete={excluir}
              />
            )}
            {tab === 'pagar' && (
              <ContasTable
                tipo="pagar"
                categorias={CATEGORIAS_PAGAR}
                lancamentos={lancamentos}
                cartaoTransacoes={cartaoTransacoes}
                onAdd={addLancamentos}
                onEdit={editLancamento}
                onToggleQuitado={toggleQuitado}
                onDuplicate={duplicar}
                onDelete={excluir}
              />
            )}
            {tab === 'cartao' && (
              <CartaoTab
                transacoes={cartaoTransacoes}
                orcamentos={orcamentos}
                historico={historicoCartaoEfetivo}
                onAprender={aprenderCartao}
                onImport={importarCartao}
                onAddManual={addManualCartao}
                onReplicar={replicarCartaoEmContasPagar}
                onEditCategoria={editarCategoriaCartao}
                onDelete={excluirCartao}
                onClearMes={limparCartaoMes}
              />
            )}
            {tab === 'investimentos' && (
              <InvestimentosTab
                ativos={investAtivos}
                movimentacoes={investMovimentacoes}
                meta={investMeta}
                emprestimos={investEmprestimos}
                onAddAtivo={addAtivo}
                onEditAtivo={editAtivo}
                onDeleteAtivo={deleteAtivo}
                onAddMov={addMov}
                onAddMovs={addMovs}
                onDeleteMov={deleteMov}
                onSaveMeta={saveInvestMeta}
                onAddEmprestimo={addEmprestimo}
                onEditEmprestimo={editEmprestimo}
                onDeleteEmprestimo={deleteEmprestimo}
                onReceberEmprestimo={receberEmprestimo}
              />
            )}
            {tab === 'financiamento' && (
              <FinanciamentoTab dados={financiamento} onSave={salvarFinanciamento} />
            )}
            {tab === 'metas' && (
              <MetasTab
                metas={metas}
                onAdd={addMeta}
                onEdit={editMeta}
                onDelete={deleteMeta}
                onAportar={aportarMeta}
              />
            )}
          </>
        )}
      </main>
    </div>
  );
}


const raizApp = ReactDOM.createRoot(document.getElementById('root'));
raizApp.render(<App />);
